<style>

.popup.combo{color:#9cf}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,8,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:env(safe-area-inset-top,16px) env(safe-area-inset-right,16px) env(safe-area-inset-bottom,16px) env(safe-area-inset-left,16px)}
#overlay.hidden{display:none}
.card{background:linear-gradient(160deg,rgba(20,30,55,.95),rgba(10,16,32,.98));border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:28px 24px;max-width:min(640px,94vw);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:clamp(26px,5vw,42px);margin-bottom:6px;background:linear-gradient(90deg,#fff,#9cf);-webkit-background-clip:text;background-clip:text;color:transparent}

button.menu:active{transform:translateY(3px);box-shadow:0 3px 0 #164a90}

#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:16px auto;max-width:420px}

.oneMore{font-size:clamp(15px,2.8vw,20px);font-weight:800;color:#9cf;margin-top:4px;letter-spacing:.04em}
#speedLines{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.04) 40px,rgba(255,255,255,.04) 42px);mix-blend-mode:screen}

<body>
<div id="rotate"><div class="icon">📱</div><p>Turn your device sideways to play Roadster Stunt Paradise</p></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="speedLines"></div>
<div id="hudTop" class="hud">
  <div class="panel" id="scorePanel">0</div>
  <div class="panel" id="multPanel">×1</div>
  <div class="panel" id="gradePanel">☆☆☆</div>
  <button id="pauseBtn" aria-label="Pause">⏸</button>
</div>
<div id="fuelWrap"><div id="fuelBar"><div id="fuelFill"></div></div><div id="fuelLabel">THRUSTER FUEL</div></div>
<div id="combo">COMBO ×2</div>
<button id="tiltToggle" type="button" aria-pressed="false">TILT OFF</button>
<div id="starHud">☆☆☆</div>
<div id="controls">
  <div id="padGas" class="pad">GAS<br>▲</div>
  <div id="padBrake" class="pad">BRAKE<br>▼</div>
  <div id="padLeanBack" class="pad">LEAN BACK<br>↺</div>
  <div id="padLeanFwd" class="pad">LEAN FWD<br>↻</div>
  <button id="btnThrust" type="button">THRUST<br>🔥</button>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script type="module">
import * as THREE from 'three';

const STORE_KEY = 'rsp.v6.scores';
function loadScores(){
  try{ const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : {levels:{}, endless:0}; }
  catch(e){ return {levels:{}, endless:0}; }
}
function saveScores(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let scores = loadScores();

/* ===== AudioBoot ===== */
const audio = (()=>{
  let ctx=null, master=null, pending=[], resumeP=null, muted=false;
  const AC = ()=> window.AudioContext || window.webkitAudioContext;
  function build(){ if(ctx) return; const C=AC(); if(!C) return; ctx=new C(); master=ctx.createGain(); master.gain.value=0.72; master.connect(ctx.destination); }
  function silentUnlock(){ if(!ctx) return; try{ const b=ctx.createBuffer(1,1,22050); const s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0);}catch(e){} }
  function resume(){
    if(!ctx) return Promise.resolve(false);
    if(ctx.state==='running') return Promise.resolve(true);
    if(resumeP) return resumeP;
    let p; try{ p=ctx.resume(); }catch(e){ return Promise.resolve(false); }
    resumeP = Promise.resolve(p).then(()=>{ resumeP=null; if(ctx.state==='running'){ flush(); return true;} return false; }).catch(()=>{ resumeP=null; return false; });
    return resumeP;
  }
  function flush(){ while(pending.length){ try{ pending.shift()(); }catch(e){} } }
  function gesture(){ build(); silentUnlock(); resume(); }
  function whenReady(fn){ build(); if(ctx && ctx.state==='running') fn(); else pending.push(fn); resume(); }
  function tone(freq, dur, type='sine', vol=0.15, slide=0){
    whenReady(()=>{
      if(muted||!ctx) return;
      const t0=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t0+dur);
      g.gain.setValueAtTime(0.001,t0);
      g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
    });
  }
  function noise(dur, vol=0.12){
    whenReady(()=>{
      if(muted||!ctx) return;
      const n=Math.floor(ctx.sampleRate*dur), buf=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.4);
      const s=ctx.createBufferSource(); s.buffer=buf;
      const g=ctx.createGain(); g.gain.value=vol; s.connect(g); g.connect(master); s.start();
    });
  }
  return {
    gesture, muted:()=>muted, setMuted(v){ muted=!!v; },
    ui(){ tone(660,0.06,'triangle',0.08); },
    thrust(){ noise(0.08,0.1); tone(90,0.12,'sawtooth',0.08,40); },
    boost(){ noise(0.15,0.14); tone(140,0.18,'sawtooth',0.12,120); tone(420,0.1,'sine',0.06); },
    flip(){ tone(520,0.08,'square',0.1); tone(780,0.1,'triangle',0.08); },
    star(){ tone(880,0.08,'sine',0.1); tone(1320,0.12,'sine',0.08); },
    land(){ noise(0.14,0.22); tone(100,0.14,'triangle',0.18,45); tone(220,0.06,'sine',0.1); },
    crash(){ noise(0.35,0.28); tone(80,0.3,'sawtooth',0.2,-50); },
    smash(){ noise(0.22,0.3); tone(160,0.12,'sawtooth',0.18,-80); tone(60,0.2,'square',0.12); },
    checkpoint(){ tone(640,0.08,'sine',0.1); tone(960,0.12,'triangle',0.1); tone(1280,0.1,'sine',0.07); },
    softpop(){ tone(520,0.06,'sine',0.08); tone(780,0.1,'triangle',0.07); noise(0.08,0.08); },
    win(){ tone(523,0.12,'triangle',0.12); setTimeout(()=>tone(659,0.12,'triangle',0.12),90); setTimeout(()=>tone(784,0.22,'triangle',0.14),180); },
    tick(){ tone(180,0.03,'square',0.04); }
  };
})();

function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ===== Input — Stunt Paradise faithful =====
   Gas W/↑, Brake/reverse S/↓, Lean back (backflip) A/←, Lean forward (frontflip) D/→
   Mobile landscape: left gas+brake, right lean-back + lean-forward, center thruster */
const input = { gas:false, brake:false, thrust:false, lean:0, tiltLean:0, tiltEnabled:false, tiltOk:false };
const padGas = document.getElementById('padGas');
const padBrake = document.getElementById('padBrake');
const padLeanBack = document.getElementById('padLeanBack');
const padLeanFwd = document.getElementById('padLeanFwd');
const btnThrust = document.getElementById('btnThrust');

function bindHold(el, on, off){
  const down = e=>{ e.preventDefault(); audio.gesture(); on(e); el.classList.add('on'); };
  const up = e=>{ e.preventDefault(); off(e); el.classList.remove('on'); };
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up, {passive:false});
  el.addEventListener('touchcancel', up, {passive:false});
  el.addEventListener('mousedown', down);
  window.addEventListener('mouseup', up);
}
bindHold(padGas, ()=>{ input.gas=true; }, ()=>{ input.gas=false; });
bindHold(padBrake, ()=>{ input.brake=true; }, ()=>{ input.brake=false; });
bindHold(padLeanBack, ()=>{ input.lean=-1; }, ()=>{ if(input.lean<0) input.lean=0; });
bindHold(padLeanFwd, ()=>{ input.lean=1; }, ()=>{ if(input.lean>0) input.lean=0; });
bindHold(btnThrust, ()=>{ input.thrust=true; btnThrust.classList.add('on'); audio.thrust(); haptic(8); }, ()=>{ input.thrust=false; btnThrust.classList.remove('on'); });

function effectiveLean(){
  let L = input.lean;
  if(input.tiltEnabled && Math.abs(input.tiltLean) > Math.abs(L)) L = input.tiltLean;
  return L;
}

window.addEventListener('keydown', e=>{
  audio.gesture();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ input.lean=-1; padLeanBack.classList.add('on'); }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ input.lean=1; padLeanFwd.classList.add('on'); }
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){ input.gas=true; padGas.classList.add('on'); e.preventDefault(); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ input.brake=true; padBrake.classList.add('on'); e.preventDefault(); }
  if(e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ if(!input.thrust){ audio.thrust(); haptic(8);} input.thrust=true; btnThrust.classList.add('on'); }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state.mode==='play') togglePause(); }
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ if(input.lean<0) input.lean=0; padLeanBack.classList.remove('on'); }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ if(input.lean>0) input.lean=0; padLeanFwd.classList.remove('on'); }
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){ input.gas=false; padGas.classList.remove('on'); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ input.brake=false; padBrake.classList.remove('on'); }
  if(e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ input.thrust=false; btnThrust.classList.remove('on'); }
});

let tiltListening=false;
function onTilt(ev){
  if(!input.tiltEnabled) return;
  const g=ev.gamma, b=ev.beta;
  if(g==null && b==null) return;
  const landscape = Math.abs(window.orientation||0)===90 || window.innerWidth>window.innerHeight;
  const v = landscape ? (typeof b==='number'?b:g) : (typeof g==='number'?g:b);
  input.tiltLean = Math.max(-1, Math.min(1, (v||0)/26));
  input.tiltOk = true;
}
function ensureTiltListener(){ if(tiltListening) return; tiltListening=true; window.addEventListener('deviceorientation', onTilt, true); }
function setTiltEnabled(on){
  input.tiltEnabled=!!on;
  const btn=document.getElementById('tiltToggle');
  btn.classList.toggle('on', input.tiltEnabled);
  btn.setAttribute('aria-pressed', input.tiltEnabled?'true':'false');
  btn.textContent = input.tiltEnabled ? 'TILT ON' : 'TILT OFF';
  if(input.tiltEnabled){
    ensureTiltListener();
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(st=>{ if(st!=='granted') setTiltEnabled(false); }).catch(()=>setTiltEnabled(false));
    }
  } else { input.tiltLean=0; input.tiltOk=false; }
}
document.getElementById('tiltToggle').addEventListener('click', ()=>{ audio.gesture(); audio.ui(); setTiltEnabled(!input.tiltEnabled); });
document.getElementById('pauseBtn').addEventListener('click', ()=>{ audio.gesture(); if(state.mode==='play') togglePause(); });

/* ===== Themes ===== */
const THEMES = {
  desert:  { sky:0xf0c878, fog:0xe8d0a0, amb:0xffe8c0, dir:0xfff0d0, ground:0xc4a060, track:0x6a5438, rail:0xd4b070, accent:0xe8a040 },
  beach:   { sky:0x40c8e8, fog:0x88d8f0, amb:0xc8f0ff, dir:0xfff8e0, ground:0xe8d090, track:0x5a8ab0, rail:0xffd070, accent:0x40e0c0 },
  industrial:{ sky:0x8890a0, fog:0x6a7080, amb:0xb0b8c8, dir:0xe0e8f0, ground:0x4a4e58, track:0x3a3e48, rail:0xc0a040, accent:0xff8040 },
  cyber:   { sky:0x1a1040, fog:0x2a1860, amb:0x4060c0, dir:0xa0c0ff, ground:0x121828, track:0x1a2040, rail:0x40f0ff, accent:0xff40c0 },
  candy:   { sky:0xf090b0, fog:0xffc0d8, amb:0xffd0e8, dir:0xfff0f8, ground:0xe080b0, track:0x904070, rail:0xffe080, accent:0xff60c0 },
  ice:     { sky:0xb0d8f0, fog:0xd8eef8, amb:0xe8f4ff, dir:0xffffff, ground:0xc0d8e8, track:0x7090b0, rail:0xe0f0ff, accent:0x60c0ff },
  volcano: { sky:0xc04020, fog:0x801810, amb:0xe06030, dir:0xffc080, ground:0x3a2018, track:0x2a1810, rail:0xff6030, accent:0xffe040 },
  paradise:{ sky:0x20a0c0, fog:0x40d0c8, amb:0xa0f0e0, dir:0xe8ffe8, ground:0x2a8058, track:0x1a6040, rail:0x80ffc0, accent:0xffe080 }
};

/* ===== Level builders ===== */
function L(name, theme, segments, stars, smashables, tip, checkpoints, boostPads, routes, props){
  // segments: array of waypoint arrays (gaps between segments = air launches)
  if(segments.length && segments[0] && segments[0].isVector3){
    segments = [segments]; // allow single path
  }
  return { name, theme, segments, stars:stars||[], smashables:smashables||[], tip:tip||'',
    checkpoints:checkpoints||[], boostPads:boostPads||[], routes:routes||[], props:props||[] };
}
function P(x,y,z=0){ return new THREE.Vector3(x,y,z); }
function flat(x0,y0,len,n=6,z=0){
  const a=[]; for(let i=0;i<=n;i++) a.push(P(x0+len*(i/n), y0, z)); return a;
}
function ramp(x0,y0,len,rise,n=10,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0+rise*t*t, z)); } return a;
}
function down(x0,y0,len,drop,n=10,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0-drop*t*t, z)); } return a;
}
function hump(x0,y0,len,h,n=14,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0+Math.sin(t*Math.PI)*h, z)); } return a;
}
function loop(cx, cy, r, startAng, endAng, n=36, z=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const ang = startAng + (endAng-startAng)*t;
    a.push(P(cx + Math.sin(ang)*r, cy - Math.cos(ang)*r, z));
  }
  return a;
}
/** Corkscrew helix — SP signature spectacle */
function corkscrew(x0, y0, len, radius, turns, n=48, z0=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const ang = t * turns * Math.PI * 2;
    a.push(P(x0 + len*t, y0 + Math.sin(ang)*radius, z0 + Math.cos(ang)*radius - radius));
  }
  return a;
}
/** Banked wall-ride segment */
function wallRide(x0, y0, len, height, side=1, n=36, z0=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const bank = Math.sin(t * Math.PI);
    const y = y0 + height * Math.sin(t * Math.PI) * 0.85;
    const z = z0 + side * bank * (5.0 * 0.15 + 4.5);
    a.push(P(x0 + len*t, y, z));
  }
  return a;
}
function join(...segs){
  const out=[];
  for(const seg of segs){
    for(let j=0;j<seg.length;j++){
      if(out.length && j===0) continue;
      out.push(seg[j]);
    }
  }
  return out;
}

}

  if(particles.length>=MAX_P) particles.shift();

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=4*dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=0;i<MAX_P;i++){
    const p=particles[i];
    if(p){
      pPos[i*3]=p.x; pPos[i*3+1]=p.y; pPos[i*3+2]=p.z;
      const a=p.life/p.max;
      pCol[i*3]=p.r*a; pCol[i*3+1]=p.g*a; pCol[i*3+2]=p.b*a;
    } else {
      pPos[i*3]=0; pPos[i*3+1]=-999; pPos[i*3+2]=0;
      pCol[i*3]=0; pCol[i*3+1]=0; pCol[i*3+2]=0;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}

/* Track sampling — multi-segment with Frenet frames */
function buildSegment(waypoints){
  const curve = new THREE.CatmullRomCurve3(waypoints, false, 'catmullrom', 0.15);
  const len = Math.max(0.01, curve.getLength());
  const n = Math.max(40, Math.floor(len * 3));
  const frames = [];
  const worldUp = new THREE.Vector3(0,1,0);
  // Parallel-transport frames with world-up bias so flats stay upright (Frenet flips on straightaways)
  let prevBin = null;
  for(let i=0;i<=n;i++){
    const t=i/n;
    const pos = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let binormal, normal;
    // Prefer world-up crossed with tangent for banked/sideways
    const side = new THREE.Vector3().crossVectors(worldUp, tangent);
    if(side.lengthSq() < 1e-6){
      // Vertical tangent (loop top/bottom) — fall back to previous binormal or +Z
      binormal = (prevBin ? prevBin.clone() : new THREE.Vector3(0,0,1));
      // Gram-Schmidt against tangent
      binormal.addScaledVector(tangent, -binormal.dot(tangent)).normalize();
      if(binormal.lengthSq() < 1e-6) binormal.set(0,0,1);
    } else {
      binormal = side.normalize();
      // Keep consistent side vs previous
      if(prevBin && binormal.dot(prevBin) < 0) binormal.negate();
    }
    normal = new THREE.Vector3().crossVectors(tangent, binormal).normalize();
    // In loops, when upside-down, normal should point "inward" (toward track underside relative to car).
    // World-up method already gives correct radial normal for vertical circles when tangent × side works.
    prevBin = binormal.clone();
    frames.push({ s:t*len, t, pos, tangent, normal, binormal });
  }
  return { curve, frames, length:len };
}
function buildFrames(segments){
  const segs = [];
  let total = 0;
  for(let si=0; si<segments.length; si++){
    const seg = buildSegment(segments[si]);
    seg.index = si;
    seg.s0 = total;
    // tag frames with global s and seg index
    for(const f of seg.frames){
      f.seg = si;
      f.globalS = total + f.s;
    }
    total += seg.length;
    segs.push(seg);
  }
  return { segs, length: total, frames: segs.flatMap(s=>s.frames) };
}
function sampleSegment(seg, sLocal){
  const frames = seg.frames;
  const len = seg.length;
  const ss = Math.max(0, Math.min(len, sLocal));
  const t = ss / len;
  const idx = t * (frames.length-1);
  const i0 = Math.floor(idx);
  const i1 = Math.min(frames.length-1, i0+1);
  const f = idx - i0;
  const A=frames[i0], B=frames[i1];
  return {
    s: ss, globalS: seg.s0 + ss, seg: seg.index,
    pos: A.pos.clone().lerp(B.pos, f),
    tangent: A.tangent.clone().lerp(B.tangent, f).normalize(),
    normal: A.normal.clone().lerp(B.normal, f).normalize(),
    binormal: A.binormal.clone().lerp(B.binormal, f).normalize(),
    atEnd: ss >= len - 0.35
  };
}
function sampleFrames(framesData, globalS){
  // map global s onto segments
  let rem = Math.max(0, globalS);
  for(const seg of framesData.segs){
    if(rem <= seg.length || seg === framesData.segs[framesData.segs.length-1]){
      return sampleSegment(seg, Math.min(rem, seg.length));
    }
    rem -= seg.length;
  }
  return sampleSegment(framesData.segs[framesData.segs.length-1], framesData.segs[framesData.segs.length-1].length);
}

  const matRail = new THREE.MeshStandardMaterial({ color:theme.rail, metalness:0.55, roughness:0.35, emissive:theme.rail, emissiveIntensity:0.32 });
  const matAccent = new THREE.MeshStandardMaterial({ color:theme.accent, metalness:0.35, roughness:0.45, emissive:theme.accent, emissiveIntensity:0.32 });
  const matStripe = new THREE.MeshStandardMaterial({ color:0xf5f0e6, metalness:0.1, roughness:0.45 });
  const matEdge = new THREE.MeshStandardMaterial({ color:theme.rail, metalness:0.4, roughness:0.4, emissive:theme.rail, emissiveIntensity:0.18 });

  for(const seg of framesData.segs){
    // Flat ribbon planks with thickness — car rides on TOP
    for(let i=0;i<seg.frames.length-1;i++){
      const a=seg.frames[i], b=seg.frames[i+1];
      const mid = a.pos.clone().lerp(b.pos, 0.5);
      const dist = Math.max(0.35, a.pos.distanceTo(b.pos) + 0.08);
      const plank = new THREE.Mesh(new THREE.BoxGeometry(dist, TRACK_T, TRACK_W), matTrack);
      const m4 = new THREE.Matrix4().makeBasis(a.tangent.clone().normalize(), a.normal.clone().normalize(), a.binormal.clone().normalize());
      plank.quaternion.setFromRotationMatrix(m4);
      // sit so TOP surface is near path
      plank.position.copy(mid).add(a.normal.clone().multiplyScalar(-TRACK_T * 0.5));
      plank.castShadow = true; plank.receiveShadow = true;
      trackGroup.add(plank);

      if(i % 2 === 0){
        const under = new THREE.Mesh(new THREE.BoxGeometry(dist*0.95, 0.12, TRACK_W*0.92), matUnder);
        under.quaternion.copy(plank.quaternion);
        under.position.copy(mid).add(a.normal.clone().multiplyScalar(-TRACK_T - 0.05));
        trackGroup.add(under);
      }

      if(i % 3 === 0){
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(dist * 0.7, 0.05, 0.28), matStripe);
        stripe.quaternion.copy(plank.quaternion);
        stripe.position.copy(mid).add(a.normal.clone().multiplyScalar(0.02));
        trackGroup.add(stripe);
      }
      // side curbs
      if(i % 2 === 0){
        for(const side of [-1,1]){
          const curb = new THREE.Mesh(new THREE.BoxGeometry(dist + 0.06, 0.38, 0.22), matEdge);
          curb.quaternion.copy(plank.quaternion);
          curb.position.copy(mid)
            .add(a.normal.clone().multiplyScalar(0.08))
            .add(a.binormal.clone().multiplyScalar(side * (TRACK_W * 0.5 - 0.08)));
          trackGroup.add(curb);
        }
      }
    }
    // Glow rail tubes along edges (thin, above surface)
    for(const side of [-1, 1]){
      const pts = seg.frames.map(f => f.pos.clone()
        .add(f.normal.clone().multiplyScalar(0.28))
        .add(f.binormal.clone().multiplyScalar(side * TRACK_W * 0.5)));
      if(pts.length < 2) continue;
      const railCurve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
      const rail = new THREE.Mesh(
        new THREE.TubeGeometry(railCurve, Math.max(40, Math.floor(seg.length * 2.5)), 0.1, 6, false),
        matRail
      );
      trackGroup.add(rail);
    }
  }

  const ground = new THREE.Mesh(
    new THREE.CylinderGeometry(280, 280, 2, 64),
    new THREE.MeshStandardMaterial({ color: theme.ground, roughness: 1, metalness: 0 })
  );
  ground.position.set(framesData.length * 0.3, -12, 0);
  ground.receiveShadow = true;
  decorGroup.add(ground);

  for(let i=0;i<24;i++){
    const f = framesData.frames[(i * 41) % framesData.frames.length];
    const side = (i % 2 === 0) ? -1 : 1;
    const h = 5 + (i % 6) * 2.2;
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.2, h, 1.2), i % 3 === 0 ? matAccent : matRail);
    pillar.position.copy(f.pos)
      .add(f.binormal.clone().multiplyScalar(side * (11 + (i % 4) * 2.5)))
      .add(f.normal.clone().multiplyScalar(h * 0.4));
    pillar.castShadow = true;
    decorGroup.add(pillar);
  }

  const end = framesData.frames[framesData.frames.length - 1];
  const arch = new THREE.Group();
  const postGeo = new THREE.BoxGeometry(0.85, 10, 0.85);
  const postL = new THREE.Mesh(postGeo, matRail); postL.position.set(0, 5, -3.6); arch.add(postL);
  const postR = new THREE.Mesh(postGeo, matRail); postR.position.set(0, 5, 3.6); arch.add(postR);
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 8.2), matAccent); top.position.set(0, 10, 0); arch.add(top);
  const banner = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.2, 6.5), matAccent); banner.position.set(0, 8.2, 0); arch.add(banner);
  const chevMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:theme.accent, emissiveIntensity:1.4, metalness:0.2, roughness:0.3 });
  for(let c=0;c<3;c++){
    const chev = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 1.8 - c*0.35), chevMat);
    chev.position.set(-0.6 - c*0.55, 1.2, 0);
    arch.add(chev);
  }
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.12, 8, 24), matAccent);
  ring.rotation.y = Math.PI/2; ring.position.set(0.4, 4.5, 0); arch.add(ring);
  arch.position.copy(end.pos);
  arch.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(end.tangent, end.normal, end.binormal));
  decorGroup.add(arch);
}

function nearestFrameToXY(framesData, x, y){
  let best=framesData.frames[0], bd=1e9;
  for(const f of framesData.frames){
    const d=Math.abs(f.pos.x-x)+Math.abs(f.pos.y-(y||0))*0.5;
    if(d<bd){ bd=d; best=f; }
  }
  return best;
}

function buildPickups(level, framesData){
  clearGroup(pickupGroup);
  const starMat = new THREE.MeshStandardMaterial({ color:0xffd76a, emissive:0xffaa20, emissiveIntensity:0.8, metalness:0.4, roughness:0.3 });
  const barrelMat = new THREE.MeshStandardMaterial({ color:0xc03018, emissive:0x801000, emissiveIntensity:0.35, metalness:0.3, roughness:0.55 });
  const crateMat = new THREE.MeshStandardMaterial({ color:0xc8a050, emissive:0x403010, emissiveIntensity:0.15, metalness:0.15, roughness:0.7 });
  const stripeMat = new THREE.MeshStandardMaterial({ color:0xffe040, emissive:0xaa8000, emissiveIntensity:0.4, metalness:0.2, roughness:0.5 });
  const coneMat = new THREE.MeshStandardMaterial({ color:0xff6a18, emissive:0xaa3000, emissiveIntensity:0.45, metalness:0.15, roughness:0.55 });
  const coneStripe = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x666666, emissiveIntensity:0.2, metalness:0.1, roughness:0.6 });
  const tireMat = new THREE.MeshStandardMaterial({ color:0x1a1a1e, emissive:0x050508, emissiveIntensity:0.15, metalness:0.05, roughness:0.92 });
  const tireRim = new THREE.MeshStandardMaterial({ color:0xc0c4cc, emissive:0x303038, emissiveIntensity:0.2, metalness:0.7, roughness:0.35 });
  const cpMat = new THREE.MeshStandardMaterial({ color:0x40e8ff, emissive:0x20c0ff, emissiveIntensity:1.1, metalness:0.3, roughness:0.25, transparent:true, opacity:0.85, side:THREE.DoubleSide });
  const boostMat = new THREE.MeshStandardMaterial({ color:0xffe040, emissive:0xffaa00, emissiveIntensity:1.2, metalness:0.35, roughness:0.3, transparent:true, opacity:0.9 });

  level._starMeshes = [];
  for(const s of level.stars){
    const best=nearestFrameToXY(framesData, s.x, s.y);
    const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.55,0), starMat);
    const yOff = (s.y!=null ? (s.y - best.pos.y) : 2.2);
    star.position.copy(best.pos).add(best.normal.clone().multiplyScalar(Math.max(1.5, yOff*0.15+1.8)));
    star.userData = { kind:'star', taken:false, base:star.position.clone() };
    pickupGroup.add(star);
    level._starMeshes.push(star);
  }

  level._smashMeshes = [];
  for(const sm of (level.smashables||[])){
    const best=nearestFrameToXY(framesData, sm.x, sm.y);
    const kind = sm.kind || 'barrel';
    let mesh;
    if(kind==='crate'){
      mesh = new THREE.Group();
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.3,1.3,1.3), crateMat);
      box.castShadow=true; mesh.add(box);
      const band = new THREE.Mesh(new THREE.BoxGeometry(1.35,0.15,1.35), stripeMat);
      band.position.y=0.15; mesh.add(band);
    } else if(kind==='cone'){
      mesh = new THREE.Group();
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55,1.35,10), coneMat);
      cone.castShadow=true; cone.position.y=0.1; mesh.add(cone);
      const stripe = new THREE.Mesh(new THREE.TorusGeometry(0.38,0.05,6,14), coneStripe);
      stripe.rotation.x=Math.PI/2; stripe.position.y=0.35; mesh.add(stripe);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.12,12), coneStripe);
      base.position.y=-0.55; mesh.add(base);
    } else if(kind==='tire'){
      mesh = new THREE.Group();
      for(let i=0;i<3;i++){
        const tire = new THREE.Mesh(new THREE.TorusGeometry(0.55,0.22,8,16), tireMat);
        tire.rotation.x=Math.PI/2; tire.position.y=-0.35+i*0.48; tire.castShadow=true; mesh.add(tire);
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.1,12), tireRim);
        rim.rotation.x=Math.PI/2; rim.position.y=tire.position.y; mesh.add(rim);
      }
    } else {
      mesh = new THREE.Group();
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.35,12), barrelMat);
      cyl.castShadow=true; mesh.add(cyl);
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.56,0.06,6,16), stripeMat);
      band.rotation.x=Math.PI/2; band.position.y=0.25; mesh.add(band);
      const band2 = band.clone(); band2.position.y=-0.25; mesh.add(band2);
    }
    const side = (sm.side != null ? sm.side : ((level._smashMeshes.length%2)?-1:1));
    mesh.position.copy(best.pos)
      .add(best.normal.clone().multiplyScalar(0.95))
      .add(best.binormal.clone().multiplyScalar(side * (TRACK_W * 0.28)));
    if(sm.y != null && Math.abs(sm.y - best.pos.y) > 6){
      mesh.position.set(sm.x, sm.y, side * 2.0);
    }
    mesh.userData = { kind:'smash', smashed:false, type:kind, r: kind==='tire'?1.35:1.15 };
    pickupGroup.add(mesh);
    level._smashMeshes.push(mesh);
  }

  // Checkpoint glowing gate rings (~mid-track)
  level._cpMeshes = [];
  (level.checkpoints||[]).forEach((cp, idx)=>{
    const best=nearestFrameToXY(framesData, cp.x, cp.y);
    const gate = new THREE.Group();
    const torus = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.14, 10, 36), cpMat);
    torus.rotation.y = Math.PI/2;
    gate.add(torus);
    const inner = new THREE.Mesh(new THREE.TorusGeometry(2.15, 0.06, 8, 28),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x80ffff, emissiveIntensity:0.9, transparent:true, opacity:0.55 }));
    inner.rotation.y = Math.PI/2; gate.add(inner);
    gate.position.copy(best.pos).add(best.normal.clone().multiplyScalar(2.4));
    gate.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(best.tangent, best.normal, best.binormal));
    gate.userData = {
      kind:'checkpoint', taken:false, idx,
      s: best.s, segIndex: best.seg!=null?best.seg:0, fuelFloor:0.45
    };
    pickupGroup.add(gate);
    level._cpMeshes.push(gate);
  });

  // Ground boost pads
  level._boostMeshes = [];
  for(const bp of (level.boostPads||[])){
    const best=nearestFrameToXY(framesData, bp.x, bp.y);
    const pad = new THREE.Group();
    const plate = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 1.8), boostMat);
    pad.add(plate);
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 3),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffee88, emissiveIntensity:0.8 }));
    arrow.rotation.z = -Math.PI/2; arrow.position.set(0.35, 0.18, 0); pad.add(arrow);
    pad.position.copy(best.pos).add(best.normal.clone().multiplyScalar(0.18));
    pad.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(best.tangent, best.normal, best.binormal));
    pad.userData = { kind:'boost', cool:0, s:best.s, segIndex:best.seg!=null?best.seg:0 };
    pickupGroup.add(pad);
    level._boostMeshes.push(pad);
  }

  // Mid-air star route markers (chevrons / rings) — visual only
  level._routeMeshes = [];
  const routeMat = new THREE.MeshStandardMaterial({ color:0x80ffe0, emissive:0x40ffc0, emissiveIntensity:1.15, metalness:0.25, roughness:0.3, transparent:true, opacity:0.88 });
  const routes = (level.routes && level.routes.length) ? level.routes.slice() : [];
  // Auto-add a cue near elevated stars if designer left routes empty-ish
  if(routes.length < 2){
    for(const s of level.stars){
      if(s.y != null && s.y >= 10) routes.push({x:s.x - 8, y:s.y - 2});
    }
  }
  for(const r of routes){
    const best=nearestFrameToXY(framesData, r.x, r.y||0);
    const g = new THREE.Group();
    // chevron (arrow) pointing roughly along track
    const chev = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.15, 3), routeMat);
    chev.rotation.z = -Math.PI/2;
    g.add(chev);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.07, 8, 20),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x80ffe8, emissiveIntensity:0.7, transparent:true, opacity:0.55 }));
    ring.rotation.y = Math.PI/2; g.add(ring);
    const yOff = (r.y!=null ? Math.max(2.5, r.y - best.pos.y) : 4.5);
    g.position.copy(best.pos).add(best.normal.clone().multiplyScalar(Math.min(8, yOff*0.35 + 3.2)));
    // Prefer absolute height for air paths when designer gave y
    if(r.y != null) g.position.y = Math.max(g.position.y, r.y);
    g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(best.tangent, best.normal, best.binormal));
    g.userData = { kind:'route', base:g.position.clone(), phase:Math.random()*Math.PI*2 };
    pickupGroup.add(g);
    level._routeMeshes.push(g);
  }

  // Kid-safe moving spectacle props — soft bounce / score pop, never lethal
  level._propMeshes = [];
  const balloonMat = new THREE.MeshStandardMaterial({ color:0xff6ab0, emissive:0xff3080, emissiveIntensity:0.55, metalness:0.15, roughness:0.35 });
  const boardMat = new THREE.MeshStandardMaterial({ color:0x40c8ff, emissive:0x2080c0, emissiveIntensity:0.45, metalness:0.2, roughness:0.45 });
  const spinMat = new THREE.MeshStandardMaterial({ color:0xffe080, emissive:0xffaa40, emissiveIntensity:0.7, metalness:0.35, roughness:0.3, transparent:true, opacity:0.9 });
  for(const pr of (level.props||[])){
    const best=nearestFrameToXY(framesData, pr.x, pr.y||0);
    const kind = pr.kind || 'balloon';
    const g = new THREE.Group();
    if(kind==='billboard'){
      const board = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.4, 0.12), boardMat);
      g.add(board);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,2.2,8),
        new THREE.MeshStandardMaterial({ color:0x888890, metalness:0.5, roughness:0.4 }));
      pole.position.y = -1.6; g.add(pole);
    } else if(kind==='spinner'){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.12, 8, 24), spinMat);
      g.add(ring);
      const hub = new THREE.Mesh(new THREE.SphereGeometry(0.28,10,10), spinMat);
      g.add(hub);
      for(let i=0;i<4;i++){
        const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.1,0.1), spinMat);
        arm.rotation.z = i*Math.PI/2; g.add(arm);
      }
    } else {
      // balloon
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.75,14,12), balloonMat.clone());
      ball.material.color.setHSL((level._propMeshes.length*0.17)%1, 0.75, 0.55);
      ball.material.emissive.setHSL((level._propMeshes.length*0.17)%1, 0.7, 0.35);
      g.add(ball);
      const knot = new THREE.Mesh(new THREE.ConeGeometry(0.18,0.35,6), balloonMat);
      knot.position.y = -0.85; knot.rotation.x = Math.PI; g.add(knot);
      const string = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.6,6),
        new THREE.MeshBasicMaterial({ color:0xffffff }));
      string.position.y = -1.55; g.add(string);
    }
    const side = (level._propMeshes.length%2)?-1:1;
    // Keep props near the ribbon so kids brush them while driving (soft only)
    g.position.copy(best.pos)
      .add(best.normal.clone().multiplyScalar(kind==='billboard'?1.35:1.9))
      .add(best.binormal.clone().multiplyScalar(side * (TRACK_W * (kind==='spinner'?0.22:0.28))));
    if(pr.y != null && Math.abs(pr.y - best.pos.y) > 4){
      g.position.y = pr.y;
    }
    g.userData = {
      kind:'prop', type:kind, hit:false, cool:0,
      base:g.position.clone(), phase:Math.random()*Math.PI*2,
      spinSpeed: kind==='spinner'?1.4 : kind==='billboard'?0.55 : 0.35,
      bounceR: kind==='spinner'?2.0 : kind==='billboard'?1.9 : 1.7
    };
    pickupGroup.add(g);
    level._propMeshes.push(g);
  }
}

/* Game state */
const state = {
  mode:'title', // title|select|play|pause|grade|fail
  levelIndex:0, endless:false,
  score:0, mult:1, combo:0, comboTimer:0,
  fuel:1, starsGot:0, starsTotal:0, smashes:0, checkpointsGot:0, boostsGot:0, propsGot:0,
  flips:0, frontflips:0, backflips:0, airTimeTotal:0, cleanLands:0, thrustStyle:0,
  shake:0, fovPunch:0, squash:0, grade:'☆☆☆', starGrade:0,
  framesData:null, level:null,
  chunks:[], // endless
  lastCheckpoint:null, // {s, segIndex, fuelFloor, levelIndex}
};

const car = {
  s:0, segIndex:0, grounded:true, speed:0, airGrace:0,
  pos:new THREE.Vector3(), vel:new THREE.Vector3(),
  pitch:0, pitchVel:0, airTime:0, flipAcc:0,
  quat:new THREE.Quaternion()
};

const camState = { pos:new THREE.Vector3(-8,6,14), look:new THREE.Vector3(), fov:55 };

function applyTheme(key){
  const th = THEMES[key] || THEMES.desert;
  scene.background = new THREE.Color(th.sky);
  scene.fog = new THREE.Fog(th.fog, 50, 280);
  if(typeof tintSky==='function') tintSky(th.sky);
  amb.color.set(th.amb); amb.intensity = 0.32;
  sun.intensity = 1.35;
  hemi.color.set(th.amb); hemi.groundColor.set(th.ground);
  sun.color.set(th.dir);
  return th;
}

function startLevel(idx, endless=false, fromCheckpoint=false){
  const keepCp = fromCheckpoint && state.lastCheckpoint && state.lastCheckpoint.levelIndex===idx && !endless
    ? Object.assign({}, state.lastCheckpoint) : null;
  state.endless = endless;
  state.levelIndex = idx;
  state.mode = 'play';
  if(!keepCp){
    state.score=0; state.mult=1; state.combo=0; state.comboTimer=0;
    state.fuel=1; state.starsGot=0; state.smashes=0; state.checkpointsGot=0; state.boostsGot=0; state.propsGot=0;
    state.flips=0; state.frontflips=0; state.backflips=0; state.airTimeTotal=0;
    state.cleanLands=0; state.thrustStyle=0;
    state.lastCheckpoint=null;
  } else {
    state.mult=1; state.combo=0; state.comboTimer=0;
    state.fuel=Math.max(keepCp.fuelFloor||0.45, state.fuel||0.45);
  }
  state.shake=0; state.fovPunch=0; state.squash=0;
  state.grade='☆☆☆'; state.starGrade=0; state.chunks=[];
  particles.length=0;

  let level;
  if(endless){
    level = makeEndlessChunk(0);
  } else {
    level = LEVELS[idx];
  }
  state.level = level;
  state.starsTotal = level.stars.length;
  const th = applyTheme(level.theme);
  state.framesData = buildFrames(level.segments);
  buildTrackMeshes(state.framesData, th);
  buildPickups(level, state.framesData);

  // Mark prior checkpoints as collected when respawning past them
  if(keepCp){
    for(const gate of (level._cpMeshes||[])){
      if(gate.userData.s <= keepCp.s + 0.5){
        gate.userData.taken=true; gate.visible=false;
      }
    }
  }

  car.s = keepCp ? keepCp.s : 0.5;
  car.segIndex = keepCp ? (keepCp.segIndex||0) : 0;
  car.grounded=true; car.speed= keepCp?16:8; car.pitch=0; car.pitchVel=0; car.airTime=0; car.flipAcc=0; car.airGrace=0;
  const fr = sampleSegment(state.framesData.segs[car.segIndex]||state.framesData.segs[0], car.s)
    || sampleFrames(state.framesData, car.s);
  car.pos.copy(fr.pos).add(fr.normal.clone().multiplyScalar(0.95));
  car.vel.set(0,0,0);
  orientCar(fr, 0);
  if(keepCp) state.lastCheckpoint = keepCp;

  showPlayUI(true);
  hideOverlay();
  updateHUD();
}

function makeEndlessChunk(n){
  const keys = Object.keys(THEMES);
  const theme = keys[n % keys.length];
  const x0 = 0;
  const pieces = [
    flat(x0,0,18),
    ramp(x0+18,0,22+n%3*4,11+n%4*2),
    down(x0+40,11+n%4*2,18,11+n%4*2),
    flat(x0+58,0,10),
  ];
  const variant = n % 5;
  if(variant===0) pieces.push(corkscrew(x0+68, 2, 38, 2.8, 1.0+ (n%2)*0.25, 34));
  else if(variant===1) pieces.push(wallRide(x0+68, 0, 68, 7+(n%3), (n%2)?1:-1, 46));
  else if(variant===2){ pieces.push(hump(x0+68,0,26,8+n%3*2)); pieces.push(hump(x0+94,0,24,10)); }
  else if(variant===3) pieces.push(loop(x0+90, 14, 12+(n%2), -0.2, Math.PI*2-0.2, 36));
  else { pieces.push(corkscrew(x0+68, 2, 28, 2.4, 1.0, 28)); pieces.push(wallRide(x0+100, 2, 48, 6, 1, 32)); }
  if(n%2===0) pieces.push(flat(x0+140,0,28));
  else pieces.push(ramp(x0+140,0,20,8), down(x0+160,8,16,8));
  pieces.push(flat(x0+175,0,40));
  const wp = join(...pieces);
  const stars=[], smashables=[], checkpoints=[], boostPads=[], routes=[], props=[];
  for(let i=0;i<4;i++) stars.push({x:28+i*32, y:8+(i%2)*4});
  if(n>0) smashables.push({x:55, y:2, kind: n%2?'barrel':'crate'});
  if(n>1) smashables.push({x:100, y:2, kind: n%3===0?'cone':'tire'});
  if(n>2) smashables.push({x:150, y:2, kind: n%2?'cone':'barrel'});
  // multi-checkpoint chain in endless
  checkpoints.push({x:50, y:4});
  checkpoints.push({x:120, y:5});
  if(n%2===0) checkpoints.push({x:165, y:4});
  boostPads.push({x:35, y:1});
  if(n%2) boostPads.push({x:145, y:1});
  routes.push({x:70, y:12}, {x:110, y:14});
  const kinds=['balloon','billboard','spinner'];
  props.push({x:60, y:5, kind:kinds[n%3]});
  props.push({x:130, y:6, kind:kinds[(n+1)%3]});
  if(n%2===0) props.push({x:160, y:4, kind:'balloon'});
  return L('Endless '+ (n+1), theme, [wp], stars, smashables, 'How far can you go?', checkpoints, boostPads, routes, props);
}

function orientCar(fr, pitch){
  // base from track frame, extra pitch around binormal when airborne
  const tang = fr.tangent.clone();
  const norm = fr.normal.clone();
  const bin = fr.binormal.clone();
  if(Math.abs(pitch)>0.001){
    const q = new THREE.Quaternion().setFromAxisAngle(bin, pitch);
    tang.applyQuaternion(q); norm.applyQuaternion(q);
  }
  const m = new THREE.Matrix4().makeBasis(tang, norm, bin);
  car.quat.setFromRotationMatrix(m);
  carVisual.group.quaternion.copy(car.quat);
  carVisual.group.position.copy(car.pos);
}

function addScore(pts, label, cls){
  const gained = Math.floor(pts * state.mult);
  state.score += gained;
  if(label) popup(label, cls || (/FLIP/.test(label)?'flip':(/SMASH|BOOM|CRUNCH/.test(label)?'smash':(/CHECKPOINT/.test(label)?'checkpoint':(/BOOST/.test(label)?'boost':(/POP|BOUNCE/.test(label)?'pop':'combo'))))));
  if(state.comboTimer>0){ state.combo++; state.mult = Math.min(8, 1+Math.floor(state.combo/2)); }
  else { state.combo=1; state.mult=1; }
  state.comboTimer = 1.8;
  punchCombo();
  updateHUD();
}
function popup(text, cls){
  const d=document.createElement('div');
  d.className='popup'+(cls?(' '+cls):'');
  d.textContent=text;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 950);
}
function punchCombo(){
  const el=document.getElementById('combo');
  if(state.combo>=2){
    el.textContent='COMBO ×'+state.mult;
    el.style.opacity='1';
    el.classList.remove('punch'); void el.offsetWidth; el.classList.add('punch');
  } else el.style.opacity='0';
}
function starString(n){
  n = Math.max(0, Math.min(3, n|0));
  return '★'.repeat(n) + '☆'.repeat(3-n);
}
function computeStarGrade(){
  const tot = state.starsTotal||1;
  const ratio = state.starsGot / tot;
  let g = 1;
  if(ratio >= 0.5 || state.flips >= 1 || state.smashes >= 2) g = 2;
  if(ratio >= 0.85 || (state.flips >= 2 && state.smashes >= 2)) g = 3;
  if(state.starsGot >= tot && tot > 0) g = 3;
  return g;
}
function updateHUD(){
  document.getElementById('scorePanel').textContent = state.score.toLocaleString();
  document.getElementById('multPanel').textContent = '×'+state.mult;
  const live = state.mode==='play' ? computeStarGrade() : state.starGrade;
  const s = starString(live);
  document.getElementById('gradePanel').textContent = s;
  const sh = document.getElementById('starHud');
  if(sh) sh.textContent = s + '  '+state.starsGot+'/'+state.starsTotal;
  document.getElementById('fuelFill').style.width = Math.round(state.fuel*100)+'%';
}

}

function showOverlay(){ document.getElementById('overlay').classList.remove('hidden'); }

function showSelect(){
  state.mode='select'; showPlayUI(false);

  for(let i=0;i<LEVELS.length;i++){

    const best = scores.levels[i];
    const bestStars = (best && typeof best==='object' && best.stars!=null) ? starString(best.stars) : '';
    const bestScore = best==null ? null : (typeof best==='object' ? (best.score||0) : best);
    html += '<button class="lvlBtn" data-i="'+i+'" '+(unlocked?'':'disabled')+'>'+(i+1)+
      (bestScore!=null?'<small>'+bestScore.toLocaleString()+' '+bestStars+'</small>':'<small>'+LEVELS[i].name.split(' ')[0]+'</small>')+'</button>';
  }
  html += '</div><div class="btnRow"><button class="menu secondary" id="btnBack">BACK</button></div>';
  document.getElementById('card').innerHTML=html;
  showOverlay();
  document.getElementById('btnBack').onclick=()=>{ audio.ui(); showTitle(); };

function togglePause(){
  if(state.mode==='play'){
    state.mode='pause';
    document.getElementById('card').innerHTML='<h1>Paused</h1><div class="btnRow">'+
      '<button class="menu" id="btnResume">RESUME</button>'+
      '<button class="menu secondary" id="btnRestart">RESTART</button>'+
      '<button class="menu secondary" id="btnQuit">QUIT</button></div>';
    showOverlay();
    document.getElementById('btnResume').onclick=()=>{ audio.ui(); state.mode='play'; hideOverlay(); };
    document.getElementById('btnRestart').onclick=()=>{ audio.ui(); startLevel(state.levelIndex, state.endless); };
    document.getElementById('btnQuit').onclick=()=>{ audio.ui(); showTitle(); };
  } else if(state.mode==='pause'){
    state.mode='play'; hideOverlay();

function failRun(reason){
  state.mode='fail';
  audio.crash(); haptic(40); state.shake=0.55;
  document.getElementById('card').innerHTML='<h1>Crash!</h1><p class="sub">'+(reason||'Ouch')+'</p>'+
    '<p class="oneMore">One more try?</p>'+
    '<div class="btnRow"><button class="menu gold" id="btnRetry">RETRY</button>'+
    '<button class="menu secondary" id="btnQuit2">MENU</button></div>';
  showOverlay();
  document.getElementById('btnRetry').onclick=()=>{ audio.ui(); startLevel(state.levelIndex, state.endless, !!state.lastCheckpoint); };
  document.getElementById('btnQuit2').onclick=()=>{ audio.ui(); showTitle(); };
}

function winRun(){
  state.mode='grade';
  audio.win(); haptic(20);
  const starGrade = computeStarGrade();
  state.starGrade = starGrade;
  state.grade = starString(starGrade);
  if(!state.endless){
    const prev = scores.levels[state.levelIndex];
    const prevScore = (prev && typeof prev==='object') ? (prev.score||0) : (prev||0);
    const prevStars = (prev && typeof prev==='object') ? (prev.stars||0) : 0;
    if(state.score>prevScore || starGrade>prevStars){
      scores.levels[state.levelIndex]={score:Math.max(state.score,prevScore), stars:Math.max(starGrade,prevStars)};
      saveScores(scores);
    }
  } else {
    if(state.score>(scores.endless||0)){ scores.endless=state.score; saveScores(scores); }
  }
  const next = state.levelIndex+1;
  const hasNext = !state.endless && next < LEVELS.length;
  document.getElementById('card').innerHTML='<h1>'+(state.endless?'Distance!':LEVELS[state.levelIndex].name)+'</h1>'+
    '<div class="gradeHero">'+state.grade+'</div>'+
    '<p class="sub">Score '+state.score.toLocaleString()+' · Stars '+state.starsGot+'/'+state.starsTotal+
    ' · Flips '+state.flips+' (↑'+state.frontflips+' ↓'+state.backflips+') · Smash '+state.smashes+' · Clean '+state.cleanLands+'</p>'+
    '<p class="oneMore">One more run — chase ★★★!</p>'+
    '<div class="btnRow">'+
    (hasNext?'<button class="menu gold" id="btnNext">NEXT</button>':'')+
    '<button class="menu" id="btnAgain">AGAIN</button>'+
    '<button class="menu secondary" id="btnMenu">MENU</button></div>';
  showOverlay();
  if(hasNext) document.getElementById('btnNext').onclick=()=>{ audio.ui(); startLevel(next); };
  document.getElementById('btnAgain').onclick=()=>{ audio.ui(); startLevel(state.levelIndex, state.endless); };
  document.getElementById('btnMenu').onclick=()=>{ audio.ui(); showTitle(); };
}

/* Physics */
const GRAV = 28;
const ACCEL = 38;
const BRAKE = 48;
const REVERSE_ACCEL = 22;
const MAX_SPEED = 48;
const MAX_REVERSE = -14;
const THRUST_FORCE = 52;
const LEAN_TORQUE = 5.85;  // snappier lean (v6 polish)
const AIR_DAMP = 0.48;     // slightly less damp = crisper flips
const FUEL_BURN = 0.38;
const FUEL_REGEN = 0.16;
const DT = 1/60;

function nearestFrame(pos){
  const frames=state.framesData.frames;
  const segs=state.framesData.segs;
  // When airborne, strongly prefer the NEXT segment (landing pad) over the lip we just left
  if(!car.grounded && segs && segs.length){
    const prefer = [];
    const next = Math.min(car.segIndex + 1, segs.length - 1);
    prefer.push(next);
    // During airGrace, skip the segment we launched from entirely
    if(car.airGrace <= 0 && next !== car.segIndex) prefer.push(car.segIndex);
    for(let k=0;k<segs.length;k++){
      if(car.airGrace > 0 && k === car.segIndex) continue;
      if(!prefer.includes(k)) prefer.push(k);
    }
    let bestF=null, bd=1e12;
    for(const si of prefer){
      const seg=segs[si];
      const weight = (si===next) ? 0.45 : (si===car.segIndex ? 1.5 : 1.0);
      for(const f of seg.frames){
        if(si===car.segIndex && f.s > seg.length - 4) continue;
        const d=f.pos.distanceToSquared(pos) * weight;
        if(d<bd){ bd=d; bestF=f; }
      }
    }
    if(bestF) return bestF;
  }
  let best=0, bd=1e12;
  const step=Math.max(1, Math.floor(frames.length/50));
  for(let i=0;i<frames.length;i+=step){
    const d=frames[i].pos.distanceToSquared(pos);
    if(d<bd){ bd=d; best=i; }
  }
  const lo=Math.max(0,best-step*2), hi=Math.min(frames.length-1,best+step*2);
  for(let i=lo;i<=hi;i++){
    const d=frames[i].pos.distanceToSquared(pos);
    if(d<bd){ bd=d; best=i; }
  }
  return frames[best];
}

function physicsStep(dt){
  if(state.mode!=='play' || !state.framesData) return;
  const lean = effectiveLean();
  state.comboTimer = Math.max(0, state.comboTimer-dt);
  if(state.comboTimer<=0){ state.combo=0; state.mult=1; document.getElementById('combo').style.opacity='0'; }

  // fuel
  if(input.thrust && state.fuel>0){
    state.fuel = Math.max(0, state.fuel - FUEL_BURN*dt);
    if(state.fuel>0){
      state.thrustStyle += 40*dt;
      state.fovPunch = Math.min(1, state.fovPunch + dt*4);
      state.shake = Math.max(state.shake, 0.22);
    }
  } else {
    state.fuel = Math.min(1, state.fuel + FUEL_REGEN*dt);
    state.fovPunch = Math.max(0, state.fovPunch - dt*2.5);
  }

  state.squash = Math.max(0, state.squash - dt*4.4);

  if(car.grounded){
    if(input.gas) car.speed = Math.min(MAX_SPEED, car.speed + ACCEL*dt);
    if(input.brake){
      if(car.speed > 0.5) car.speed = Math.max(MAX_REVERSE, car.speed - BRAKE*dt);
      else car.speed = Math.max(MAX_REVERSE, car.speed - REVERSE_ACCEL*dt);
    } else if(!input.gas){
      if(car.speed > 6) car.speed = Math.max(6, car.speed - BRAKE*dt*0.2);
      else if(car.speed < 0) car.speed = Math.min(0, car.speed + BRAKE*dt*0.5);
    }
    if(input.thrust && state.fuel>0) car.speed = Math.min(MAX_SPEED*1.15, car.speed + THRUST_FORCE*0.45*dt);

    const seg = state.framesData.segs[car.segIndex] || state.framesData.segs[0];
    car.s += car.speed * dt;
    if(car.s < 0){ car.s = 0; car.speed = 0; }
    if(car.s >= seg.length - 0.25){
      const fr = sampleSegment(seg, seg.length);
      const isLast = car.segIndex >= state.framesData.segs.length - 1;
      if(isLast){
        car.pos.copy(fr.pos).add(fr.normal.clone().multiplyScalar(0.95));
        orientCar(fr, 0);
        winRun(); return;
      }
      // Launch across gap to next segment
      car.grounded = false;
      const launchUp = Math.min(22, 8 + Math.abs(car.speed) * 0.28);
      car.vel.copy(fr.tangent).multiplyScalar(Math.max(8, car.speed) * 1.1);
      // Blend track normal with world up so flat lips still get vertical lift
      const upDir = fr.normal.clone().multiplyScalar(0.65).add(new THREE.Vector3(0, 0.35, 0)).normalize();
      car.vel.add(upDir.multiplyScalar(launchUp));
      if(car.vel.y < 6) car.vel.y = 6 + Math.abs(car.speed) * 0.06;
      car.pitch = 0; car.pitchVel = lean * 0.35; car.flipAcc = 0;
      car.pos.copy(fr.pos).add(fr.normal.clone().multiplyScalar(0.95));
      // Mark that we left this segment — prefer next for landing
      car.airGrace = 0.55; // don't re-land on the lip we just left
      orientCar(fr, 0);
      state.shake = Math.max(state.shake, 0.2);
      if(input.thrust && state.fuel>0) emitThrust(fr);
    } else {
      // On-rails: stick to track (Stunt Paradise feel). Optional hop with thrust on crests.
      const fr = sampleSegment(seg, car.s);
      car.pos.copy(fr.pos).add(fr.normal.clone().multiplyScalar(0.95));
      car.pitch *= 0.8;
      car.pitchVel = 0;
      car.airTime = 0;
      orientCar(fr, 0);
      if(input.thrust && state.fuel>0){
        emitThrust(fr);
      }
      if(car.speed > 28 && Math.random()<0.4){
        const back = car.pos.clone().add(fr.tangent.clone().multiplyScalar(-1.2));
        spawnParticle(back.x, back.y, back.z, -fr.tangent.x*6, 0.5, -fr.tangent.z*6, 0.2, 0.7, 0.85, 1.0);
      }
    }

  } else {
    // Airborne — weighty SP rotation
    car.airTime += dt;
    if(car.airGrace > 0) car.airGrace = Math.max(0, car.airGrace - dt);
    state.airTimeTotal += dt;
    car.pitchVel += lean * LEAN_TORQUE * dt;
    car.pitchVel *= (1 - AIR_DAMP*dt);
    car.pitch += car.pitchVel * dt;
    car.flipAcc += car.pitchVel * dt;
    while(Math.abs(car.flipAcc) >= Math.PI*2){
      const dir = Math.sign(car.flipAcc);
      car.flipAcc -= dir*Math.PI*2;
      state.flips++;
      if(dir < 0){ state.backflips++; addScore(280, 'BACKFLIP!', 'flip'); }
      else { state.frontflips++; addScore(280, 'FRONTFLIP!', 'flip'); }
      audio.flip(); haptic(12);
      state.shake = Math.max(state.shake, 0.28);
      state.fovPunch = Math.min(1, state.fovPunch + 0.35);
    }
    if(car.airTime > 1.2 && Math.floor(car.airTime*10)%12===0){
      addScore(15, 'AIR!', 'combo');
    }

    car.vel.y -= GRAV * dt;
    // thruster
    const frApprox = nearestFrame(car.pos);
    const forward = frApprox.tangent.clone();
    // apply pitch to thrust direction
    const bin = frApprox.binormal.clone();
    const q = new THREE.Quaternion().setFromAxisAngle(bin, car.pitch);
    forward.applyQuaternion(q);
    const up = frApprox.normal.clone().applyQuaternion(q);
    if(input.thrust && state.fuel>0){
      car.vel.add(forward.multiplyScalar(THRUST_FORCE*dt));
      car.vel.add(up.multiplyScalar(THRUST_FORCE*0.35*dt));
      emitThrust({pos:car.pos, tangent:forward, normal:up, binormal:bin});
    }
    if(input.gas) car.vel.add(forward.clone().normalize().multiplyScalar(ACCEL*0.25*dt));
    if(input.brake) car.vel.multiplyScalar(1 - 1.2*dt);

    car.pos.addScaledVector(car.vel, dt);
    // soft air-right near ground
    const near = nearestFrame(car.pos);
    const rel = car.pos.clone().sub(near.pos);
    const height = rel.dot(near.normal);
    const lateral = Math.abs(rel.dot(near.binormal));
    if(height < 5 && height > -1){
      car.pitchVel += (-car.pitch)*1.2*dt; // softer auto-right
    }
    orientCar(near, car.pitch);

    // Landing / crash — ignore while airGrace (just launched)
    if(car.airGrace <= 0){
    // Magnetize toward track when close
    if(height < 3.5 && height > -1.5 && lateral < TRACK_W * 0.85){
      car.vel.add(near.normal.clone().multiplyScalar(Math.max(0, (1.2 - height) * 18 * dt)));
    }
    if(height < 1.35 && height > -2.0 && lateral < TRACK_W * 0.8){
      const impact = Math.max(0, -car.vel.dot(near.normal));
      const angleOk = Math.abs(car.pitch) < 1.45 || height < 0.55;
      if(angleOk && impact < 48){
        car.grounded=true;
        let landFr = near;
        car.segIndex = near.seg != null ? near.seg : 0;
        car.s = near.s;
        // Don't re-launch from the same lip — advance if we landed on a segment tip
        {
          const ls = state.framesData.segs[car.segIndex];
          if(ls && car.s >= ls.length - 2.5 && car.segIndex < state.framesData.segs.length - 1){
            car.segIndex++;
            car.s = 0.4;
            landFr = sampleSegment(state.framesData.segs[car.segIndex], car.s);
          }
        }
        car.speed = Math.max(8, car.vel.dot(landFr.tangent));
        car.vel.set(0,0,0);
        const landPitch = car.pitch;
        car.pitch=0; car.pitchVel=0; car.flipAcc=0;
        car.pos.copy(landFr.pos).add(landFr.normal.clone().multiplyScalar(0.95));
        const clean = impact < 16 && Math.abs(landPitch)<0.5;
        state.squash = (clean ? 0.78 : 0.58) + Math.min(0.38, impact/36);
        state.fovPunch = Math.min(1, state.fovPunch + (clean ? 0.62 : 0.42) + impact*0.012);
        if(clean){
          state.cleanLands++;
          addScore(90 + Math.floor(car.airTime*70), 'CLEAN!', 'combo');
          audio.land(); haptic(14);
          state.shake = Math.max(state.shake, 0.38 + Math.min(0.28, impact/40));
        } else {
          audio.land();
          state.shake = Math.max(state.shake, 0.28);
          addScore(30, 'LAND');
        }
        landBurst(car.pos);
        car.airTime=0;
        orientCar(landFr, 0);
      } else if(impact >= 55 || Math.abs(car.pitch)>2.2){
        failRun('Bad landing');
        return;
      }
    }
    } // end airGrace<=0 land checks
    // fell off world
    if(car.pos.y < -25){ failRun('Fell off'); return; }
  }

  // Pickups
  for(const star of (state.level._starMeshes||[])){
    if(star.userData.taken) continue;
    star.rotation.y += dt*2.5; star.rotation.x += dt*1.2;
    star.position.y = star.userData.base.y + Math.sin(performance.now()/300)*0.25;
    if(star.position.distanceTo(car.pos) < 2.2){
      star.userData.taken=true; star.visible=false;
      state.starsGot++; state.fuel=Math.min(1, state.fuel+0.22);
      addScore(150, 'STAR!'); audio.star(); haptic(10);
    }
  }
  for(const sm of (state.level._smashMeshes||[])){
    if(sm.userData.smashed) continue;
    sm.rotation.y += dt*0.8;
    if(sm.position.distanceTo(car.pos) < 1.35 + (sm.userData.r||0)*0.3){
      sm.userData.smashed=true; sm.visible=false;
      state.smashes++;
      smashBurst(sm.position, sm.userData.type);
      const t=sm.userData.type;
      const pts = t==='crate'?120 : t==='cone'?140 : t==='tire'?200 : 180;
      const lab = t==='crate'?'SMASH!' : t==='cone'?'CRUNCH!' : t==='tire'?'BOOM!' : 'BOOM!';
      addScore(pts, lab, 'smash');
      audio.smash(); haptic(22);
      state.shake = Math.max(state.shake, 0.48);
      state.fovPunch = Math.min(1, state.fovPunch + 0.55);
    }
  }

  // Checkpoint rings
  for(const gate of (state.level._cpMeshes||[])){
    if(gate.userData.taken) continue;
    gate.rotation.z += dt*1.2;
    if(gate.position.distanceTo(car.pos) < 3.4){
      gate.userData.taken=true;
      // Dim but leave a faint marker
      gate.traverse(o=>{ if(o.material){ o.material = o.material.clone(); o.material.opacity=0.25; o.material.emissiveIntensity=0.2; }});
      state.checkpointsGot++;
      state.lastCheckpoint = {
        s: gate.userData.s,
        segIndex: gate.userData.segIndex||0,
        fuelFloor: Math.max(0.45, state.fuel*0.85),
        levelIndex: state.levelIndex
      };
      state.fuel = Math.min(1, state.fuel + 0.18);
      addScore(250, 'CHECKPOINT!', 'checkpoint');
      audio.checkpoint(); haptic(18);
      state.fovPunch = Math.min(1, state.fovPunch + 0.7);
      state.shake = Math.max(state.shake, 0.22);
    }
  }

  // Ground boost pads
  for(const pad of (state.level._boostMeshes||[])){
    if(pad.userData.cool > 0){
      pad.userData.cool -= dt;
      pad.visible = pad.userData.cool <= 0;
      if(pad.userData.cool <= 0){
        pad.traverse(o=>{ if(o.material && o.material.emissiveIntensity!=null) o.material.emissiveIntensity=1.2; });
      }
      continue;
    }
    pad.children[0] && (pad.children[0].material.emissiveIntensity = 0.9 + Math.sin(performance.now()/180)*0.35);
    if(car.grounded && pad.position.distanceTo(car.pos) < 2.4){
      pad.userData.cool = 4.5; // brief deactivate
      pad.visible = false;
      state.boostsGot++;
      car.speed = Math.min(MAX_SPEED * 1.12, Math.max(car.speed, MAX_SPEED * 0.92) + 10);
      state.fovPunch = Math.min(1, state.fovPunch + 0.95);
      state.shake = Math.max(state.shake, 0.18);
      addScore(80, 'BOOST!', 'boost');
      audio.boost(); haptic(14);
      // speed-line juice burst
      for(let i=0;i<18;i++){
        spawnParticle(car.pos.x, car.pos.y+0.4, car.pos.z,
          (Math.random()-0.5)*4, Math.random()*2, (Math.random()-0.5)*4,
          0.25+Math.random()*0.3, 1, 0.85+Math.random()*0.15, 0.2);
      }
    }
  }

  // Mid-air route markers — bob + spin (non-lethal visual cues)
  for(const rm of (state.level._routeMeshes||[])){
    const t = performance.now()/1000 + (rm.userData.phase||0);
    rm.position.y = rm.userData.base.y + Math.sin(t*2.2)*0.35;
    rm.rotation.y += dt*1.6;
  }

  // Kid-safe spectacle props — animate; soft bounce / score pop only
  for(const pr of (state.level._propMeshes||[])){
    const ud = pr.userData;
    const t = performance.now()/1000 + (ud.phase||0);
    if(ud.type==='balloon'){
      pr.position.y = ud.base.y + Math.sin(t*1.6)*0.55;
      pr.position.x = ud.base.x + Math.sin(t*0.7)*0.25;
      pr.rotation.y += dt*ud.spinSpeed;
    } else if(ud.type==='billboard'){
      pr.rotation.y = Math.sin(t*ud.spinSpeed)*0.85;
      pr.position.copy(ud.base);
    } else {
      pr.rotation.x += dt*ud.spinSpeed;
      pr.rotation.z += dt*ud.spinSpeed*0.7;
      pr.position.y = ud.base.y + Math.sin(t*1.1)*0.2;
    }
    if(ud.cool > 0){ ud.cool -= dt; continue; }
    if(pr.position.distanceTo(car.pos) < (ud.bounceR||1.3)){
      ud.cool = 1.1;
      state.propsGot = (state.propsGot||0)+1;
      // Soft nudge — never fail
      if(!car.grounded){
        car.vel.y = Math.max(car.vel.y, 6);
        car.vel.add(new THREE.Vector3(
          (Math.random()-0.5)*4, 2, (Math.random()-0.5)*4
        ));
      } else {
        car.speed = Math.min(MAX_SPEED, car.speed + 3);
      }
      const lab = ud.type==='balloon' ? 'POP!' : (ud.type==='spinner' ? 'SPIN!' : 'BOUNCE!');
      addScore(ud.type==='balloon'?60:45, lab, 'pop');
      audio.softpop(); haptic(8);
      state.fovPunch = Math.min(1, state.fovPunch + 0.25);
      // confetti puff
      for(let i=0;i<12;i++){
        spawnParticle(pr.position.x, pr.position.y, pr.position.z,
          (Math.random()-0.5)*8, Math.random()*8, (Math.random()-0.5)*8,
          0.35, 1, 0.5+Math.random()*0.5, 0.75+Math.random()*0.25);
      }
    }
  }

  // Endless: near end → next chunk
  if(state.endless && car.grounded && car.s > state.framesData.length - 8){
    const n = state.chunks.length+1;
    state.chunks.push(1);
    addScore(500, 'ZONE +');
    const level = makeEndlessChunk(n);
    state.level = level;
    state.starsTotal += level.stars.length;
    const th = applyTheme(level.theme);
    state.framesData = buildFrames(level.segments);
    buildTrackMeshes(state.framesData, th);
    buildPickups(level, state.framesData);
    car.s = 1;
  }

  state.shake = Math.max(0, state.shake - dt);
  updateHUD();
}

function emitThrust(fr){
  const back = car.pos.clone()
    .add(fr.tangent.clone().multiplyScalar(-1.35))
    .add(fr.normal.clone().multiplyScalar(0.15));
  for(let i=0;i<12;i++){
    const side = (i/11 - 0.5) * 1.4;
    const spread = (Math.random()-0.5)*2.5;
    spawnParticle(
      back.x + fr.binormal.x*side, back.y + (Math.random()-0.5)*0.3, back.z + fr.binormal.z*side,
      -fr.tangent.x*(10+Math.random()*14)+spread,
      -fr.tangent.y*(10+Math.random()*14)+Math.random()*4,
      -fr.tangent.z*(10+Math.random()*14)+spread,
      0.3+Math.random()*0.35,
      0.55+Math.random()*0.45, 0.75+Math.random()*0.25, 1.0
    );
    if(i%3===0){
      spawnParticle(back.x, back.y, back.z,
        -fr.tangent.x*(6+Math.random()*8), -fr.tangent.y*(6+Math.random()*8)+2, -fr.tangent.z*(6+Math.random()*8),
        0.28, 1.0, 0.5+Math.random()*0.35, 0.12);
    }
  }
}
function smashBurst(pos, kind){
  const n = kind==='crate' ? 28 : kind==='tire' ? 40 : 36;
  let r=1,g=0.35,b=0.1;
  if(kind==='crate'){ r=0.9; g=0.7; b=0.3; }
  else if(kind==='cone'){ r=1.0; g=0.45; b=0.1; }
  else if(kind==='tire'){ r=0.25; g=0.25; b=0.28; }
  for(let i=0;i<n;i++){
    const speed = 8+Math.random()*18;
    const ang = Math.random()*Math.PI*2;
    const elev = Math.random()*Math.PI*0.5;
    spawnParticle(pos.x, pos.y+0.5, pos.z,
      Math.cos(ang)*Math.cos(elev)*speed,
      Math.sin(elev)*speed + 4,
      Math.sin(ang)*Math.cos(elev)*speed,
      0.4+Math.random()*0.45,
      r, g+Math.random()*0.15, b);
  }
}
function landBurst(pos){
  for(let i=0;i<18;i++){
    spawnParticle(pos.x, pos.y, pos.z,
      (Math.random()-0.5)*12, Math.random()*6, (Math.random()-0.5)*12,
      0.35, 0.9, 0.9, 1.0);
  }
}

/* Camera — cinematic third-person, always frames the Roadster */
function updateCamera(dt){
  if(!state.framesData) return;
  const fr = car.grounded
    ? sampleSegment(state.framesData.segs[car.segIndex]||state.framesData.segs[0], car.s)
    : nearestFrame(car.pos);

  // Basis from car orientation when airborne, track when grounded
  let back, up, side;
  if(car.grounded){
    back = fr.tangent.clone().multiplyScalar(-1);
    up = fr.normal.clone();
    side = fr.binormal.clone();
  } else {
    const e = new THREE.Euler().setFromQuaternion(car.quat);
    back = new THREE.Vector3(-1,0,0).applyQuaternion(car.quat);
    up = new THREE.Vector3(0,1,0).applyQuaternion(car.quat);
    side = new THREE.Vector3(0,0,1).applyQuaternion(car.quat);
    // blend up toward world-up so camera doesn't go wild mid-flip
    up.lerp(new THREE.Vector3(0,1,0), 0.55).normalize();
    back.normalize();
  }

  const dist = 7.2 + Math.min(2.8, Math.abs(car.speed) * 0.04);
  const height = 2.8 + (car.grounded ? 0 : 1.1);
  const targetPos = car.pos.clone()
    .add(back.clone().multiplyScalar(dist))
    .add(up.clone().multiplyScalar(height))
    .add(side.clone().multiplyScalar(0.35));
  // Never let camera sink below ground-ish
  if(targetPos.y < car.pos.y - 2) targetPos.y = car.pos.y + 2;

  const lag = car.grounded ? 0.004 : 0.012;
  camState.pos.lerp(targetPos, 1 - Math.pow(lag, dt));
  const lookTarget = car.pos.clone()
    .add(back.clone().multiplyScalar(-3.8))
    .add(up.clone().multiplyScalar(0.55));
  camState.look.lerp(lookTarget, 1 - Math.pow(0.002, dt));

  let shakeX=0, shakeY=0;
  if(state.shake>0){
    shakeX = (Math.random()-0.5)*state.shake*1.0;
    shakeY = (Math.random()-0.5)*state.shake*1.0;
  }
  camera.position.copy(camState.pos);
  camera.position.x += shakeX; camera.position.y += shakeY;
  camera.lookAt(camState.look);

  // mild roll on big jumps
  const roll = THREE.MathUtils.clamp(-car.pitch * 0.1, -0.18, 0.18);
  if(!car.grounded) camera.rotateZ(roll);

  const baseFov = 52;
  camera.fov = baseFov + state.fovPunch * 14 + Math.min(7, Math.abs(car.speed) * 0.1);
  camera.updateProjectionMatrix();

  const sl = document.getElementById('speedLines');
  sl.style.opacity = String(Math.min(0.55, state.fovPunch * 0.6 + Math.abs(car.speed) / 130));
}

function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/Math.max(1,h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

/* Main loop */
let acc=0, last=performance.now();
function frame(now){
  const raw=Math.min(0.05, (now-last)/1000); last=now;
  acc+=raw;
  while(acc>=DT){ physicsStep(DT); acc-=DT; }
  updateParticles(raw);
  updateCamera(raw);
  // title idle spin
  if(state.mode==='title' || state.mode==='select'){
    carVisual.group.rotation.y = Math.sin(now/2000)*0.15;
    const fr=sampleFrames(state.framesData, 50+Math.sin(now/3000)*20);
    camState.pos.lerp(car.pos.clone().add(new THREE.Vector3(-10,5,12)), 0.03);
    camState.look.lerp(car.pos.clone().add(new THREE.Vector3(4,1,0)), 0.03);
    carVisual.group.position.copy(car.pos);
    camera.position.copy(camState.pos); camera.lookAt(camState.look);
  }
  // Soft landing squash
  const bs = carVisual.baseScale || 0.85;
  const sq = state.squash || 0;
  carVisual.group.scale.set(bs*(1+sq*0.16), bs*(1-sq*0.34), bs*(1+sq*0.16));
  for(const n of carVisual.nozzles){
    n.material.emissiveIntensity = (input.thrust && state.fuel>0 && state.mode==='play') ? 1.2 : 0.25;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* Boot */
['touchstart','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>audio.gesture(), {once:false, passive:true});
});
showTitle();
requestAnimationFrame(frame);

// Expose for smoke tests
window.__RSP = {
  version:6, levels:LEVELS.length, startLevel, showTitle, showSelect, state, car,
  getScore:()=>state.score, getMode:()=>state.mode, getStars:()=>state.starGrade, input
};
</script>
