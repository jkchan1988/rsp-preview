<body>
<div id="rotate"><div class="icon">📱</div><p>Turn your device sideways to play Roadster Stunt Paradise</p></div>

</div>

  <div id="padLeanFwd" class="pad">LEAN FWD<br>↻</div>

</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const STORE_KEY = 'rsp.v11.scores';
function loadScores(){ // v11: carries v10 progress forward so the kids keep their stars
  try{ const r = localStorage.getItem(STORE_KEY) || localStorage.getItem('rsp.v10.scores'); return r ? JSON.parse(r) : {levels:{}, endless:0}; }
  catch(e){ return {levels:{}, endless:0}; }
}
function saveScores(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let scores = loadScores();

/* ===== AudioBoot ===== */
const audio = (()=>{
  let ctx=null, master=null, pending=[], resumeP=null, muted=false;
  const AC = ()=> window.AudioContext || window.webkitAudioContext;
  let comp=null, musBus=null, duckG=null, hatHP=null;
  function build(){ if(ctx) return; const C=AC(); if(!C) return; ctx=new C(); master=ctx.createGain(); master.gain.value=0.72;
    // v13 MIX BUS: everything → master → gentle compressor/limiter → speakers (no clipping when a crash, boom and music stack up)
    comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.22;
    master.connect(comp); comp.connect(ctx.destination);
    // v13 MUSIC BUS: music → duck gain (SFX side-chain) → music gain → master
    musBus=ctx.createGain(); musBus.gain.value=0; duckG=ctx.createGain(); duckG.gain.value=1; duckG.connect(musBus); musBus.connect(master);
    hatHP=ctx.createBiquadFilter(); hatHP.type='highpass'; hatHP.frequency.value=7000; hatHP.connect(duckG); }
  function silentUnlock(){ if(!ctx) return; try{ const b=ctx.createBuffer(1,1,22050); const s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0);}catch(e){} }
  function resume(){
    if(!ctx) return Promise.resolve(false);
    if(ctx.state==='running') return Promise.resolve(true);
    if(resumeP) return resumeP;
    let p; try{ p=ctx.resume(); }catch(e){ return Promise.resolve(false); }
    resumeP = Promise.resolve(p).then(()=>{ resumeP=null; if(ctx.state==='running'){ flush(); return true;} return false; }).catch(()=>{ resumeP=null; return false; });
    return resumeP;
  }
  function flush(){ while(pending.length){ try{ pending.shift()(); }catch(e){} } }
  function gesture(){ build(); silentUnlock(); resume(); }
  function whenReady(fn){ build(); if(ctx && ctx.state==='running') fn(); else { if(pending.length>=6) pending.shift(); pending.push(fn); } resume(); } // v10: cap the queue — a suspended/interrupted iOS context no longer piles up (then bursts) hundreds of sounds
  function tone(freq, dur, type='sine', vol=0.15, slide=0){
    whenReady(()=>{
      if(muted||!ctx) return;
      const t0=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t0+dur);
      g.gain.setValueAtTime(0.001,t0);
      g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
    });
  }
  let noiseBuf=null;
  function ensureNoise(){ if(!noiseBuf){ const n=Math.floor(ctx.sampleRate*2); noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; } return noiseBuf; } // v13: one buffer shared by SFX, engine roar and hi-hats
  function noise(dur, vol=0.12){
    whenReady(()=>{
      if(muted||!ctx) return;
      ensureNoise(); // v10: one shared buffer (was a fresh buffer + Math.random fill per hit)
      const t0=ctx.currentTime, s=ctx.createBufferSource(); s.buffer=noiseBuf;
      const g=ctx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.linearRampToValueAtTime(vol*0.35,t0+dur*0.45); g.gain.linearRampToValueAtTime(0,t0+dur);
      s.connect(g); g.connect(master); s.start(t0, Math.random()*1.2); s.stop(t0+dur+0.03);
    });
  }
  // v10: continuous engine + rocket roar (persistent nodes, params only — no per-frame allocation)
  let eng=null;
  function buildEngine(){
    if(eng || !ctx || ctx.state!=='running') return;
    const o1=ctx.createOscillator(), o2=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    o1.type='sawtooth'; o2.type='square'; o1.frequency.value=55; o2.frequency.value=27.5; lp.type='lowpass'; lp.frequency.value=500; lp.Q.value=4;
    const g2=ctx.createGain(); g2.gain.value=0.45; o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.gain.value=0; g.connect(master);
    const rs=ctx.createBufferSource(); rs.buffer=ensureNoise(); // v13: reuse the shared noise buffer (was a second 2 s buffer)
    rs.loop=true; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.7;
    const rg=ctx.createGain(); rg.gain.value=0; rs.connect(bp); bp.connect(rg); rg.connect(master);
    o1.start(); o2.start(); rs.start();
    eng={o1,o2,lp,g,rg,bp,lf:0,lg:-1,lr:-1};
  }
  function engine(on, speed, gas, grounded, rocket){
    if(!ctx || ctx.state!=='running') return; buildEngine(); if(!eng) return;
    const t=ctx.currentTime, sp=Math.abs(speed||0);
    const f = (55 + sp*3.1 + (gas?14:0)) * (grounded?1:1.22);
    const gv = (on && !muted) ? (0.05 + Math.min(0.07, sp*0.0016) + (gas?0.05:0)) : 0;
    const rv = (on && !muted && rocket) ? 0.2 : 0;
    if(Math.abs(f-eng.lf)>0.8){ eng.lf=f; eng.o1.frequency.setTargetAtTime(f,t,0.06); eng.o2.frequency.setTargetAtTime(f*0.5,t,0.06); eng.lp.frequency.setTargetAtTime(380+sp*38+(gas?300:0),t,0.08); }
    if(Math.abs(gv-eng.lg)>0.004){ eng.lg=gv; eng.g.gain.setTargetAtTime(gv,t,0.07); }
    if(Math.abs(rv-eng.lr)>0.004){ eng.lr=rv; eng.rg.gain.setTargetAtTime(rv,t,rocket?0.04:0.12); }
  }

  /* v13 MUSIC: procedural, per-world background loop (no files, no network). A 25 ms look-ahead scheduler queues
     16th-notes ~120 ms ahead on the audio clock, so timing stays tight even when a frame hitches. Kick + hat + bass + arpeggio,
     I–V–vi–IV (sunny worlds) or i–VI–III–VII (night/fire/factory worlds). Big SFX duck the music for a moment. */
  const MUS = {
    paradise:{bpm:112, root:62, minor:false, lead:'triangle', oct:12, pat:0},
    beach:   {bpm:118, root:65, minor:false, lead:'triangle', oct:12, pat:1},
    desert:  {bpm:104, root:57, minor:false, lead:'triangle', oct:12, pat:2},
    candy:   {bpm:126, root:67, minor:false, lead:'sine',     oct:24, pat:1},
    ice:     {bpm:100, root:64, minor:false, lead:'sine',     oct:24, pat:3},
    industrial:{bpm:120,root:57, minor:true,  lead:'square',   oct:12, pat:2},
    cyber:   {bpm:128, root:59, minor:true,  lead:'square',   oct:12, pat:0},
    volcano: {bpm:122, root:55, minor:true,  lead:'sawtooth', oct:12, pat:3}
  };
  const PROG = { maj:[0,7,9,5], min:[0,8,3,10] };
  const ARP = [[0,1,2,3,2,1,2,3,0,1,2,3,2,1,2,-1],[0,2,1,3,0,2,1,3,0,-1,2,3,2,-1,1,2],[0,-1,1,2,3,-1,2,1,0,-1,1,2,3,2,1,-1],[0,1,2,-1,3,2,1,-1,0,1,2,3,-1,3,2,1]];
  let musicOn = true; try{ musicOn = localStorage.getItem('rsp_music') !== '0'; }catch(e){}
  const mus = { theme:null, cfg:null, step:0, next:0, timer:null, mode:'title', notes:0, lastDuck:0 };
  const MUS_VOL = { play:0.5, title:0.42, select:0.42, pause:0.16, grade:0, fail:0 };
  const midiHz = m => 440*Math.pow(2,(m-69)/12);
  function mNote(t, freq, dur, type, vol, dest){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||duckG); o.start(t); o.stop(t+dur+0.02); mus.notes++;
  }
  function mKick(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12);
    g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g); g.connect(duckG); o.start(t); o.stop(t+0.18); mus.notes++; }
  function mHat(t, v){ const s=ctx.createBufferSource(), g=ctx.createGain(); s.buffer=ensureNoise(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
    s.connect(g); g.connect(hatHP); s.start(t, (mus.step*0.37)%1.5); s.stop(t+0.05); mus.notes++; }
  function schedStep(t){
    const c=mus.cfg, st=mus.step%16, bar=Math.floor(mus.step/16)%4, prog=c.minor?PROG.min:PROG.maj;
    const chordRoot = c.root + prog[bar], third = c.minor ? ([0,3].includes(prog[bar]) ? 3 : 4) : ([0,7,5].includes(prog[bar]) ? 4 : 3);
    const tones=[0, third, 7, 12], spb=60/c.bpm/4;
    if(st%4===0) mKick(t);
    if(st%4===2) mHat(t, 0.09); else if(st%2===1) mHat(t, 0.035);

    const ai = ARP[c.pat][st]; if(ai>=0 && !(bar===3 && st>=12)) mNote(t, midiHz(chordRoot + c.oct + tones[ai]), spb*1.4, c.lead, c.lead==='square'||c.lead==='sawtooth' ? 0.045 : 0.085);
    if(st===0) mNote(t, midiHz(chordRoot + tones[1] + 12), spb*14, 'sine', 0.03); // soft pad tone under each bar
    mus.step++;
  }
  function musicPump(){
    if(!ctx || ctx.state!=='running' || !mus.cfg || !musicOn || muted || MUS_VOL[mus.mode]===0) return; // silent screens schedule nothing
    const now=ctx.currentTime, spb=60/mus.cfg.bpm/4;
    if(mus.next < now) mus.next = now + 0.05; // resync after a tab switch / iOS interruption instead of bursting the backlog
    while(mus.next < now + 0.12){ schedStep(mus.next); mus.next += spb; }
  }
  function musicLevel(){ if(!musBus) return; const v = (musicOn && !muted && mus.cfg) ? (MUS_VOL[mus.mode] ?? 0.4) : 0; musBus.gain.setTargetAtTime(v, ctx.currentTime, v<0.05?0.25:0.4); }
  function music(theme){
    const cfg = theme && MUS[theme] ? MUS[theme] : null;
    if(cfg && cfg===mus.cfg) return; // same world: keep the groove going (retries don't restart the song)
    mus.theme = cfg ? theme : null; mus.cfg = cfg; mus.step = 0; mus.next = 0;
    if(cfg && !mus.timer) mus.timer = setInterval(musicPump, 25);
    if(!cfg && mus.timer){ clearInterval(mus.timer); mus.timer=null; }

  }

  function engineLevel(){ return eng ? {f:+eng.lf.toFixed(1), g:+eng.lg.toFixed(3), r:+eng.lr.toFixed(3)} : null; }
  return {

function bindHold(el, on, off){
  const down = e=>{ e.preventDefault(); audio.gesture(); on(e); el.classList.add('on'); };
  const up = e=>{ e.preventDefault(); off(e); el.classList.remove('on'); };
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up, {passive:false});
  el.addEventListener('touchcancel', up, {passive:false});
  el.addEventListener('mousedown', down);
  window.addEventListener('mouseup', up);
}
bindHold(padGas, ()=>{ input.gas=true; }, ()=>{ input.gas=false; });
bindHold(padBrake, ()=>{ input.brake=true; }, ()=>{ input.brake=false; });
bindHold(padLeanBack, ()=>{ input.lean=-1; }, ()=>{ if(input.lean<0) input.lean=0; });
bindHold(padLeanFwd, ()=>{ input.lean=1; }, ()=>{ if(input.lean>0) input.lean=0; });
bindHold(btnThrust, ()=>{ input.thrust=true; btnThrust.classList.add('on'); audio.thrust(); haptic(8); }, ()=>{ input.thrust=false; btnThrust.classList.remove('on'); });

function effectiveLean(){
  let L = input.lean;
  if(input.tiltEnabled && Math.abs(input.tiltLean) > Math.abs(L)) L = input.tiltLean;
  return L;
}

window.addEventListener('keydown', e=>{
  audio.gesture();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ input.lean=-1; padLeanBack.classList.add('on'); }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ input.lean=1; padLeanFwd.classList.add('on'); }
  if(e.code==='ArrowUp'||e.code==='KeyW'){ input.gas=true; padGas.classList.add('on'); e.preventDefault(); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ input.brake=true; padBrake.classList.add('on'); e.preventDefault(); }
  if(e.code==='Space'||e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ e.preventDefault(); if(!input.thrust){ audio.thrust(); haptic(8);} input.thrust=true; btnThrust.classList.add('on'); }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state.mode==='play') togglePause(); }
  if(e.code==='KeyM' && !e.repeat) toggleMusic(); // v13
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){ if(input.lean<0) input.lean=0; padLeanBack.classList.remove('on'); }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ if(input.lean>0) input.lean=0; padLeanFwd.classList.remove('on'); }
  if(e.code==='ArrowUp'||e.code==='KeyW'){ input.gas=false; padGas.classList.remove('on'); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ input.brake=false; padBrake.classList.remove('on'); }
  if(e.code==='Space'||e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ input.thrust=false; btnThrust.classList.remove('on'); }
});

let tiltListening=false;
function onTilt(ev){
  if(!input.tiltEnabled) return;
  const g=ev.gamma, b=ev.beta;
  if(g==null && b==null) return;
  const landscape = Math.abs(window.orientation||0)===90 || window.innerWidth>window.innerHeight;
  const v = landscape ? (typeof b==='number'?b:g) : (typeof g==='number'?g:b);
  input.tiltLean = Math.max(-1, Math.min(1, (v||0)/26));
  input.tiltOk = true;
}
function ensureTiltListener(){ if(tiltListening) return; tiltListening=true; window.addEventListener('deviceorientation', onTilt, true); }
function setTiltEnabled(on){
  input.tiltEnabled=!!on;
  const btn=document.getElementById('tiltToggle');
  btn.classList.toggle('on', input.tiltEnabled);
  btn.setAttribute('aria-pressed', input.tiltEnabled?'true':'false');
  btn.textContent = input.tiltEnabled ? 'TILT ON' : 'TILT OFF';
  if(input.tiltEnabled){
    ensureTiltListener();
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(st=>{ if(st!=='granted') setTiltEnabled(false); }).catch(()=>setTiltEnabled(false));
    }
  } else { input.tiltLean=0; input.tiltOk=false; }
}
document.getElementById('tiltToggle').addEventListener('click', ()=>{ audio.gesture(); audio.ui(); setTiltEnabled(!input.tiltEnabled); });

/* ===== Level builders ===== */
function L(name, theme, segments, stars, smashables, tip, checkpoints, boostPads, routes, props){
  // segments: array of waypoint arrays (gaps between segments = air launches)
  if(segments.length && segments[0] && segments[0].isVector3){
    segments = [segments]; // allow single path
  }
  return { name, theme, segments, stars:stars||[], smashables:smashables||[], tip:tip||'',
    checkpoints:checkpoints||[], boostPads:boostPads||[], routes:routes||[], props:props||[] };
}
function P(x,y,z=0){ return new THREE.Vector3(x,y,z); }
function flat(x0,y0,len,n=6,z=0){
  const a=[]; for(let i=0;i<=n;i++) a.push(P(x0+len*(i/n), y0, z)); return a;
}
function ramp(x0,y0,len,rise,n=10,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0+rise*t*t, z)); }
  a[a.length-1].lip = true; // v7: ramp lip = launch point
  return a;
}
function down(x0,y0,len,drop,n=10,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0-drop*t*t, z)); } return a;
}
function hump(x0,y0,len,h,n=14,z=0){
  const a=[]; for(let i=0;i<=n;i++){ const t=i/n; a.push(P(x0+len*t, y0+Math.sin(t*Math.PI)*h, z)); } return a;
}
function loop(cx, cy, r, startAng, endAng, n=36, z=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const ang = startAng + (endAng-startAng)*t;
    a.push(P(cx + Math.sin(ang)*r, cy - Math.cos(ang)*r, z));
  }
  return a;
}
/** Corkscrew helix — SP signature spectacle */
function corkscrew(x0, y0, len, radius, turns, n=48, z0=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const ang = t * turns * Math.PI * 2;
    a.push(P(x0 + len*t, y0 + Math.sin(ang)*radius, z0 + Math.cos(ang)*radius - radius));
  }
  return a;
}
/** Banked wall-ride segment */
function wallRide(x0, y0, len, height, side=1, n=36, z0=0){
  const a=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const bank = Math.sin(t * Math.PI);
    const y = y0 + height * Math.sin(t * Math.PI) * 0.85;
    const z = z0 + side * bank * (5.0 * 0.15 + 4.5);
    a.push(P(x0 + len*t, y, z));
  }
  return a;
}
function join(...segs){
  const out=[];
  for(const seg of segs){
    for(let j=0;j<seg.length;j++){
      if(out.length && j===0) continue;
      out.push(seg[j]);
    }
  }
  return out;
}

function buildSegment(waypoints){
  const curve = new THREE.CatmullRomCurve3(waypoints, false, 'catmullrom', 0.15);
  const len = Math.max(0.01, curve.getLength());
  const n = Math.max(40, Math.floor(len * 3));

  // Parallel-transport frames with world-up bias so flats stay upright (Frenet flips on straightaways)
  let prevBin = null;
  for(let i=0;i<=n;i++){
    const t=i/n;
    const pos = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let binormal, normal;
    // Prefer world-up crossed with tangent for banked/sideways
    const side = new THREE.Vector3().crossVectors(worldUp, tangent);
    if(side.lengthSq() < 1e-6){
      // Vertical tangent (loop top/bottom) — fall back to previous binormal or +Z
      binormal = (prevBin ? prevBin.clone() : new THREE.Vector3(0,0,1));
      // Gram-Schmidt against tangent
      binormal.addScaledVector(tangent, -binormal.dot(tangent)).normalize();
      if(binormal.lengthSq() < 1e-6) binormal.set(0,0,1);
    } else {
      binormal = side.normalize();
      // Keep consistent side vs previous
      if(prevBin && binormal.dot(prevBin) < 0) binormal.negate();
    }
    normal = new THREE.Vector3().crossVectors(tangent, binormal).normalize();
    // In loops, when upside-down, normal should point "inward" (toward track underside relative to car).
    // World-up method already gives correct radial normal for vertical circles when tangent × side works.
    prevBin = binormal.clone();
    frames.push({ s:t*len, t, pos, tangent, normal, binormal });
  }
  // v7: fix inverted normals after loops (car was driving UNDER the track after Volcano Ring's loop).
  // Upside-down is only legit inside a loop (tangent steep or running backwards).
  const fwd = new THREE.Vector3().subVectors(frames[frames.length-1].pos, frames[0].pos).setY(0).normalize();
  for(const f of frames){
    const inLoop = Math.abs(f.tangent.y) > 0.6 || f.tangent.clone().setY(0).dot(fwd) < 0;
    if(!inLoop && f.normal.y < 0){ f.normal.negate(); f.binormal.negate(); }
  }

  const lips = [];

    if(!w.lip) continue;
    let bi=0, bd=1e12;

    // ramps ending a segment (gap launch already handles those) are left alone.
    const ahead = frames[Math.min(frames.length-1, bi + Math.round(6*(frames.length-1)/len))];
    if(ls > 1 && ls < len - 8 && ahead.pos.y < w.y - 0.6) lips.push(ls);

  return { curve, frames, length:len, lips };

  const A=frames[i0], B=frames[i1];
  out.s=ss; out.globalS=seg.s0+ss; out.seg=seg.index; out.atEnd = ss >= len-0.35;
  out.pos.copy(A.pos).lerp(B.pos,f);
  out.tangent.copy(A.tangent).lerp(B.tangent,f).normalize();
  out.normal.copy(A.normal).lerp(B.normal,f).normalize();
  out.binormal.copy(A.binormal).lerp(B.binormal,f).normalize();
  if(over>0) out.pos.addScaledVector(out.tangent, over);       // extrapolate past the segment tip (wheel probes)

function sampleFrames(framesData, globalS){

    if(rem <= seg.length || seg === framesData.segs[framesData.segs.length-1]){
      return sampleSegment(seg, Math.min(rem, seg.length));
    }
    rem -= seg.length;
  }
  return sampleSegment(framesData.segs[framesData.segs.length-1], framesData.segs[framesData.segs.length-1].length);

function mergeStatic(group){ // v9: one draw call per material instead of one per plank

    if(c.isMesh && !c.userData.dynamic && c.geometry && !Array.isArray(c.material)){

function buildTrackMeshes(framesData, theme){
  clearGroup(trackGroup); clearGroup(decorGroup);

  const matUnder = new THREE.MeshStandardMaterial({ color:0x1a1520, metalness:0.4, roughness:0.7 });

  const matStripe = new THREE.MeshStandardMaterial({ color:0xf5f0e6, metalness:0.1, roughness:0.45 });
  const matEdge = new THREE.MeshStandardMaterial({ color:theme.rail, metalness:0.4, roughness:0.4, emissive:theme.rail, emissiveIntensity:0.18 });

  for(const seg of framesData.segs){
    // Flat ribbon planks with thickness — car rides on TOP
    for(let i=0;i<seg.frames.length-1;i++){
      const a=seg.frames[i], b=seg.frames[i+1];
      const mid = a.pos.clone().lerp(b.pos, 0.5);
      const dist = Math.max(0.35, a.pos.distanceTo(b.pos) + 0.08);
      const plank = new THREE.Mesh(new THREE.BoxGeometry(dist, TRACK_T, TRACK_W), matTrack);
      const m4 = new THREE.Matrix4().makeBasis(a.tangent.clone().normalize(), a.normal.clone().normalize(), a.binormal.clone().normalize());
      plank.quaternion.setFromRotationMatrix(m4);
      // sit so TOP surface is near path
      plank.position.copy(mid).add(a.normal.clone().multiplyScalar(-TRACK_T * 0.5));
      plank.castShadow = true; plank.receiveShadow = true;
      trackGroup.add(plank);

      if(i % 2 === 0){
        const under = new THREE.Mesh(new THREE.BoxGeometry(dist*0.95, 0.12, TRACK_W*0.92), matUnder);
        under.quaternion.copy(plank.quaternion);
        under.position.copy(mid).add(a.normal.clone().multiplyScalar(-TRACK_T - 0.05));
        trackGroup.add(under);
      }

      if(i % 3 === 0){
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(dist * 0.7, 0.05, 0.28), matStripe);
        stripe.quaternion.copy(plank.quaternion);
        stripe.position.copy(mid).add(a.normal.clone().multiplyScalar(0.02));
        trackGroup.add(stripe);
      }

      if(i % 2 === 0){
        for(const side of [-1,1]){
          const curb = new THREE.Mesh(new THREE.BoxGeometry(dist + 0.06, 0.38, 0.22), matEdge);
          curb.quaternion.copy(plank.quaternion);
          curb.position.copy(mid)
            .add(a.normal.clone().multiplyScalar(0.08))
            .add(a.binormal.clone().multiplyScalar(side * (TRACK_W * 0.5 - 0.08)));
          trackGroup.add(curb);
        }
      }
    }
    // Glow rail tubes along edges (thin, above surface)
    for(const side of [-1, 1]){
      const pts = seg.frames.map(f => f.pos.clone()
        .add(f.normal.clone().multiplyScalar(0.28))
        .add(f.binormal.clone().multiplyScalar(side * TRACK_W * 0.5)));
      if(pts.length < 2) continue;
      const railCurve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
      const rail = new THREE.Mesh(
        new THREE.TubeGeometry(railCurve, Math.max(40, Math.floor(seg.length * 2.5)), 0.1, 6, false),
        matRail

      trackGroup.add(rail);
    }
  }

  const ground = new THREE.Mesh(
    new THREE.CylinderGeometry(280, 280, 2, 64),
    new THREE.MeshStandardMaterial({ color: theme.ground, roughness: 1, metalness: 0 })
  );
  ground.position.set(framesData.length * 0.3, -12, 0);
  ground.receiveShadow = true;
  decorGroup.add(ground);

  for(let i=0;i<24;i++){
    const f = framesData.frames[(i * 41) % framesData.frames.length];

    const h = 5 + (i % 6) * 2.2;

      .add(f.binormal.clone().multiplyScalar(side * (11 + (i % 4) * 2.5)))

  const top = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 8.2), matAccent); top.position.set(0, 10, 0); arch.add(top);
  const banner = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.2, 6.5), matAccent); banner.position.set(0, 8.2, 0); arch.add(banner);
  const chevMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:theme.accent, emissiveIntensity:1.4, metalness:0.2, roughness:0.3 });
  for(let c=0;c<3;c++){
    const chev = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 1.8 - c*0.35), chevMat);

  arch.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(end.tangent, end.normal, end.binormal));

}

function nearestFrameToXY(framesData, x, y){
  let best=framesData.frames[0], bd=1e9;
  for(const f of framesData.frames){
    const d=Math.abs(f.pos.x-x)+Math.abs(f.pos.y-(y||0))*0.5;
    if(d<bd){ bd=d; best=f; }
  }
  return best;
}

/* v12 COLLAPSING BRIDGE: wooden planks over the longest flat stretch; each plank drops and tumbles the moment

  let best = null;

    let run = null;

      p.fall = true; p.t = 0; p.vy = 1.2 + Math.random()*1.2; p.wx = (Math.random()-0.5)*5; p.wz = (Math.random()-0.5)*4; b.fallen++; dirty = true;
      spawnParticle(p.x, p.y, p.z + (Math.random()-0.5)*3, (Math.random()-0.5)*2, 1.5, (Math.random()-0.5)*2, 0.5, 0.75, 0.55, 0.32);

/* v14 shared: find level, upright flat runs on the track, away from other set pieces */
function flatRuns(level, framesData, minLen){
  const avoid = [];
  for(const bp of (level.bouncePads||[])) avoid.push(bp.x); for(const f of (level.fans||[])) avoid.push(f.x); if(level.gold) avoid.push(level.gold.x);
  const b = level._bridge; const runs = [];
  for(const seg of framesData.segs){ let run = null;
    for(const f of seg.frames){
      const ok = f.normal.y > 0.985 && f.tangent.x > 0.97 && seg.s0 + f.s > 24 && !avoid.some(x=>Math.abs(f.pos.x-x)<6) && !(b && f.pos.x > b.x0-4 && f.pos.x < b.x1+4);
      if(ok){ if(!run) run = { a:f, b:f }; else run.b = f; }
      if(!ok || f === seg.frames[seg.frames.length-1]){ if(run && run.b.pos.x-run.a.pos.x >= minLen) runs.push(run); if(!ok) run = null; }
    }

  ghost.play = (!endless && !fromCp) ? ghostLoad(idx) : null; ghost.bestT = ghost.play ? ghost.play.t : null;
  ghostMesh.visible = false;
}
function ghostRecord(){
  if(!ghost.recValid) return;
  if(ghost.steps % GHOST_EVERY === 0){ if(ghost.rec.length/7 >= GHOST_MAX){ ghost.recValid=false; return; }
    const q=car.quat; ghost.rec.push(Math.round(car.pos.x*100)/100, Math.round(car.pos.y*100)/100, Math.round(car.pos.z*100)/100, Math.round(q.x*1000)/1000, Math.round(q.y*1000)/1000, Math.round(q.z*1000)/1000, Math.round(q.w*1000)/1000); }
  ghost.steps++; ghost.t += DT;
}
function ghostSaveOnWin(idx){
  if(!ghost.recValid || !ghost.rec || ghost.rec.length < 14) return;
  const prev = ghostLoad(idx);
  if(prev && prev.t <= ghost.t) return;
  try{ localStorage.setItem(ghostKey(idx), JSON.stringify({t:Math.round(ghost.t*100)/100, d:ghost.rec})); ghost.newBest = true; }catch(e){}
}
const _gqA=new THREE.Quaternion(), _gqB=new THREE.Quaternion();
function updateGhost(){
  const p = ghost.play;
  if(!p || state.mode!=='play'){ ghostMesh.visible = !!p && state.mode==='pause' && ghostMesh.visible; return; }
  const n = p.d.length/7, f = (ghost.t + acc) / (DT*GHOST_EVERY), i = Math.floor(f);
  if(i >= n-1){ ghostMesh.visible=false; return; }
  const a=i*7, b=a+7, u=f-i, d=p.d;
  ghostMesh.position.set(d[a]+(d[b]-d[a])*u, d[a+1]+(d[b+1]-d[a+1])*u, d[a+2]+(d[b+2]-d[a+2])*u);
  _gqA.set(d[a+3],d[a+4],d[a+5],d[a+6]).normalize(); _gqB.set(d[b+3],d[b+4],d[b+5],d[b+6]).normalize(); ghostMesh.quaternion.slerpQuaternions(_gqA,_gqB,u);
  ghostMesh.visible = true;
}

/* v10 COINS: a trail along every segment, one InstancedMesh per level (1 draw call); collected = zero-scale matrix */
const COIN_MAX = 96, COIN_R = 2.4;
const coinGeo = new THREE.CylinderGeometry(0.46,0.46,0.1,18); coinGeo.rotateX(Math.PI/2);
const coinMat = new THREE.MeshStandardMaterial({ color:0xffd24a, emissive:0xc08000, emissiveIntensity:0.7, metalness:0.75, roughness:0.25 });
const _cM=new THREE.Matrix4(), _cQ=new THREE.Quaternion(), _cS=new THREE.Vector3(1,1,1), _cZ=new THREE.Vector3(0,0,0), _cY=new THREE.Vector3(0,1,0);
function buildCoins(level, framesData){
  const avoid = [];
  for(const bp of (level.bouncePads||[])) if(bp._mesh) avoid.push(bp._mesh.position);
  for(const m of (level._boostMeshes||[])) avoid.push(m.position);
  for(const m of (level._smashMeshes||[])) avoid.push(m.position);
  for(const m of (level._starMeshes||[])) avoid.push(m.position);
  let total=0; for(const sg of framesData.segs) total += sg.length;
  const step = Math.max(5.5, total/COIN_MAX);
  const pts=[];
  for(const sg of framesData.segs){
    for(let cs=5; cs<sg.length-3 && pts.length<COIN_MAX; cs+=step){
      const f = sampleSegment(sg, cs);
      const p = f.pos.clone().addScaledVector(f.normal, 1.15);
      if(avoid.some(a=>a.distanceToSquared(p) < 12)) continue;
      pts.push({p, seg:sg.index, s:cs, taken:false});
    }
  }
  const im = new THREE.InstancedMesh(coinGeo, coinMat, Math.max(1, pts.length));
  im.count = pts.length; im.frustumCulled = false;
  for(let i=0;i<pts.length;i++){ _cM.compose(pts[i].p, _cQ.identity(), _cS); im.setMatrixAt(i, _cM); }
  im.instanceMatrix.needsUpdate = true;
  pickupGroup.add(im);
  level._coins = { im, pts, n:pts.length };
}
function updateCoins(dt){
  const c = state.level && state.level._coins; if(!c || !c.n) return;
  _cQ.setFromAxisAngle(_cY, performance.now()/1000*3.2);
  const r2 = COIN_R*COIN_R;
  for(let i=0;i<c.n;i++){
    const pt=c.pts[i];
    if(!pt.taken && state.mode==='play' && pt.p.distanceToSquared(car.pos) < r2){
      pt.taken=true; state.coins=(state.coins||0)+1; state.score += 10;
      const t=performance.now(); if(!(t - (state._coinSfx||0) < 70)){ state._coinSfx=t; audio.coin(); }
      spawnParticle(pt.p.x, pt.p.y, pt.p.z, 0, 3, 0, 0.35, 1.0, 0.85, 0.3);
    }
    _cM.compose(pt.p, _cQ, pt.taken ? _cZ : _cS); c.im.setMatrixAt(i, _cM);
  }
  c.im.instanceMatrix.needsUpdate = true;
}
function boomBox(bp, fr){ // v10 set piece: BOOM box → confetti blast, short slow-mo, camera swoop
  if(bp._mesh) bp._mesh.visible = false;
  const p = bp._mesh ? bp._mesh.position : car.pos;
  const COLS=[[1,0.35,0.2],[1,0.85,0.2],[0.3,0.9,1],[0.5,1,0.4],[1,0.5,0.9]];
  for(let i=0;i<70;i++){ const a=Math.random()*Math.PI*2, v=6+Math.random()*16, c=COLS[i%5];
    spawnParticle(p.x, p.y+0.4, p.z, Math.cos(a)*v*0.7, 6+Math.random()*16, Math.sin(a)*v*0.5, 0.7+Math.random()*0.7, c[0],c[1],c[2]); }
  audio.boom(); haptic(30);
  state.shake = Math.max(state.shake, 0.45); state.fovPunch = Math.min(1, state.fovPunch + 0.5);
  state.slowmo = 0.75; state.slowmoScale = 0.4; state.slowmoUsedAt = performance.now();
  state.cine = { t:0, dur:2.0 }; state.cineCount = (state.cineCount||0) + 1;
  addScore(250, 'KABOOM!', 'combo');
}

function applyTheme(key){
  const th = THEMES[key] || THEMES.desert;
  scene.background = new THREE.Color(th.sky);
  scene.fog = new THREE.Fog(th.fog, 50, 280);
  setSkyTheme(key, th); // v16: gradient sky + matching fog + cloud tint
  const LT = WORLD_LIGHT[key] || WORLD_LIGHT.desert; // v15: per-world light mood (intensity + fog depth)
  scene.fog.near = LT.fn*LITE.fogK; scene.fog.far = LT.ff*LITE.fogK; state.fogBase = [LT.fn, LT.ff];

function startLevel(idx, endless=false, fromCheckpoint=false){
  state.jumps = 0; if(typeof _cv!=="undefined") _cv.init=false;
  const keepCp = fromCheckpoint && state.lastCheckpoint && state.lastCheckpoint.levelIndex===idx && !endless
    ? Object.assign({}, state.lastCheckpoint) : null;
  state.endless = endless;
  state.levelIndex = idx;
  state.mode = 'play';
  if(!keepCp){
    state.score=0; state.mult=1; state.combo=0; state.comboTimer=0;
    state.fuel=1; state.starsGot=0; state.smashes=0; state.checkpointsGot=0; state.boostsGot=0; state.propsGot=0;
    state.flips=0; state.frontflips=0; state.backflips=0; state.airTimeTotal=0;
    state.cleanLands=0; state.thrustStyle=0; state.perfectLands=0; state.bestStreak=0;
    state.lastCheckpoint=null; state.coins=0; state.goldGot=false;
  } else {
    state.mult=1; state.combo=0; state.comboTimer=0;
    state.fuel=Math.max(keepCp.fuelFloor||0.45, state.fuel||0.45);
  }
  state.shake=0; state.fovPunch=0; state.squash=0; state.cine=null; state.finale=null; finaleCard=null; state.slowmo=0; state.cineCount=0;
  susp.cF=susp.cR=SUSP.sag; susp.vF=susp.vR=0; susp.hF=susp.hR=0; susp.peak=0; susp.kicks=0;
  state.grade='☆☆☆'; state.starGrade=0; state.chunks=[];
  particles.clear();

  let level;
  if(endless){
    level = makeEndlessChunk(0);
  } else {
    level = LEVELS[idx];
  }
  state.level = level; state.padsUsed = new Set(); state.padHits = 0;
  state.starsTotal = level.stars.length;
  const th = applyTheme(level.theme);
  audio.music(level.theme); // v13: each world has its own tune
  state.framesData = buildFrames(level.segments);
  buildTrackMeshes(state.framesData, th);
  buildPickups(level, state.framesData);

  // Mark prior checkpoints as collected when respawning past them
  if(keepCp){
    for(const gate of (level._cpMeshes||[])){
      if(gate.userData.s <= keepCp.s + 0.5){
        gate.userData.taken=true; gate.visible=false;
      }
    }
    // v10: coins/gold collected before the checkpoint stay collected (no double counting)
    const before=(sg,ss)=> sg < (keepCp.segIndex||0) || (sg===(keepCp.segIndex||0) && ss <= keepCp.s + 0.5);
    if(level._coins) for(const pt of level._coins.pts) if(before(pt.seg, pt.s)) pt.taken=true;
    state.coins = keepCp.coins||0; state.goldGot = !!keepCp.gold;
    if(level._gold && keepCp.gold){ level._gold.userData.taken=true; level._gold.visible=false; }
  }

  car.s = keepCp ? keepCp.s : 0.5;
  car.segIndex = keepCp ? (keepCp.segIndex||0) : 0;
  car.lipLaunch=false; car.grounded=true; car.speed= keepCp?16:8; car.pitch=0; car.pitchVel=0; car.airTime=0; car.flipAcc=0; car.airGrace=0;
  const fr = sampleSegment(state.framesData.segs[car.segIndex]||state.framesData.segs[0], car.s)
    || sampleFrames(state.framesData, car.s);
  car.pos.copy(fr.pos).addScaledVector(fr.normal, RIDE);
  car.vel.set(0,0,0);
  orientCar(fr, 0);
  if(keepCp) state.lastCheckpoint = keepCp;
  state.landStreak = 0; state.gatesOpened = 0; state.bonks = 0; state.blobsLaunched = 0; ghostStart(idx, endless, !!keepCp); state.fanHits = 0; state.fanPeak = 0; state.bridgeRuns = 0;
  if(level._train){ level._train.x = car.pos.x - 18; level._train.speed = 0; level._train.honked=false; level._train.alongside=0; level._train.g.position.x = level._train.x; }

  showPlayUI(true);
  hideOverlay();
  updateHUD();
}

function makeEndlessChunk(n){
  const keys = Object.keys(THEMES);
  const theme = keys[n % keys.length];
  const x0 = 0;
  const pieces = [
    flat(x0,0,18),
    ramp(x0+18,0,22+n%3*4,11+n%4*2),
    down(x0+40,11+n%4*2,18,11+n%4*2),
    flat(x0+58,0,10),
  ];
  const variant = n % 5;
  if(variant===0) pieces.push(corkscrew(x0+68, 2, 38, 2.8, 1.0+ (n%2)*0.25, 34));
  else if(variant===1) pieces.push(wallRide(x0+68, 0, 68, 7+(n%3), (n%2)?1:-1, 46));
  else if(variant===2){ pieces.push(hump(x0+68,0,26,8+n%3*2)); pieces.push(hump(x0+94,0,24,10)); }
  else if(variant===3) pieces.push(loop(x0+90, 14, 12+(n%2), -0.2, Math.PI*2-0.2, 36));
  else { pieces.push(corkscrew(x0+68, 2, 28, 2.4, 1.0, 28)); pieces.push(wallRide(x0+100, 2, 48, 6, 1, 32)); }
  if(n%2===0) pieces.push(flat(x0+140,0,28));
  else pieces.push(ramp(x0+140,0,20,8), down(x0+160,8,16,8));
  pieces.push(flat(x0+175,0,40));
  const wp = join(...pieces);
  const stars=[], smashables=[], checkpoints=[], boostPads=[], routes=[], props=[];
  for(let i=0;i<4;i++) stars.push({x:28+i*32, y:8+(i%2)*4});
  if(n>0) smashables.push({x:55, y:2, kind: n%2?'barrel':'crate'});
  if(n>1) smashables.push({x:100, y:2, kind: n%3===0?'cone':'tire'});
  if(n>2) smashables.push({x:150, y:2, kind: n%2?'cone':'barrel'});
  // multi-checkpoint chain in endless
  checkpoints.push({x:50, y:4});
  checkpoints.push({x:120, y:5});
  if(n%2===0) checkpoints.push({x:165, y:4});
  boostPads.push({x:35, y:1});
  if(n%2) boostPads.push({x:145, y:1});
  routes.push({x:70, y:12}, {x:110, y:14});
  const kinds=['balloon','billboard','spinner'];
  props.push({x:60, y:5, kind:kinds[n%3]});
  props.push({x:130, y:6, kind:kinds[(n+1)%3]});
  if(n%2===0) props.push({x:160, y:4, kind:'balloon'});
  return L('Endless '+ (n+1), theme, [wp], stars, smashables, 'How far can you go?', checkpoints, boostPads, routes, props);
}

function orientCar(fr, pitch){
  // base from track frame, extra pitch around binormal when airborne
  const tang = fr.tangent.clone();
  const norm = fr.normal.clone();
  const bin = fr.binormal.clone();
  if(Math.abs(pitch)>0.001){
    const q = new THREE.Quaternion().setFromAxisAngle(bin, pitch);
    tang.applyQuaternion(q); norm.applyQuaternion(q);
  }
  const side = bin.crossVectors(tang, norm).normalize(); // v10 fix: track binormal points -z, which made this basis left-handed (det -1) so the extracted quaternion under-pitched the car on every slope; build a proper right-handed basis instead
  const m = new THREE.Matrix4().makeBasis(tang, norm, side);
  car.quat.setFromRotationMatrix(m);
  carVisual.group.quaternion.copy(car.quat);
  carVisual.group.position.copy(car.pos);
}

function addScore(pts, label, cls){
  const gained = Math.floor(pts * state.mult);
  state.score += gained;
  if(label) popup(label, cls || (/FLIP/.test(label)?'flip':(/SMASH|BOOM|CRUNCH/.test(label)?'smash':(/CHECKPOINT/.test(label)?'checkpoint':(/BOOST/.test(label)?'boost':(/POP|BOUNCE/.test(label)?'pop':'combo'))))));
  if(state.comboTimer>0){ state.combo++; state.mult = Math.min(8, 1+Math.floor(state.combo/2)); }
  else { state.combo=1; state.mult=1; }
  state.comboTimer = 1.8;
  punchCombo();
  updateHUD();
}
const _pop = { el:null, last:'', n:1, t:0 };
function popup(text, cls){ // v8: single reused popup; repeats combine ("BACKFLIP! ×3")
  if(!_pop.el){ _pop.el=document.createElement('div'); document.body.appendChild(_pop.el); }
  const now=performance.now();
  if(text===_pop.last && now-_pop.t<1100) _pop.n++; else _pop.n=1;
  _pop.last=text; _pop.t=now;
  const el=_pop.el;
  el.className='popup'+(cls?(' '+cls):'');
  el.textContent = _pop.n>1 ? text+' ×'+_pop.n : text;
  el.style.animation='none'; requestAnimationFrame(()=>{ el.style.animation=''; });
}
function punchCombo(){
  const el=document.getElementById('combo');
  if(state.combo>=2){
    el.textContent='COMBO ×'+state.mult;
    el.style.opacity='1';
    el.classList.remove('punch'); requestAnimationFrame(()=>el.classList.add('punch')); // v8: no forced reflow
  } else el.style.opacity='0';
}
function starString(n){
  n = Math.max(0, Math.min(3, n|0));
  return '★'.repeat(n) + '☆'.repeat(3-n);
}
function computeStarGrade(){
  const tot = state.starsTotal||1;
  const ratio = state.starsGot / tot;
  let g = 1;
  if(ratio >= 0.5 || state.flips >= 1 || state.smashes >= 2) g = 2;
  if(ratio >= 0.85 || (state.flips >= 2 && state.smashes >= 2)) g = 3;
  if(state.starsGot >= tot && tot > 0) g = 3;
  return g;
}
const _hud = { score:-1, mult:-1, grade:'', star:'', el:null };

          car.pitch=0; car.pitchVel=0; car.flipAcc=0; susp.vF -= 1.6; susp.vR -= 1.6;
          state.jumps=(state.jumps||0)+1; state.shake=Math.max(state.shake,0.18); state.fovPunch=Math.min(1,state.fovPunch+0.2);
          audio.fan(); haptic(12); addScore(120, 'WHOOSH!', 'pop');
          return;
        }
      }
      if(input.thrust && state.fuel>0){
        emitThrust(fr);
      }
      if(car.speed > 28 && Math.random()<0.4){
        const bx=car.pos.x-fr.tangent.x*1.2, by=car.pos.y-fr.tangent.y*1.2, bz=car.pos.z-fr.tangent.z*1.2;
        spawnParticle(bx, by, bz, -fr.tangent.x*6, 0.5, -fr.tangent.z*6, 0.2, 0.7, 0.85, 1.0);
      }
    }

  } else {
    // Airborne — weighty SP rotation
    car.airTime += dt;
    if(car.loopDropT>0) car.loopDropT-=dt;
    if(car.airGrace > 0) car.airGrace = Math.max(0, car.airGrace - dt);
    state.airTimeTotal += dt;
    car.pitchVel += lean * LEAN_TORQUE * dt;
    car.pitchVel *= (1 - AIR_DAMP*dt);
    car.pitch += car.pitchVel * dt;
    car.flipAcc += car.pitchVel * dt;
    while(Math.abs(car.flipAcc) >= Math.PI*2){
      const dir = Math.sign(car.flipAcc);
      car.flipAcc -= dir*Math.PI*2;
      state.flips++;
      if(dir < 0){ state.backflips++; addScore(280, 'BACKFLIP!', 'flip'); }
      else { state.frontflips++; addScore(280, 'FRONTFLIP!', 'flip'); }
      audio.flip(); haptic(12);
      state.shake = Math.max(state.shake, 0.1);
      state.fovPunch = Math.min(0.6, state.fovPunch + 0.12);
    }
    if(car.airTime > 1.2 && car.airTime - (car.lastAirBonus||0) >= 1.2){ car.lastAirBonus = car.airTime;
      addScore(15, null, 'combo');
    }

    car.vel.y -= GRAV * dt;
    { const fan = fanAt(car.pos.x, car.pos.y); // v11: air column lift, strongest near the fan, fades at the top
      if(fan){ const dy = car.pos.y - fan.y, k = Math.max(0, 1 - dy/FAN_H);
        if(fan.cool <= 0 && dy < 7 && car.vel.y < 8){ fan.cool = 1.2; fan.hits++; state.fanHits=(state.fanHits||0)+1; car.vel.y = 16; car.vel.x *= 0.6; audio.fan(); haptic(10); addScore(120, 'WHOOSH!', 'pop'); }
        else if(k > 0.3) car.vel.x *= (1 - 2.2*dt); // air column holds you over the fan a moment
        car.vel.y += GRAV*(0.6 + 1.5*k)*dt; if(car.vel.y > 17) car.vel.y = 17; fan.peak = Math.max(fan.peak, dy); state.fanPeak = Math.max(state.fanPeak||0, dy); } }
    // thruster
    const frApprox = nearestFrame(car.pos);
    const forward = _af.copy(frApprox.tangent);
    // apply pitch to thrust direction
    const bin = _ab.copy(frApprox.binormal);
    const q = _aq.setFromAxisAngle(bin, car.pitch);
    forward.applyQuaternion(q);
    const up = _au.copy(frApprox.normal).applyQuaternion(q);
    if(input.thrust && state.fuel>0){ // v9 ROCKET: lift beats gravity → hover/float ONLY while rocket burns
      car.vel.addScaledVector(forward, THRUST_FORCE*0.5*dt);
      car.vel.y += (car.vel.y < 9 ? GRAV*1.12 : GRAV)*dt; // net lift up to 9 u/s, then pure hover

    if(input.brake) car.vel.multiplyScalar(1 - 1.2*dt);

    car.pos.addScaledVector(car.vel, dt);
    // soft air-right near ground
    const near = nearestFrame(car.pos);
    const rel = _ar.copy(car.pos).sub(near.pos);
    const height = rel.dot(near.normal);
    const lateral = Math.abs(rel.dot(near.binormal));
    if(height < 5 && height > -1){
      car.pitchVel += (-car.pitch)*1.2*dt; // softer auto-right
    }
    orientCar(near, car.pitch);
    suspStep(dt, false, lean, null);

    // Landing / crash — ignore while airGrace (just launched)
    if(car.airGrace <= 0){
    // Magnetize toward track when close
    if(height < 2.0 && height > -1.5 && lateral < TRACK_W * 0.85 && !(input.thrust && state.fuel>0) && !(car.loopDropT>0)){
      car.vel.addScaledVector(near.normal, Math.max(0, (RIDE + 0.25 - height) * 18 * dt));
    }
    if(height < RIDE + 0.45 && height > -2.0 && lateral < TRACK_W * 0.8 && !(car.loopDropT>0 && near.normal.y < 0.7)){
      const impact = Math.max(0, -car.vel.dot(near.normal));
      const angleOk = Math.abs(car.pitch) < 1.45 || height < RIDE + 0.3;
      if(angleOk && impact < 85){ // v7: kid-forgiving landings (wheels-down never crashes)
        car.grounded=true; car.lipLaunch=false;
        let landFr = near;
        car.segIndex = near.seg != null ? near.seg : 0;
        car.s = near.s;
        // Don't re-launch from the same lip — advance if we landed on a segment tip
        {
          const ls = state.framesData.segs[car.segIndex];
          if(ls && car.s >= ls.length - 2.5 && car.segIndex < state.framesData.segs.length - 1){

          }
        }
        car.speed = Math.max(8, car.vel.dot(landFr.tangent));
        car.vel.set(0,0,0);
        const landPitch = car.pitch;
        car.pitch=0; car.pitchVel=0; car.flipAcc=0;
        car.pos.copy(landFr.pos).addScaledVector(landFr.normal, RIDE);
        const perfectLand = Math.abs(landPitch) < 0.14 && car.airTime > 0.45 && impact < 60; // v14: flat wheels on touchdown = PERFECT (Trials-style), even from a big jump

        state.fovPunch = Math.min(1, state.fovPunch + (clean ? 0.62 : 0.42) + impact*0.012);
        if(clean){
          state.cleanLands++;
          state.landStreak = (state.landStreak||0) + 1; const stk = Math.min(4, state.landStreak);

            audio.perfect(); state.fovPunch = Math.min(1, state.fovPunch + 0.25);
          } else addScore((90 + Math.floor(car.airTime*70))*stk, stk>1 ? 'CLEAN! STREAK ×'+stk : 'CLEAN!', 'combo');
          state.bestStreak = Math.max(state.bestStreak||0, state.landStreak);

      }
    }
    } // end airGrace<=0 land checks
    // fell off world
    if(car.pos.y < -25){ failRun('Fell off'); return; }
  }

  // Pickups

    star.position.y = star.userData.base.y + Math.sin(performance.now()/300)*0.25;
    if(star.position.distanceTo(car.pos) < 2.2){

    }
  }
  { const gs = state.level._gold;

      if(gs.position.distanceToSquared(car.pos) < 3.0*3.0){
        gs.userData.taken=true; gs.visible=false; state.goldGot=true;
        state.fuel=Math.min(1, state.fuel+0.35); addScore(500, 'GOLD STAR!', 'combo'); audio.gold(); haptic(25);
        state.fovPunch=Math.min(1, state.fovPunch+0.3);
        for(let i=0;i<40;i++){ const a=Math.random()*Math.PI*2; spawnParticle(gs.position.x, gs.position.y, gs.position.z, Math.cos(a)*9, Math.sin(a)*9, (Math.random()-0.5)*4, 0.8, 1, 0.82, 0.25); }

    }
  }
  for(const sm of (state.level._smashMeshes||_EMPTY)){
    if(sm.userData.smashed) continue;

    if(sm.position.distanceTo(car.pos) < 1.35 + (sm.userData.r||0)*0.3){
      sm.userData.smashed=true; sm.visible=false;

      smashBurst(sm.position, sm.userData.type);
      const t=sm.userData.type;
      const pts = t==='crate'?120 : t==='cone'?140 : t==='tire'?200 : 180;
      const lab = t==='crate'?'SMASH!' : t==='cone'?'CRUNCH!' : t==='tire'?'BOOM!' : 'BOOM!';
      addScore(pts, lab, 'smash');
      audio.smash(); haptic(22);
      state.shake = Math.max(state.shake, 0.48);
      state.fovPunch = Math.min(1, state.fovPunch + 0.55);
    }
  }

  // Checkpoint rings
  for(const gate of (state.level._cpMeshes||_EMPTY)){
    if(gate.userData.taken) continue;
    gate.rotation.z += dt*1.2;
    if(gate.position.distanceTo(car.pos) < 3.4){
      gate.userData.taken=true;
      // Dim but leave a faint marker
      gate.traverse(o=>{ if(o.material){ o.material = o.material.clone(); o.material.opacity=0.25; o.material.emissiveIntensity=0.2; }});
      state.checkpointsGot++;
      state.lastCheckpoint = {
        s: gate.userData.s,
        segIndex: gate.userData.segIndex||0,
        fuelFloor: Math.max(0.45, state.fuel*0.85),
        levelIndex: state.levelIndex, coins: state.coins||0, gold: !!state.goldGot

      addScore(250, 'CHECKPOINT!', 'checkpoint');

      state.fovPunch = Math.min(1, state.fovPunch + 0.7);
      state.shake = Math.max(state.shake, 0.22);
    }
  }

  // Ground boost pads
  for(const pad of (state.level._boostMeshes||_EMPTY)){
    if(pad.userData.cool > 0){
      pad.userData.cool -= dt;
      pad.visible = pad.userData.cool <= 0;
      if(pad.userData.cool <= 0){
        pad.traverse(o=>{ if(o.material && o.material.emissiveIntensity!=null) o.material.emissiveIntensity=1.2; });
      }
      continue;
    }
    pad.children[0] && (pad.children[0].material.emissiveIntensity = 0.9 + Math.sin(performance.now()/180)*0.35);
    if(car.grounded && pad.position.distanceTo(car.pos) < 2.4){
      pad.userData.cool = 4.5; // brief deactivate
      pad.visible = false;
      state.boostsGot++;
      car.speed = Math.min(MAX_SPEED * 1.12, Math.max(car.speed, MAX_SPEED * 0.92) + 10);
      state.fovPunch = Math.min(1, state.fovPunch + 0.95);
      state.shake = Math.max(state.shake, 0.18);
      addScore(80, 'BOOST!', 'boost');
      audio.boost(); haptic(14);
      // speed-line juice burst
      for(let i=0;i<18;i++){
        spawnParticle(car.pos.x, car.pos.y+0.4, car.pos.z,
          (Math.random()-0.5)*4, Math.random()*2, (Math.random()-0.5)*4,
          0.25+Math.random()*0.3, 1, 0.85+Math.random()*0.15, 0.2);
      }
    }
  }

  // Mid-air route markers — bob + spin (non-lethal visual cues)
  for(const rm of (state.level._routeMeshes||_EMPTY)){
    const t = performance.now()/1000 + (rm.userData.phase||0);
    rm.position.y = rm.userData.base.y + Math.sin(t*2.2)*0.35;
    rm.rotation.y += dt*1.6;
  }

  // Kid-safe spectacle props — animate; soft bounce / score pop only
  for(const pr of (state.level._propMeshes||_EMPTY)){
    const ud = pr.userData;
    const t = performance.now()/1000 + (ud.phase||0);
    if(ud.type==='balloon'){
      pr.position.y = ud.base.y + Math.sin(t*1.6)*0.55;
      pr.position.x = ud.base.x + Math.sin(t*0.7)*0.25;
      pr.rotation.y += dt*ud.spinSpeed;
    } else if(ud.type==='billboard'){
      pr.rotation.y = Math.sin(t*ud.spinSpeed)*0.85;
      pr.position.copy(ud.base);
    } else {
      pr.rotation.x += dt*ud.spinSpeed;
      pr.rotation.z += dt*ud.spinSpeed*0.7;
      pr.position.y = ud.base.y + Math.sin(t*1.1)*0.2;
    }
    if(ud.cool > 0){ ud.cool -= dt; continue; }
    if(pr.position.distanceTo(car.pos) < (ud.bounceR||1.3)){
      ud.cool = 1.1;
      state.propsGot = (state.propsGot||0)+1;
      // Soft nudge — never fail
      if(!car.grounded){
        car.vel.y = Math.max(car.vel.y, 6);
        car.vel.add(new THREE.Vector3(
          (Math.random()-0.5)*4, 2, (Math.random()-0.5)*4
        ));
      } else {
        car.speed = Math.min(MAX_SPEED, car.speed + 3);
      }
      const lab = ud.type==='balloon' ? 'POP!' : (ud.type==='spinner' ? 'SPIN!' : 'BOUNCE!');
      addScore(ud.type==='balloon'?60:45, lab, 'pop');
      audio.softpop(); haptic(8);
      state.fovPunch = Math.min(1, state.fovPunch + 0.25);
      // confetti puff
      for(let i=0;i<12;i++){
        spawnParticle(pr.position.x, pr.position.y, pr.position.z,
          (Math.random()-0.5)*8, Math.random()*8, (Math.random()-0.5)*8,
          0.35, 1, 0.5+Math.random()*0.5, 0.75+Math.random()*0.25);
      }
    }
  }

  // Endless: near end → next chunk
  if(state.endless && car.grounded && car.s > state.framesData.length - 8){
    const n = state.chunks.length+1;
    state.chunks.push(1);
    addScore(500, 'ZONE +');
    const level = makeEndlessChunk(n);
    state.level = level; state.padsUsed = new Set(); state.padHits = 0;
    state.starsTotal += level.stars.length;
    const th = applyTheme(level.theme); audio.music(level.theme); // v13: endless zones switch tunes with the world
    state.framesData = buildFrames(level.segments);
    buildTrackMeshes(state.framesData, th);
    buildPickups(level, state.framesData);

  }

  state.shake = Math.max(0, state.shake - dt);
  updateHUD();
}

const _eb = new THREE.Vector3();
function emitThrust(fr){
  const back = _eb.copy(car.pos).addScaledVector(fr.tangent, -1.35).addScaledVector(fr.normal, 0.15);
  for(let i=0;i<12;i++){
    const side = (i/11 - 0.5) * 1.4;
    const spread = (Math.random()-0.5)*2.5;
    spawnParticle(
      back.x + fr.binormal.x*side, back.y + (Math.random()-0.5)*0.3, back.z + fr.binormal.z*side,
      -fr.tangent.x*(10+Math.random()*14)+spread,
      -fr.tangent.y*(10+Math.random()*14)+Math.random()*4,
      -fr.tangent.z*(10+Math.random()*14)+spread,
      0.3+Math.random()*0.35,
      0.55+Math.random()*0.45, 0.75+Math.random()*0.25, 1.0
    );
    if(i%3===0){
      spawnParticle(back.x, back.y, back.z,
        -fr.tangent.x*(6+Math.random()*8), -fr.tangent.y*(6+Math.random()*8)+2, -fr.tangent.z*(6+Math.random()*8),
        0.28, 1.0, 0.5+Math.random()*0.35, 0.12);
    }
  }
}
function smashBurst(pos, kind){
  const n = kind==='crate' ? 28 : kind==='tire' ? 40 : 36;
  let r=1,g=0.35,b=0.1;
  if(kind==='crate'){ r=0.9; g=0.7; b=0.3; }
  else if(kind==='cone'){ r=1.0; g=0.45; b=0.1; }
  else if(kind==='tire'){ r=0.25; g=0.25; b=0.28; }
  for(let i=0;i<n;i++){
    const speed = 8+Math.random()*18;
    const ang = Math.random()*Math.PI*2;
    const elev = Math.random()*Math.PI*0.5;
    spawnParticle(pos.x, pos.y+0.5, pos.z,
      Math.cos(ang)*Math.cos(elev)*speed,
      Math.sin(elev)*speed + 4,
      Math.sin(ang)*Math.cos(elev)*speed,
      0.4+Math.random()*0.45,
      r, g+Math.random()*0.15, b);
  }
}
function landBurst(pos){
  for(let i=0;i<18;i++){
    spawnParticle(pos.x, pos.y, pos.z,
      (Math.random()-0.5)*12, Math.random()*6, (Math.random()-0.5)*12,
      0.35, 0.9, 0.9, 1.0);
  }
}

/* Camera — cinematic third-person, always frames the Roadster */
// v8: smooth stable chase cam — basis from the TRACK (never car pitch), damped, frame-rate independent,
// zero allocations per frame, smooth shake (no per-frame random jitter = no flicker).
const _cv = { back:new THREE.Vector3(1,0,0).negate(), up:new THREE.Vector3(0,1,0), side:new THREE.Vector3(0,0,1),
  tb:new THREE.Vector3(), tu:new THREE.Vector3(), ts:new THREE.Vector3(), tp:new THREE.Vector3(), lt:new THREE.Vector3(),
  W:new THREE.Vector3(0,1,0), roll:0, fov:60, t:0, init:false };
function damp(rate, dt){ return 1 - Math.exp(-rate*dt); }
function updateCamera(dt){
  if(!state.framesData || state.mode!=='play' && state.mode!=='grade' && state.mode!=='fail' && state.mode!=='pause') return;
  if(dt<=0) return;
  // v9 SIDE CAMERA (research brief #1): fixed side view, damped follow + look-ahead, never rotates with the car
  const pos = carVisual.group.position; // interpolated render position
  const vx = car.grounded ? (car.vel && car.vel.x || car.speed) : car.vel.x;
  const ahead = Math.max(-6, Math.min(9, (Math.sign(car.speed||1)) * (3 + Math.abs(car.speed)*0.14)));
  let cineK = 0; // v10: set-piece camera swoop (pull back + rise + trail, eased in/out; still a fixed-up side camera)
  if(state.cine){ state.cine.t += dt; const u = state.cine.t/state.cine.dur; if(u>=1 || state.mode!=='play') state.cine=null; else { const k=Math.sin(Math.PI*u); cineK = k*k*(3-2*k); } }
  state.cineK = cineK;
  const dist = 21 + Math.min(7, Math.abs(car.speed) * 0.12) + (car.grounded ? 0 : 2.5) + 10*cineK;
  _cv.tp.set(pos.x + ahead*0.7 - 6*cineK, pos.y + 3.2 + 4.5*cineK, pos.z + dist);
  _cv.lt.set(pos.x + ahead, pos.y + 1.0 + 1.2*cineK, pos.z);
  if(!_cv.init){ camState.pos.copy(_cv.tp); camState.look.copy(_cv.lt); _cv.init=true; }
  camState.pos.x += (_cv.tp.x - camState.pos.x) * damp(7, dt);
  camState.pos.y += (_cv.tp.y - camState.pos.y) * damp(car.grounded?4.5:3, dt);
  camState.pos.z += (_cv.tp.z - camState.pos.z) * damp(2.5, dt);
  camState.look.x += (_cv.lt.x - camState.look.x) * damp(8, dt);
  camState.look.y += (_cv.lt.y - camState.look.y) * damp(car.grounded?5:3.5, dt);
  camState.look.z += (_cv.lt.z - camState.look.z) * damp(3, dt);
  if(state.finale && state.mode==='grade'){ // v16: finish orbit — eased half-swing round the car, slowly rising and closing in
    const F=state.finale, u=Math.min(1, F.t/F.dur), e=u*u*(3-2*u), a=F.a0 + e*0.95, r=F.r0 + (11-F.r0)*e;
    _cv.tp.set(F.px + Math.sin(a)*r, F.py + F.y0 + 2.5*e, F.pz + Math.cos(a)*r); _cv.lt.set(F.px, F.py + 1.2, F.pz);
    const k = damp(5, dt) * Math.min(1, F.t/0.5); camState.pos.lerp(_cv.tp, k); camState.look.lerp(_cv.lt, k); // ramp in so the swing never snaps
  }
  _cv.t += dt;
  const sh = Math.min(car.grounded?0.3:0.12, state.shake||0); // capped, smooth sine shake
  camera.position.copy(camState.pos);
  camera.position.x += Math.sin(_cv.t*31)*sh*0.5; camera.position.y += Math.sin(_cv.t*23+1.3)*sh*0.5;
  camera.up.set(0,1,0);
  camera.lookAt(camState.look);
  const fovT = 52 + Math.min(0.6, state.fovPunch) * 9 + Math.min(7, Math.abs(car.speed) * 0.1);
  _cv.fov += (fovT - _cv.fov) * damp(6, dt);
  if(Math.abs(camera.fov - _cv.fov) > 0.01){ camera.fov = _cv.fov; camera.updateProjectionMatrix(); }
  const op = Math.min(0.45, state.fovPunch * 0.4 + Math.abs(car.speed) / 140).toFixed(2);
  if(_cv.op !== op){ _cv.op = op; speedLinesEl.style.opacity = op; }
}
const speedLinesEl = document.getElementById('speedLines');

function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/Math.max(1,h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

/* Main loop */
let acc=0, last=performance.now();
const _prevPos = new THREE.Vector3(), _prevQuat = new THREE.Quaternion(), _titleT = new THREE.Vector3(); // v13: title cam reuses a temp
function frame(now){
  const raw=Math.min(0.05, (now-last)/1000); last=now;
  if(state.slowmo>0){ state.slowmo-=raw; if(state.slowmo<=0) state.slowmoScale=0.45; } const ts = state.slowmo>0 ? (state.slowmoScale||0.45) : 1;
  acc+=raw*ts;
  while(acc>=DT){ _prevPos.copy(car.pos); _prevQuat.copy(car.quat); physicsStep(DT); acc-=DT; }
  if(state.mode==='play'){ // v8: interpolate render between physics ticks (120Hz ProMotion judder fix)
    const a = acc/DT;
    if(_prevPos.distanceToSquared(car.pos) < 25){ carVisual.group.position.lerpVectors(_prevPos, car.pos, a); carVisual.group.quaternion.slerpQuaternions(_prevQuat, car.quat, a); }
    else { carVisual.group.position.copy(car.pos); carVisual.group.quaternion.copy(car.quat); }
  }
  audio.musicMode(state.mode); // v13: music volume follows the screen (quiet on pause, out on crash/finish)
  updateParticles(raw);
  updateCamera(raw);

  if(state.mode==='title' || state.mode==='select'){
    carVisual.group.rotation.y = Math.sin(now/2000)*0.15;
    // v13: removed unused per-frame sampleFrames() allocation
    camState.pos.lerp(_titleT.set(car.pos.x-10,car.pos.y+5,car.pos.z+12), 0.03);
    camState.look.lerp(_titleT.set(car.pos.x+4,car.pos.y+1,car.pos.z), 0.03);
    carVisual.group.position.copy(car.pos);
    camera.position.copy(camState.pos); camera.lookAt(camState.look);
  }
  // v10: sprung body (heave + pitch) on per-wheel hubs — replaces the v9 non-uniform mesh squash
  if(state.mode==='play' || state.mode==='pause' || state.mode==='grade' || state.mode==='fail'){
    const B=carVisual.body; B.position.y = SUSP.lift - (susp.cF+susp.cR)*0.5;
    // v12 GROUND LEAN (research top-10): holding lean on the ground visibly rocks the body (back = nose up, forward = nose down)
    const gl = (car.grounded && state.mode==='play') ? -effectiveLean()*0.075 : 0; state.gLean = (state.gLean||0) + (gl - (state.gLean||0))*damp(9, raw);
    B.rotation.z = (susp.cR - susp.cF)/SUSP.wb + state.gLean;
    for(const h of carVisual.hubs){ h.hub.position.y = h.baseY + (h.front ? susp.hF : susp.hR); h.hub.rotation.z = -susp.spin; }
  } else { carVisual.body.position.y = SUSP.lift - SUSP.sag; carVisual.body.rotation.z = 0; for(const h of carVisual.hubs){ h.hub.position.y=h.baseY; } }
  updateCoins(raw); if(state.mode==='play'){ updateFans(raw); updateTrain(raw); updateBridge(raw); updateGate(raw); updateLava(raw); } updateGhost();

  for(const n of carVisual.nozzles){
    n.material.emissiveIntensity = (input.thrust && state.fuel>0 && state.mode==='play') ? 1.2 : 0.25;
  }
  updateContactShadow(); updateSky(raw); updateFinale(raw);
  if(!document.hidden){ renderer.render(scene, camera); perfTick(now); } // v15: no GPU work while backgrounded
  requestAnimationFrame(frame);
}

/* v9 contact shadow: soft blob under the wheels, fades/shrinks with height */
const _shCv=document.createElement('canvas'); _shCv.width=_shCv.height=64;
{ const x=_shCv.getContext('2d'); const g=x.createRadialGradient(32,32,2,32,32,31); g.addColorStop(0,'rgba(0,0,0,0.75)'); g.addColorStop(0.6,'rgba(0,0,0,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); }
const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.6), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(_shCv), transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2}));
contactShadow.renderOrder=2; scene.add(contactShadow);
const _shM=new THREE.Matrix4(), _shV=new THREE.Vector3(), _shB=new THREE.Vector3(), _shF=makeFrame();
function updateContactShadow(){
  if(state.mode!=='play' && state.mode!=='pause' && state.mode!=='paused'){ contactShadow.visible=false; return; }
  const n = car.grounded ? sampleInto(state.framesData.segs[car.segIndex]||state.framesData.segs[0], car.s, _shF) : nearestFrame(car.pos);
  const h = _shV.copy(carVisual.group.position).sub(n.pos).dot(n.normal);
  if(h < -1 || h > 14){ contactShadow.visible=false; return; }
  contactShadow.visible=true;
  _shM.makeBasis(n.tangent, _shB.copy(n.binormal).negate(), n.normal); contactShadow.quaternion.setFromRotationMatrix(_shM);
  contactShadow.position.copy(n.pos).addScaledVector(n.normal, 0.03);

/* v9 perf: adaptive resolution + ?fps=1 overlay */
const FPS_ON = /[?&]fps=1/.test(location.search);
let fpsEl=null; if(FPS_ON){ fpsEl=document.createElement('div'); fpsEl.style.cssText='position:fixed;left:6px;top:6px;z-index:99;font:12px monospace;color:#0f0;background:rgba(0,0,0,.6);padding:3px 6px;pointer-events:none;white-space:pre'; document.body.appendChild(fpsEl); }
let _pfT=0, _pfN=0, _pfLast=0, _pfSlow=0, _pfLiteSlow=0, _pfHitch=0, _pfWorst=0;
/* v15 LITE TIER: if the device is still slow at DPR 1, pull in the far plane + fog and halve particle spawns.

function setLite(on){ if(LITE.on===on) return; LITE.on=on; LITE.fogK = on?0.7:1; LITE.pK = on?0.5:1;
  camera.far = on?300:600; camera.updateProjectionMatrix();
  if(scene.fog && state.fogBase){ scene.fog.near=state.fogBase[0]*LITE.fogK; scene.fog.far=state.fogBase[1]*LITE.fogK; } }
if(/[?&]lite=1/.test(location.search)) setLite(true);
function perfTick(now){
  if(!_pfLast){ _pfLast=now; return; }
  const fd=now-_pfLast; _pfN++; _pfT += fd; _pfLast=now;
  if(fd>34 && fd<500 && state.mode==='play') _pfHitch++; if(fd<500 && fd>_pfWorst) _pfWorst=fd; // v15: hitch counter (>2 frames) for ?fps=1
  if(_pfT >= 1000){
    const ms=_pfT/_pfN, fps=1000/ms;
    if(fps < 52 && dprNow > 1){ if(++_pfSlow>=2){ dprNow=Math.max(1, dprNow-0.25); renderer.setPixelRatio(dprNow); onResize(); _pfSlow=0; } }
    else if(fps > 58.5 && dprNow < DPR_MAX){ dprNow=Math.min(DPR_MAX, dprNow+0.125); renderer.setPixelRatio(dprNow); onResize(); _pfSlow=0; }
    else _pfSlow=0;
    if(dprNow<=1 && fps<45 && state.mode==='play'){ if(++_pfLiteSlow>=3){ setLite(true); _pfLiteSlow=0; } } else _pfLiteSlow=0; // v15
    if(fpsEl) fpsEl.textContent = fps.toFixed(0)+' fps  '+ms.toFixed(1)+' ms\ndpr '+dprNow.toFixed(2)+'  lite '+(LITE.on?'on':'off')+'\nhitches '+_pfHitch+'  worst '+_pfWorst.toFixed(0)+' ms  calls '+renderer.info.render.calls+'  tris '+renderer.info.render.triangles;

/* v15: auto-pause when the app is backgrounded (home button, notification, lock) so kids never come back to a crash */
function autoPause(){ if(state.mode==='play'){ togglePause(); state.autoPaused=(state.autoPaused||0)+1; } _pfLast=0; }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) autoPause(); });
window.addEventListener('pagehide', autoPause); window.addEventListener('blur', ()=>{ if(document.hidden) autoPause(); });
/* Boot */
['touchstart','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>audio.gesture(), {once:false, passive:true});
});
syncMusicUI(); showTitle();
requestAnimationFrame(frame);

// Expose for smoke tests
window.__RSP = {
  version:16, audio,
  finale:()=>({active:!!state.finale, t:state.finale?+state.finale.t.toFixed(2):0, bursts:state.finale?state.finale.bursts:0, count:state.finaleCount||0, cardShown:!document.getElementById('overlay').classList.contains('hidden')}),
  sky:()=>{ const U=skyMat.uniforms; return {top:U.top.value.getHexString(), hor:U.hor.value.getHexString(), fog:scene.fog?scene.fog.color.getHexString():null, clouds:clouds.count, cloudVis:clouds.visible, domeAtCam:skyDome.position.distanceTo(camera.position)<0.01}; }, failRun, _sample:sampleSegment, _renderer:renderer, _scene:scene,
  bridge:()=>{ const b=state.level&&state.level._bridge; return b?{n:b.planks.length, x0:+b.x0.toFixed(1), x1:+b.x1.toFixed(1), fallen:b.fallen, cleared:b.cleared, runs:state.bridgeRuns||0}:null; },
  gLean:()=>+(state.gLean||0).toFixed(3),
  gate:()=>{ const G=state.level&&state.level._gate; return G?{bx:+G.bx.toFixed(1), gx:+G.gx.toFixed(1), pressed:G.pressed, bonus:G.bonus, open:+G.open.toFixed(2), opened:G.opened, n:state.gatesOpened||0}:null; },
  lava:()=>{ const L=state.level&&state.level._lava; return L?{n:L.blobs.length, launched:state.blobsLaunched||0, bonks:state.bonks||0}:null; },
  landing:()=>({clean:state.cleanLands||0, perfect:state.perfectLands||0, streak:state.landStreak||0, best:state.bestStreak||0}),
  fans:()=>({n:(state.level&&state.level._fans||[]).length, hits:state.fanHits||0, peak:+(state.fanPeak||0).toFixed(2)}),
  train:()=>{ const t=state.level&&state.level._train; return t?{on:true, x:+t.x.toFixed(1), dx:+(t.x-car.pos.x).toFixed(1), speed:+t.speed.toFixed(1), honked:t.honked, alongside:+t.alongside.toFixed(2)}:{on:false}; },
  ghost:()=>({rec:ghost.rec?ghost.rec.length/7:0, recValid:ghost.recValid, has:!!ghost.play, bestT:ghost.bestT, t:+ghost.t.toFixed(2), visible:ghostMesh.visible, newBest:ghost.newBest, dx:ghostMesh.visible?+(ghostMesh.position.x-car.pos.x).toFixed(2):null}), susp:()=>({cF:susp.cF, cR:susp.cR, vF:susp.vF, vR:susp.vR, hF:susp.hF, hR:susp.hR, loadF:susp.loadF, loadR:susp.loadR, peak:susp.peak, kicks:susp.kicks, bodyY:carVisual.body.position.y, bodyPitch:carVisual.body.rotation.z, scale:carVisual.group.scale.toArray()}),
  wheelGaps:()=>{ if(!car.grounded) return null; const seg=state.framesData.segs[car.segIndex]; const sc=carVisual.baseScale||0.85; const out={};
    for(const h of carVisual.hubs){ if(h.hub.position.z<0) continue; const w=new THREE.Vector3(h.hub.position.x, h.baseY+(h.front?susp.hF:susp.hR), 0).multiplyScalar(sc).applyQuaternion(car.quat).add(car.pos);
      const upv=new THREE.Vector3(0,1,0).applyQuaternion(car.quat); w.addScaledVector(upv, -SUSP.wheelR*sc);
      const f=sampleSegment(seg, car.s + (h.front?SUSP.axF:-SUSP.axR)); out[h.front?'front':'rear']=w.sub(f.pos).dot(f.normal); }
    return out; },
  coins:()=>{ const c=state.level&&state.level._coins; return {got:state.coins||0, n:c?c.n:0, gold:!!state.goldGot, hasGold:!!(state.level&&state.level.gold), goldPos:state.level&&state.level._gold?state.level._gold.userData.base.toArray():null}; },
  axes:()=>{ const q=car.quat; const ax=v=>new THREE.Vector3(...v).applyQuaternion(q).toArray().map(x=>+x.toFixed(3)); const seg=state.framesData.segs[car.segIndex]; const f=sampleSegment(seg,car.s); const sF=sampleSegment(seg,car.s+SUSP.axF), sR=sampleSegment(seg,car.s-SUSP.axR); return {x:ax([1,0,0]), y:ax([0,1,0]), z:ax([0,0,1]), t:f.tangent.toArray().map(x=>+x.toFixed(3)), n:f.normal.toArray().map(x=>+x.toFixed(3)), b:f.binormal.toArray().map(x=>+x.toFixed(3)), chord:sF.pos.clone().sub(sR.pos).normalize().toArray().map(x=>+x.toFixed(3)), dF:+sF.pos.distanceTo(f.pos).toFixed(3)}; },
  cine:()=>({active:!!state.cine, k:state.cineK||0, count:state.cineCount||0, slowmo:state.slowmo||0, scale:state.slowmoScale}),
  engine:()=>audio.engineLevel(), particles:()=>({pool:particles.length, live:particles.reduce((a,p)=>a+(p.life>0?1:0),0)}), screen:()=>{const v=carVisual.group.position.clone().project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight};}, pads:()=>({hits:state.padHits||0, n:(state.level&&state.level.bouncePads||[]).length}), loops:()=>state.framesData.segs.map(sg=>{const r=[];let inL=false,st=0;const N=Math.ceil(sg.length);for(let i=0;i<=N;i++){const f=sampleSegment(sg,Math.min(sg.length,i));if(f.normal.y<-0.5&&!inL){inL=true;st=i;} if(f.normal.y>-0.5&&inL){inL=false;r.push([st,i]);}}return r;}), perf:()=>({calls:renderer.info.render.calls, tris:renderer.info.render.triangles, dpr:dprNow, lite:LITE.on, far:camera.far, hitches:_pfHitch, worstMs:+_pfWorst.toFixed(1)}), setLite, autoPause, light:()=>({sun:sun.intensity, amb:amb.intensity, hemi:hemi.intensity, fogNear:scene.fog.near, fogFar:scene.fog.far}), levels:LEVELS.length, startLevel, showTitle, showSelect, state, car,
  getScore:()=>state.score, getMode:()=>state.mode, getStars:()=>state.starGrade, input,
  cam:()=>({x:camera.position.x,y:camera.position.y,z:camera.position.z,qx:camera.quaternion.x,qy:camera.quaternion.y,qz:camera.quaternion.z,qw:camera.quaternion.w}),
  lips:()=>state.framesData.segs.map((sg,i,all)=>(sg.lips||[]).concat(i<all.length-1?[sg.length-0.3]:[])),
  probe:()=>{ const n=nearestFrame(car.pos); const rf=car.grounded?sampleSegment(state.framesData.segs[car.segIndex]||state.framesData.segs[0], car.s):null; return {gapRail: rf? car.pos.clone().sub(rf.pos).dot(rf.normal)-0.034 : null, g:car.grounded, seg:car.segIndex, s:car.s, x:car.pos.x, y:car.pos.y,
     h:car.pos.clone().sub(n.pos).dot(n.normal)-RIDE, gap:car.pos.clone().sub(n.pos).dot(n.normal)-0.034, rocket:!!(input.thrust&&state.fuel>0), fuel:state.fuel, calls:renderer.info.render.calls, tris:renderer.info.render.triangles, nx:n.pos.x, ny:n.pos.y, nny:n.normal.y, lip:!!car.lipLaunch, mode:state.mode, why:state.failReason, dbg:state.failDbg, jumps:state.jumps||0, speed:car.speed}; }
};
