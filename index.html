<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>

<title>Roadster Stunt Paradise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1020;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#game{display:block;width:100%;height:100%;background:#0a1020}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#0a1020;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#rotate .icon{font-size:64px;animation:spin 2s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#rotate p{font-size:20px;opacity:.9;max-width:320px}
@media (orientation:portrait){
  #wrap{display:none}
  #rotate{display:flex}
}
.hud{position:fixed;pointer-events:none;z-index:10;padding:env(safe-area-inset-top,8px) env(safe-area-inset-right,12px) env(safe-area-inset-bottom,8px) env(safe-area-inset-left,12px)}
#hudTop{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hudTop .panel{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:8px 14px;font-weight:700;font-size:clamp(14px,2.8vw,22px);border:1px solid rgba(255,255,255,.12)}
#fuelWrap{position:fixed;top:calc(env(safe-area-inset-top,8px) + 52px);left:50%;transform:translateX(-50%);width:min(280px,50vw);z-index:10;pointer-events:none}
#fuelBar{height:12px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);overflow:hidden}
#fuelFill{height:100%;width:100%;background:linear-gradient(90deg,#4af,#8ff);border-radius:8px;transition:width .05s linear}
#fuelLabel{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.8;margin-top:2px}
#pauseBtn{pointer-events:auto;width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer}
#controls{position:fixed;left:0;right:0;bottom:0;top:0;z-index:5;pointer-events:none}
.zone{position:absolute;pointer-events:auto;opacity:0}
/* zones sized in mobile block below */
#btnThrust{pointer-events:auto;position:absolute;right:calc(env(safe-area-inset-right,12px) + 14px);bottom:calc(env(safe-area-inset-bottom,12px) + 14px);width:112px;height:112px;border-radius:50%;border:4px solid rgba(140,220,255,.95);background:radial-gradient(circle at 35% 28%,#9df,#3a7ad0 55%,#0a2858);box-shadow:0 0 32px rgba(80,190,255,.65),inset 0 0 20px rgba(255,255,255,.3);color:#fff;font-weight:900;font-size:14px;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;z-index:6}
#btnThrust:active,#btnThrust.on{transform:scale(.92);box-shadow:0 0 48px rgba(140,230,255,1),0 0 80px rgba(255,140,40,.45),inset 0 0 24px rgba(255,255,255,.5);border-color:#fff}
#hintLean,#hintGas{position:absolute;bottom:calc(env(safe-area-inset-bottom,12px) + 28px);pointer-events:none;opacity:.4;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#hintLean{left:calc(env(safe-area-inset-left,12px) + 16px)}
#hintGas{right:calc(env(safe-area-inset-right,12px) + 140px)}
#leanMeter{position:absolute;left:calc(env(safe-area-inset-left,12px) + 10px);top:28%;width:10px;height:44%;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);pointer-events:none;overflow:hidden;z-index:6}
#leanFill{position:absolute;left:0;width:100%;height:50%;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,#6cf,#fff 45%,#f86);border-radius:6px;opacity:.25;transition:top .05s linear,height .05s linear,opacity .1s}
#leanFill.active{opacity:.95;box-shadow:0 0 12px rgba(120,200,255,.8)}
#tiltToggle{pointer-events:auto;position:absolute;left:calc(env(safe-area-inset-left,12px) + 8px);top:calc(env(safe-area-inset-top,8px) + 58px);z-index:11;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:8px 10px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tiltToggle.on{background:rgba(40,120,200,.55);border-color:rgba(140,220,255,.7)}
#zoneLean{left:0;top:18%;width:34%;height:64%}
#zoneGas{right:0;top:18%;width:30%;height:64%}
.popup.flip{color:#ffd76a;font-size:clamp(28px,6vw,48px);text-shadow:0 0 24px rgba(255,200,60,.9),0 2px 12px rgba(0,0,0,.8)}
.popup.combo{color:#9cf;font-size:clamp(24px,5vw,40px)}
#combo.punch{animation:comboPunch .35s ease-out}
@keyframes comboPunch{0%{transform:translateX(-50%) scale(.7);opacity:.4}40%{transform:translateX(-50%) scale(1.25);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.gradeHero{font-size:clamp(56px,12vw,96px);font-weight:900;line-height:1;margin:8px 0 4px;background:linear-gradient(180deg,#fff,#ffd76a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px rgba(255,180,40,.45))}
.oneMore{font-size:clamp(15px,2.8vw,20px);font-weight:800;color:#9cf;margin-top:4px;letter-spacing:.04em}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,8,20,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:env(safe-area-inset-top,16px) env(safe-area-inset-right,16px) env(safe-area-inset-bottom,16px) env(safe-area-inset-left,16px)}
#overlay.hidden{display:none}
.card{background:linear-gradient(160deg,rgba(20,30,55,.95),rgba(10,16,32,.98));border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:28px 24px;max-width:min(640px,94vw);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:clamp(26px,5vw,42px);margin-bottom:6px;background:linear-gradient(90deg,#fff,#9cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{opacity:.75;margin-bottom:20px;font-size:clamp(13px,2.2vw,16px)}
.btnRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
button.menu{pointer-events:auto;border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#4af,#2870d0);color:#fff;box-shadow:0 6px 0 #164a90,0 10px 24px rgba(40,120,255,.35);min-width:140px}
button.menu:active{transform:translateY(3px);box-shadow:0 3px 0 #164a90}
button.menu.secondary{background:linear-gradient(180deg,#3a4560,#222a40);box-shadow:0 6px 0 #111620,0 10px 24px rgba(0,0,0,.3)}
button.menu.gold{background:linear-gradient(180deg,#ffd76a,#e09020);color:#1a1000;box-shadow:0 6px 0 #a06010,0 10px 24px rgba(255,180,40,.35)}
#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:16px 0;max-width:420px;margin-left:auto;margin-right:auto}
.lvlBtn{aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lvlBtn small{font-size:10px;opacity:.7;font-weight:600}
.lvlBtn:disabled{opacity:.35}
.popup{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;font-weight:900;font-size:clamp(22px,5vw,40px);text-shadow:0 2px 12px rgba(0,0,0,.8);animation:pop .9s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,8px) + 78px);transform:translateX(-50%);z-index:12;pointer-events:none;font-weight:900;font-size:clamp(18px,4vw,28px);color:#ffd76a;text-shadow:0 2px 10px rgba(0,0,0,.7);opacity:0;transition:opacity .15s}
</style>
</head>
<body>
<div id="rotate"><div class="icon">📱</div><p>Turn your device sideways to play Roadster Stunt Paradise</p></div>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="hudTop" class="hud" style="display:none">
  <div class="panel" id="scorePanel">0</div>
  <div class="panel" id="multPanel">×1</div>
  <div class="panel" id="gradePanel">—</div>
  <button id="pauseBtn" aria-label="Pause">⏸</button>
</div>
<div id="fuelWrap" style="display:none"><div id="fuelBar"><div id="fuelFill"></div></div><div id="fuelLabel">THRUSTER FUEL</div></div>
<div id="combo">COMBO ×2</div>
<button id="tiltToggle" type="button" style="display:none" aria-pressed="false">TILT OFF</button>
<div id="controls" style="display:none">
  <div id="zoneLean" class="zone"></div>
  <div id="zoneGas" class="zone"></div>
  <div id="leanMeter"><div id="leanFill"></div></div>
  <button id="btnThrust" type="button">THRUST<br>🔥</button>
  <div id="hintLean">LEAN</div>
  <div id="hintGas">GAS</div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(function(){
'use strict';

/* ========== Storage ========== */
var STORE_KEY = 'rsp.v2.scores';
function loadScores(){
  try{
    var r = localStorage.getItem(STORE_KEY);
    return r ? JSON.parse(r) : {levels:{}, endless:0};
  }catch(e){ return {levels:{}, endless:0}; }
}
function saveScores(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}
var scores = loadScores();

/* ========== AudioBoot (iOS-safe) ========== */
var audio = (function(){
  var ctx=null, primed=false, gestured=false, resumeP=null, pending=[], master=null, muted=false;
  function AC(){ return window.AudioContext || window.webkitAudioContext; }
  function build(){
    if(ctx) return;
    var C = AC(); if(!C) return;
    ctx = new C();
    master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
  }
  function silentUnlock(){
    if(!ctx) return;
    try{
      var b = ctx.createBuffer(1, 1, 22050);
      var s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    }catch(e){}
  }
  function resume(){
    if(!ctx) return Promise.resolve(false);
    if(ctx.state === 'running') return Promise.resolve(true);
    if(resumeP) return resumeP;
    var p;
    try{ p = ctx.resume(); }catch(e){ return Promise.resolve(false); }
    resumeP = Promise.resolve(p).then(function(){
      resumeP = null;
      if(ctx.state === 'running'){ flush(); return true; }
      return false;
    }).catch(function(){ resumeP=null; return false; });
    return resumeP;
  }
  function flush(){
    while(pending.length){
      var fn = pending.shift();
      try{ fn(); }catch(e){}
    }
  }
  function gesture(){
    gestured = true;
    build();
    silentUnlock();
    return resume().then(function(ok){ if(ok) flush(); return ok; });
  }
  function beep(fn){
    if(muted) return;
    if(!gestured){ pending.push(fn); if(pending.length>8) pending.shift(); return; }
    build();
    if(!ctx || ctx.state !== 'running'){ pending.push(fn); resume(); return; }
    try{ fn(); }catch(e){}
  }
  function tone(freq, dur, type, vol, slide){
    beep(function(){
      var t = ctx.currentTime;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t+dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+dur+0.02);
    });
  }
  function noise(dur, vol){
    beep(function(){
      var n = Math.max(1, Math.floor(ctx.sampleRate * dur));
      var buf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
      var s = ctx.createBufferSource(); s.buffer = buf;
      var g = ctx.createGain(); g.gain.value = vol||0.15;
      var f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
      s.connect(f); f.connect(g); g.connect(master);
      s.start();
    });
  }
  return {
    gesture: gesture,
    ui: function(){ tone(700, 0.07, 'square', 0.16); },
    star: function(){ tone(988, 0.09, 'sine', 0.26); setTimeout(function(){ tone(1480, 0.12, 'sine', 0.2); }, 45); setTimeout(function(){ tone(1760, 0.1, 'triangle', 0.12); }, 90); },
    thrust: function(){ tone(70, 0.16, 'sawtooth', 0.14, 180); noise(0.12, 0.12); tone(140, 0.08, 'square', 0.06, 90); },
    land: function(){ noise(0.14, 0.28); tone(100, 0.14, 'triangle', 0.2, 45); tone(220, 0.06, 'sine', 0.1); },
    crash: function(){ noise(0.35, 0.4); tone(70, 0.4, 'sawtooth', 0.22, 30); tone(45, 0.25, 'square', 0.12); },
    flip: function(){ tone(560, 0.08, 'square', 0.16); tone(840, 0.1, 'square', 0.14); setTimeout(function(){ tone(1120, 0.08, 'sine', 0.1); }, 50); },
    win: function(){ tone(523,0.14,'sine',0.22); setTimeout(function(){tone(659,0.14,'sine',0.22);},110); setTimeout(function(){tone(784,0.16,'sine',0.24);},220); setTimeout(function(){tone(1046,0.28,'triangle',0.2);},360); },
    engine: function(on){ /* lightweight tick handled in loop via thrust/land */ },
    setMuted: function(m){ muted=!!m; }
  };
})();

function haptic(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms||12); }catch(e){}
}

/* ========== Canvas / resize ========== */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d', {alpha:false, desynchronized:true});
var W=1280, H=720, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 100); });
resize();

/* ========== Input ========== */
var input = { lean:0, gas:false, thrust:false, tiltLean:0, tiltOk:false };
var zoneLean = document.getElementById('zoneLean');
var zoneGas = document.getElementById('zoneGas');
var btnThrust = document.getElementById('btnThrust');

function bindHold(el, on, off){
  function start(e){ e.preventDefault(); audio.gesture(); on(e); }
  function end(e){ e.preventDefault(); off(e); }
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', end, {passive:false});
  el.addEventListener('touchcancel', end, {passive:false});
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
function setLeanFromEvent(e){
  var r = zoneLean.getBoundingClientRect();
  var y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  var raw = (y / r.height) * 2 - 1; // top=-1 (nose up), bottom=+1
  // deadzone + ease for snappier thumb feel
  if(Math.abs(raw) < 0.08) raw = 0;
  else raw = Math.sign(raw) * Math.min(1, Math.pow(Math.abs(raw), 0.85) * 1.08);
  input.lean = Math.max(-1, Math.min(1, raw));
  updateLeanMeter();
}
function updateLeanMeter(){
  var fill = document.getElementById('leanFill');
  if(!fill) return;
  var L = input.lean;
  if(input.tiltEnabled && Math.abs(input.tiltLean) > Math.abs(L)) L = input.tiltLean;
  var mag = Math.abs(L);
  fill.classList.toggle('active', mag > 0.05);
  // center at 50%; nose-up (neg) moves fill up
  var h = 18 + mag * 42;
  fill.style.height = h + '%';
  fill.style.top = (50 + L * 38) + '%';
}
bindHold(zoneLean, function(e){ setLeanFromEvent(e); }, function(){ input.lean = 0; updateLeanMeter(); });
zoneLean.addEventListener('touchmove', function(e){
  e.preventDefault();
  setLeanFromEvent(e);
}, {passive:false});
zoneLean.addEventListener('mousemove', function(e){
  if(e.buttons) setLeanFromEvent(e);
});
bindHold(zoneGas, function(){ input.gas=true; }, function(){ input.gas=false; });
bindHold(btnThrust, function(){ input.thrust=true; btnThrust.classList.add('on'); audio.thrust(); haptic(8); }, function(){ input.thrust=false; btnThrust.classList.remove('on'); });

window.addEventListener('keydown', function(e){
  audio.gesture();
  if(e.code==='ArrowLeft'||e.code==='KeyA') input.lean=-0.85;
  if(e.code==='ArrowRight'||e.code==='KeyD') input.lean=0.85;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){ input.gas=true; e.preventDefault(); }
  if(e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ if(!input.thrust){ audio.thrust(); haptic(8);} input.thrust=true; btnThrust.classList.add('on'); }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state.mode==='play') togglePause(); }
});
window.addEventListener('keyup', function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowRight'||e.code==='KeyD') input.lean=0;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.gas=false;
  if(e.code==='KeyJ'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ input.thrust=false; btnThrust.classList.remove('on'); }
});

/* DeviceOrientation tilt (optional, user toggle) */
input.tiltEnabled = false;
var tiltListening = false;
function onTilt(ev){
  if(!input.tiltEnabled) return;
  var g = ev.gamma, b = ev.beta;
  if(g==null && b==null) return;
  // Landscape: beta often rolls nose; gamma fallback
  var landscape = Math.abs(window.orientation||0) === 90 || window.innerWidth > window.innerHeight;
  var v = landscape ? (typeof b === 'number' ? b : g) : (typeof g === 'number' ? g : b);
  input.tiltLean = Math.max(-1, Math.min(1, (v || 0) / 26));
  input.tiltOk = true;
  updateLeanMeter();
}
function ensureTiltListener(){
  if(tiltListening) return;
  tiltListening = true;
  window.addEventListener('deviceorientation', onTilt, true);
}
function askTilt(){
  // kept for API compat — no longer auto-enables; user uses TILT toggle
  ensureTiltListener();
}
function setTiltEnabled(on){
  input.tiltEnabled = !!on;
  var btn = document.getElementById('tiltToggle');
  if(btn){
    btn.classList.toggle('on', input.tiltEnabled);
    btn.setAttribute('aria-pressed', input.tiltEnabled ? 'true' : 'false');
    btn.textContent = input.tiltEnabled ? 'TILT ON' : 'TILT OFF';
  }
  if(input.tiltEnabled){
    ensureTiltListener();
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(st){
        if(st!=='granted'){ setTiltEnabled(false); }
      }).catch(function(){ setTiltEnabled(false); });
    }
  } else {
    input.tiltLean = 0; input.tiltOk = false; updateLeanMeter();
  }
}
document.getElementById('tiltToggle').addEventListener('click', function(){
  audio.gesture(); audio.ui();
  setTiltEnabled(!input.tiltEnabled);
});

/* ========== Levels ========== */
/* Terrain: array of {x,y} world points. Stars: {x,y}. Hazards: {x,y,w,h}. Finish: x. Loops: {cx,cy,r,start,end} */
function L(name, pts, stars, hazards, finish, tip, theme){
  return {name:name, pts:pts, stars:stars||[], hazards:hazards||[], finish:finish, tip:tip||'', theme:theme||null};
}
var THEMES = {
  sunny:  {sky:['#1a3a7a','#3a7ab8','#7ec8e8','#c8e8a0'], hill1:'rgba(40,90,60,0.35)', hill2:'rgba(60,120,70,0.4)', dirt:['#5a3a22','#2a1810'], grass:'#6dce4a', grassHi:'#8ef06a'},
  dusk:   {sky:['#2a1848','#6a3a7a','#e09060','#f0c090'], hill1:'rgba(80,40,70,0.4)', hill2:'rgba(100,50,40,0.45)', dirt:['#4a3020','#241810'], grass:'#c8a040', grassHi:'#e8c060'},

var LEVEL_THEMES = ['sunny','dusk','candy','ice','night','volcano','desert','paradise','dusk','paradise'];
function themeFor(){
  if(state.endless){
    var idx = Math.max(0, state.chunks.length-1) % 8;
    var keys = Object.keys(THEMES);
    return THEMES[keys[idx]] || THEMES.sunny;
  }
  var Lvl = LEVELS[state.levelIndex];
  var key = (Lvl && Lvl.theme) || LEVEL_THEMES[state.levelIndex] || 'sunny';
  return THEMES[key] || THEMES.sunny;
}
function ramp(x0,y0,len,rise){
  var a=[];
  for(var i=0;i<=8;i++){
    var t=i/8;
    a.push({x:x0+len*t, y:y0 - rise*(t*t)});
  }
  return a;
}
function flat(x0,y0,len,n){
  n=n||4; var a=[];
  for(var i=0;i<=n;i++) a.push({x:x0+len*(i/n), y:y0});
  return a;
}
function down(x0,y0,len,drop){
  var a=[];
  for(var i=0;i<=8;i++){
    var t=i/8;
    a.push({x:x0+len*t, y:y0 + drop*t*t});
  }
  return a;
}
function hump(x0,y0,len,h){
  var a=[];
  for(var i=0;i<=12;i++){
    var t=i/12;
    a.push({x:x0+len*t, y:y0 - Math.sin(t*Math.PI)*h});
  }
  return a;
}
function join(){
  var out=[], args=arguments;
  for(var i=0;i<args.length;i++){
    var seg=args[i];
    for(var j=0;j<seg.length;j++){
      if(out.length && j===0) continue; // skip duplicate join point
      out.push(seg[j]);
    }
  }
  return out;
}

/* ========== Endless chunk generator ========== */
function genEndlessChunk(seed, startX, baseY){
  var rng = mulberry32(seed);
  var pts = [{x:startX, y:baseY}];
  var x = startX, y = baseY;
  var stars=[], hazards=[];
  var pieces = 6 + Math.floor(rng()*4);
  for(var i=0;i<pieces;i++){
    var kind = rng();
    var len = 180 + rng()*220;
    if(kind < 0.25){
      // flat
      pts.push({x:x+len, y:y});
      if(rng()>0.5) stars.push({x:x+len*0.5, y:y-40});
    } else if(kind < 0.55){
      // ramp up then down
      var rise = 80 + rng()*140;
      var half = len*0.55;
      for(var k=1;k<=6;k++){ var t=k/6; pts.push({x:x+half*t, y:y - rise*t*t}); }
      var top = y - rise;
      for(var k=1;k<=6;k++){ var t=k/6; pts.push({x:x+half+half*0.8*t, y:top + rise*t*t}); }
      y = y; // back roughly
      // fix last
      pts[pts.length-1].y = y;
      stars.push({x:x+half, y:top-50});
      x += half + half*0.8; continue;
    } else if(kind < 0.75){
      // hump
      var h = 60 + rng()*100;
      for(var k=1;k<=10;k++){ var t=k/10; pts.push({x:x+len*t, y:y - Math.sin(t*Math.PI)*h}); }
      stars.push({x:x+len*0.5, y:y-h-40});
    } else {
      // gap-ish: ramp then flat higher later
      var rise = 100 + rng()*100;
      for(var k=1;k<=7;k++){ var t=k/7; pts.push({x:x+len*0.5*t, y:y - rise*t}); }
      var gap = 180 + rng()*160;
      x += len*0.5 + gap;
      var ny = y - rise*0.3 + rng()*40;
      pts.push({x:x, y:ny});
      y = ny;
      stars.push({x:x - gap*0.5, y:ny - 80});
      if(rng()>0.6) hazards.push({x:x-40, y:ny-40, w:32, h:32});
      continue;
    }
    x += len;
    y = pts[pts.length-1].y;
    if(rng()>0.7) hazards.push({x:x-60, y:y-36, w:28, h:28});
  }
  // ensure descending toward a safe floor
  if(y < 300){
    pts.push({x:x+200, y:400});
    x+=200; y=400;
  }
  pts.push({x:x+100, y:y});
  return {pts:pts, stars:stars, hazards:hazards, endX:x+100};
}
function mulberry32(a){ return function(){ var t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

/* ========== Car / physics ========== */
var CAR_W=56, CAR_H=22;
function makeCar(x,y){
  return {
    x:x, y:y, vx:0, vy:0, angle:0, av:0,
    grounded:false, fuel:1, airTime:0, flips:0, flipAcc:0,
    alive:true, finished:false, wheel:0, speed:0
  };
}

function segAt(pts, x){
  // find segment containing x (defensive for short/unsorted polys)
  if(!pts || pts.length === 0) return {i:0, t:0, a:{x:0,y:400}, b:{x:1,y:400}};
  if(pts.length === 1) return {i:0, t:0, a:pts[0], b:pts[0]};
  if(x <= pts[0].x) return {i:0, t:0, a:pts[0], b:pts[1]};
  for(var i=0;i<pts.length-1;i++){
    var x0 = pts[i].x, x1 = pts[i+1].x;
    if(x >= x0 && x <= x1){
      var span = (x1 - x0) || 1;
      return {i:i, t:(x-x0)/span, a:pts[i], b:pts[i+1]};
    }
    // tolerate tiny backward segments
    if(x >= x1 && x <= x0){
      var span2 = (x0 - x1) || 1;
      return {i:i, t:(x-x1)/span2, a:pts[i+1], b:pts[i]};
    }
  }
  var last=pts.length-2;
  return {i:last, t:1, a:pts[last], b:pts[last+1]};
}
function heightAt(pts, x){
  var s = segAt(pts, x);
  return s.a.y + (s.b.y - s.a.y) * s.t;
}
function slopeAt(pts, x){
  var s = segAt(pts, x);
  var dx = s.b.x - s.a.x || 1;
  var dy = s.b.y - s.a.y;
  return Math.atan2(dy, dx);
}

function startEndless(){
  state.endless = true;
  state.levelIndex = -1;
  state.endlessSeed = (Date.now() & 0xffff) ^ 0x52535031;
  var chunk = genEndlessChunk(state.endlessSeed, 0, 400);
  state.terrain = chunk.pts;
  state.stars = chunk.stars.map(function(s){ return {x:s.x,y:s.y,got:false}; });
  state.hazards = chunk.hazards.slice();
  state.finish = 1e12;
  state.chunks = [{endX: chunk.endX, seed: state.endlessSeed}];
  state.tip = 'Endless — how far can you go?';
  resetRun();
  state.bestThis = scores.endless || 0;
  state.mode = 'play';
  hideOverlay();
  showHud(true);
}
function extendEndless(){
  var last = state.chunks[state.chunks.length-1];
  var seed = (last.seed * 1103515245 + 12345) >>> 0;
  var chunk = genEndlessChunk(seed, last.endX, heightAt(state.terrain, last.endX));
  // append skipping first point
  for(var i=1;i<chunk.pts.length;i++) state.terrain.push(chunk.pts[i]);
  chunk.stars.forEach(function(s){ state.stars.push({x:s.x,y:s.y,got:false}); });
  chunk.hazards.forEach(function(h){ state.hazards.push(h); });
  state.chunks.push({endX: chunk.endX, seed: seed});
  // prune old terrain far behind
  var minX = state.car.x - 800;
  while(state.terrain.length > 40 && state.terrain[1].x < minX) state.terrain.shift();
  state.stars = state.stars.filter(function(s){ return s.x > minX - 100 || !s.got; });
  state.hazards = state.hazards.filter(function(h){ return h.x > minX - 100; });
}

function resetRun(){
  var startY = heightAt(state.terrain, 40) - 20;

  state.airScoreAcc = 0; state.grade = '—';
  state.shake = 0; state.particles = []; state.popups = [];
  state.camX = 0; state.camY = startY - 100; state.camZoom = 1; state.camTilt = 0;
  state.time = 0; state.speedLines = 0;

/* ========== Update ========== */
function update(dt){
  if(state.mode !== 'play') return;
  var car = state.car;
  if(!car.alive){
    state.crashTimer += dt;
    if(state.crashTimer > 0.85){ resetRun(); }
    updateParticles(dt);
    updateCam(dt);
    return;
  }
  if(car.finished){
    state.winTimer += dt;
    updateParticles(dt);
    updateCam(dt);
    if(state.winTimer > 1.4) showResult(true);
    return;
  }

  state.time += dt;
  var lean = input.lean;
  if(input.tiltEnabled && input.tiltOk && Math.abs(input.tiltLean) > Math.abs(lean)) lean = input.tiltLean;
  updateLeanMeter();

  // Fuel regen
  if(!input.thrust) car.fuel = Math.min(1, car.fuel + dt * 0.22);
  else car.fuel = Math.max(0, car.fuel - dt * 0.38);

  var thrusting = input.thrust && car.fuel > 0.02;

  // Ground probe
  var gx = car.x;
  var groundY = heightAt(state.terrain, gx);
  var slope = slopeAt(state.terrain, gx);
  var carBottom = car.y + Math.sin(car.angle+Math.PI/2)*8; // approx
  // Use center offset
  var probeY = car.y + 14;

  if(car.grounded){
    car.airTime = 0;
    if(typeof car.speed !== 'number') car.speed = 0;
    var accel = input.gas ? 920 : -260;
    car.speed += accel * dt;
    if(!input.gas) car.speed *= Math.pow(0.035, dt);
    if(car.speed < 0) car.speed = 0;
    if(car.speed > 980) car.speed = 980;
    var speed = car.speed;
    car.vx = Math.cos(slope) * speed;
    car.vy = Math.sin(slope) * speed;
    // tighter ground sticking
    car.angle += (slope - car.angle) * Math.min(1, 18*dt);
    car.av *= 0.35;

    car.x = gx + speed * dt;
    car.y = heightAt(state.terrain, car.x) - 18;
    car.wheel += speed * dt * 0.08;

    var nextSlope = slopeAt(state.terrain, car.x + 12);
    var leave = false;
    if(thrusting) leave = true;
    // cleaner takeoffs over lips
    if(speed > 180 && (slope - nextSlope) > 0.08) leave = true;

    if(leave){
      car.grounded = false;
      car.vx = Math.cos(car.angle) * speed;
      car.vy = Math.sin(car.angle) * speed;
      if(speed > 160) car.vy -= Math.max(0, -Math.sin(slope)) * speed * 0.32 + 55;
      if(thrusting) car.vy -= 280;
    }
  } else {
    // Air
    car.airTime += dt;
    car.vy += 780 * dt; // slightly floatier for thruster fun
    car.av += lean * 12.5 * dt;
    var distGround = groundY - (car.y + 18);
    // stronger auto-right near ground when roughly upright / light lean
    if(distGround < 120 && Math.abs(lean) < 0.28){
      var angErr = Math.abs(normAngle(car.angle - slope));
      if(angErr < 1.2){
        car.angle += (slope - car.angle) * Math.min(1, 6.5*dt);
      }
    }
    car.av *= Math.pow(0.12, dt);
    car.angle += car.av * dt * 60 * 0.055 + lean * 4.4 * dt;

    if(thrusting){
      var thrust = 2200;
      car.vx += Math.cos(car.angle) * thrust * dt;
      car.vy += Math.sin(car.angle) * thrust * dt;
      spawnFlame(car, 7);
      state.speedLines = Math.min(1, state.speedLines + dt*4.5);
      state.camZoom = Math.min(1.22, state.camZoom + dt*0.75);
      state.shake = Math.max(state.shake, 0.18);
      if(Math.random()<0.28) audio.thrust();
      if(Math.random()<0.15) haptic(6);
    } else {
      state.speedLines = Math.max(0, state.speedLines - dt*1.8);
      state.camZoom += (1 - state.camZoom) * Math.min(1, 2.4*dt);
    }

    var sp = Math.hypot(car.vx, car.vy);
    if(sp > 1100){ car.vx *= 1100/sp; car.vy *= 1100/sp; }

    car.x += car.vx * dt;
    car.y += car.vy * dt;
    car.wheel += Math.hypot(car.vx, car.vy) * dt * 0.05;

    car.flipAcc += car.av * dt + lean * dt * 0.35;
    while(Math.abs(car.flipAcc) > Math.PI*2){
      car.flipAcc -= Math.sign(car.flipAcc) * Math.PI*2;
      car.flips++;
      addScore(150, car.flips + ' FLIP!');
      bumpMult();
      audio.flip(); haptic(18);
      state.shake = Math.max(state.shake, 0.22);
    }

    if(car.airTime > 0.35){
      state.airScoreAcc += dt * 48;
      if(state.airScoreAcc > 25){
        addScore(Math.floor(state.airScoreAcc), 'AIR');
        state.airScoreAcc = 0;
      }
    }

    groundY = heightAt(state.terrain, car.x);
    if(car.y + 18 >= groundY && car.vy > -50){
      var impact = Math.abs(car.vy);
      var angDiff = Math.abs(normAngle(car.angle - slope));
      // soft forgiveness: snap toward slope if close
      if(angDiff < 0.95) angDiff *= 0.72;
      car.y = groundY - 18;
      car.grounded = true;
      car.vy = 0;
      car.av = 0;
      car.angle = slope;
      var along = car.vx * Math.cos(slope);
      var keep = Math.max(along, Math.hypot(car.vx, 0) * 0.85);
      car.speed = Math.max(0, keep);
      car.vx = Math.cos(slope) * car.speed;
      car.vy = Math.sin(slope) * car.speed;
      if(angDiff < 0.78 && impact < 780){
        addScore(90 + Math.floor(car.airTime*70), 'CLEAN!');
        bumpMult();
        audio.land(); haptic(14);
        state.shake = Math.max(state.shake, 0.35 + Math.min(0.25, impact/2000));
        spawnLandBurst(car.x, car.y+18, true);
      } else if(angDiff > 2.15 || impact > 1450){
        crashCar();
      } else {
        addScore(35, 'LAND');
        audio.land();
        state.shake = Math.max(state.shake, 0.28);
        spawnLandBurst(car.x, car.y+18, false);
      }
      car.airTime = 0; car.flipAcc = 0;
    }
  }

  // Thruster hop from ground
  if(car.grounded && thrusting){
    car.fuel = Math.max(0, car.fuel - dt*0.2);
    car.grounded = false;
    car.vy = -380;
    car.vx += Math.cos(car.angle)*280;
    spawnFlame(car, 10);
    state.shake = Math.max(state.shake, 0.28);
    state.camZoom = Math.min(1.2, state.camZoom + 0.08);
    addScore(25, 'BOOST');
    audio.thrust(); haptic(12);
  }

  // Stars
  for(var i=0;i<state.stars.length;i++){
    var s = state.stars[i];
    if(s.got) continue;
    if(Math.hypot(s.x-car.x, s.y-car.y) < 42){
      s.got = true;
      car.fuel = Math.min(1, car.fuel + 0.28);
      addScore(100, 'STAR');
      bumpMult();
      audio.star(); haptic(12);
      spawnSparks(s.x, s.y, 10);
    }
  }

  // Hazards
  for(var i=0;i<state.hazards.length;i++){
    var h = state.hazards[i];
    if(car.x+12 > h.x && car.x-12 < h.x+h.w && car.y+10 > h.y && car.y-4 < h.y+h.h){
      crashCar();
      break;
    }
  }

  // Fall death
  if(car.y > 900) crashCar();

  // Finish
  if(!state.endless && car.x >= state.finish){
    car.finished = true;
    car.vx *= 0.3;
    audio.win(); haptic([20,40,20]);
    addScore(500, 'FINISH!');
  }

  // Endless extend
  if(state.endless){
    var last = state.chunks[state.chunks.length-1];
    if(car.x > last.endX - 900) extendEndless();
  }

  // Combo decay
  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0){
      state.mult = 1;
      document.getElementById('combo').style.opacity = '0';
    }
  }

  // Grade
  state.grade = gradeFor(state.score, state.endless);

  state.shake = Math.max(0, state.shake - dt);
  updateParticles(dt);
  updateCam(dt);

  // HUD
  document.getElementById('scorePanel').textContent = String(state.score);
  document.getElementById('multPanel').textContent = '×' + state.mult.toFixed(1).replace(/\.0$/,'');
  document.getElementById('gradePanel').textContent = state.grade;
  document.getElementById('fuelFill').style.width = Math.floor(car.fuel*100) + '%';
}

function normAngle(a){
  while(a > Math.PI) a -= Math.PI*2;
  while(a < -Math.PI) a += Math.PI*2;
  return a;
}
function crashCar(){
  var car = state.car;
  if(!car.alive || car.finished) return;
  car.alive = false;
  state.crashTimer = 0;
  state.shake = 0.5;
  state.mult = 1;
  document.getElementById('combo').style.opacity = '0';
  audio.crash(); haptic([30,50,30]);
  spawnSparks(car.x, car.y, 18);
  pushPopup('OOPS!', 0);
}
function gradeFor(score, endless){
  if(endless){
    if(score > 20000) return 'S';
    if(score > 10000) return 'A';
    if(score > 5000) return 'B';
    if(score > 2000) return 'C';
    return 'D';
  }
  if(score >= 3500) return 'S';
  if(score >= 2200) return 'A';
  if(score >= 1400) return 'B';
  if(score >= 800) return 'C';
  return 'D';
}
function updateParticles(dt){
  for(var i=state.particles.length-1;i>=0;i--){
    var p = state.particles[i];
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 200*dt;
    if(p.life <= 0) state.particles.splice(i,1);
  }
}
function updateCam(dt){
  var car = state.car;
  var tx = car.x - W*0.35;
  var ty = car.y - H*0.55;
  // slight lag follow (snappier when thrusting)
  var follow = (input.thrust && car.fuel > 0.02) ? 4.2 : 3.2;
  state.camX += (tx - state.camX) * Math.min(1, follow*dt);
  state.camY += (ty - state.camY) * Math.min(1, (follow*0.85)*dt);
  // slight camera tilt with car on big jumps
  var wantTilt = 0;
  if(!car.grounded && car.airTime > 0.2){
    wantTilt = Math.max(-0.12, Math.min(0.12, car.angle * 0.18));
  }
  state.camTilt += (wantTilt - state.camTilt) * Math.min(1, 4*dt);
}

/* ========== Draw ========== */
function draw(){
  var g = ctx;
  g.setTransform(DPR,0,0,DPR,0,0);
  var th = themeFor();
  var sky = th.sky;
  var grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, sky[0]);
  grad.addColorStop(0.45, sky[1]);
  grad.addColorStop(0.7, sky[2]);
  grad.addColorStop(1, sky[3]);
  g.fillStyle = grad;
  g.fillRect(0,0,W,H);

  drawHills(g, th);

  g.save();
  var shakeAmp = state.shake ? state.shake*36 : 0;
  var sx = shakeAmp ? (Math.random()-0.5)*shakeAmp : 0;
  var sy = shakeAmp ? (Math.random()-0.5)*shakeAmp : 0;
  g.translate(W/2 + sx, H/2 + sy);
  if(state.camTilt) g.rotate(state.camTilt);
  g.scale(state.camZoom, state.camZoom);
  g.translate(-W/2, -H/2);
  g.translate(-state.camX, -state.camY);

  drawTerrain(g);
  drawHazards(g);
  drawStars(g);
  if(!state.endless) drawFinish(g);
  drawParticles(g);
  if(state.car) drawCar(g, state.car);
  if(state.speedLines > 0.05 && state.car) drawSpeedLines(g, state.car);

  g.restore();

  if(state.mode==='play' && state.tip && state.time < 4){
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.font = '600 16px system-ui';
    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.fillText(state.tip, W/2, H - 100);
  }
}
function drawHills(g, th){
  th = th || themeFor();
  g.fillStyle = th.hill1;
  g.beginPath(); g.moveTo(0,H);
  for(var i=0;i<=10;i++){
    var x = i/10*W;
    var y = H*0.62 + Math.sin(i*0.9 + state.camX*0.0003)*40 + Math.cos(i*1.3)*20;
    g.lineTo(x,y);
  }
  g.lineTo(W,H); g.closePath(); g.fill();
  g.fillStyle = th.hill2;
  g.beginPath(); g.moveTo(0,H);
  for(var i=0;i<=10;i++){
    var x = i/10*W;
    var y = H*0.72 + Math.sin(i*1.2 + state.camX*0.0006)*30;
    g.lineTo(x,y);
  }
  g.lineTo(W,H); g.closePath(); g.fill();
}
function drawTerrain(g){
  var pts = state.terrain;
  if(pts.length < 2) return;
  var th = themeFor();
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for(var i=1;i<pts.length;i++) g.lineTo(pts[i].x, pts[i].y);
  g.lineTo(pts[pts.length-1].x, pts[pts.length-1].y + 800);
  g.lineTo(pts[0].x, pts[0].y + 800);
  g.closePath();
  var dg = g.createLinearGradient(0, pts[0].y-40, 0, pts[0].y+500);
  dg.addColorStop(0, th.dirt[0]);
  dg.addColorStop(1, th.dirt[1]);
  g.fillStyle = dg;
  g.fill();
  g.strokeStyle = th.grass;
  g.lineWidth = 7;
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for(var i=1;i<pts.length;i++) g.lineTo(pts[i].x, pts[i].y);
  g.stroke();
  g.strokeStyle = th.grassHi;
  g.lineWidth = 2.5;
  g.stroke();
}
function drawHazards(g){
  for(var i=0;i<state.hazards.length;i++){
    var h = state.hazards[i];
    // glow
    g.fillStyle = 'rgba(255,60,40,0.25)';
    g.beginPath(); g.arc(h.x+h.w/2, h.y+h.h/2, Math.max(h.w,h.h)*0.9, 0, Math.PI*2); g.fill();
    g.fillStyle = '#ff3a3a';
    g.strokeStyle = '#fff';
    g.lineWidth = 3;
    g.fillRect(h.x, h.y, h.w, h.h);
    g.strokeRect(h.x, h.y, h.w, h.h);
    g.fillStyle = '#ffe66a';
    g.font = 'bold 16px system-ui';
    g.textAlign = 'center';
    g.fillText('!', h.x+h.w/2, h.y+h.h/2+6);
  }
}
function drawStars(g){
  var t = state.time;
  for(var i=0;i<state.stars.length;i++){
    var s = state.stars[i];
    if(s.got) continue;
    var bob = Math.sin(t*4 + i)*6;
    g.save();
    g.translate(s.x, s.y + bob);
    g.rotate(t*2);
    drawStarShape(g, 0, 0, 5, 17, 7);
    g.restore();
  }
}
function drawStarShape(g,x,y,n,R,r){
  g.save();
  g.shadowColor = '#ffd76a';
  g.shadowBlur = 12;
  g.beginPath();
  for(var i=0;i<n*2;i++){
    var rad = (i%2===0)?R:r;
    var a = -Math.PI/2 + i*Math.PI/n;
    g[i?'lineTo':'moveTo'](x+Math.cos(a)*rad, y+Math.sin(a)*rad);
  }
  g.closePath();
  g.fillStyle = '#ffe566';
  g.strokeStyle = '#fff';
  g.lineWidth = 2.5;
  g.fill(); g.stroke();
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.beginPath(); g.arc(x-3, y-4, 3, 0, Math.PI*2); g.fill();
  g.restore();
}
function drawFinish(g){
  var x = state.finish;
  var y = heightAt(state.terrain, x);
  g.fillStyle = 'rgba(255,255,255,0.9)';
  for(var i=0;i<8;i++){
    for(var j=0;j<10;j++){
      g.fillStyle = ((i+j)%2) ? '#111' : '#fff';
      g.fillRect(x + i*10, y - 100 + j*10, 10, 10);
    }
  }
  g.fillStyle = '#4af';
  g.font = 'bold 18px system-ui';
  g.fillText('FINISH', x, y - 110);
}
function drawParticles(g){
  for(var i=0;i<state.particles.length;i++){
    var p = state.particles[i];
    g.globalAlpha = Math.max(0, p.life / (p.max||0.5));
    g.fillStyle = p.col;
    g.beginPath();
    g.arc(p.x, p.y, p.r, 0, Math.PI*2);
    g.fill();
  }
  g.globalAlpha = 1;
}
function drawSpeedLines(g, car){
  var a = 0.25 + 0.45*state.speedLines;
  g.strokeStyle = 'rgba(200,230,255,'+a+')';
  g.lineWidth = 2.5;
  for(var i=0;i<14;i++){
    var ox = -30 - i*22 - (state.time*520%50);
    var oy = (i-7)*12 + Math.sin(state.time*8+i)*3;
    var len = 30 + 50*state.speedLines;
    g.beginPath();
    g.moveTo(car.x+ox, car.y+oy);
    g.lineTo(car.x+ox-len, car.y+oy);
    g.stroke();
  }
  // warm core streaks when thrusting hard
  if(state.speedLines > 0.5){
    g.strokeStyle = 'rgba(255,180,80,'+(0.2*state.speedLines)+')';
    g.lineWidth = 3;
    for(var j=0;j<4;j++){
      var ox2 = -20 - j*40 - (state.time*600%40);
      g.beginPath();
      g.moveTo(car.x+ox2, car.y+(j-1.5)*10);
      g.lineTo(car.x+ox2-70*state.speedLines, car.y+(j-1.5)*10);
      g.stroke();
    }
  }
}
function drawCar(g, car){
  g.save();
  g.translate(car.x, car.y);
  g.rotate(car.angle);
  if(!car.alive) g.rotate(state.crashTimer * 8);

  // shadow
  g.fillStyle = 'rgba(0,0,0,0.28)';
  g.beginPath(); g.ellipse(0, 22, 34, 7, 0, 0, Math.PI*2); g.fill();

  // --- Ano White 2026-style angular Roadster ---
  // lower belly / rocker
  g.fillStyle = '#1a1c22';
  g.beginPath();
  g.moveTo(30, 8);
  g.lineTo(-30, 8);
  g.lineTo(-34, 12);
  g.lineTo(26, 12);
  g.closePath();
  g.fill();

  // main wedge body
  g.fillStyle = '#f2f4f8';
  g.strokeStyle = '#b8bcc8';
  g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(36, 2);     // sharp nose tip
  g.lineTo(22, -6);    // hood rise
  g.lineTo(12, -11);   // windshield base
  g.lineTo(-6, -13);   // roof peak (low wedge)
  g.lineTo(-22, -9);   // rear deck
  g.lineTo(-30, -4);   // haunches
  g.lineTo(-34, 4);    // rear bumper
  g.lineTo(-30, 10);   // diffuser lip
  g.lineTo(24, 10);    // belly
  g.lineTo(34, 6);     // nose underside
  g.closePath();
  g.fill(); g.stroke();

  // side panel crease
  g.strokeStyle = 'rgba(0,0,0,0.14)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(18, 1); g.lineTo(-18, 1); g.stroke();
  g.beginPath(); g.moveTo(8, -3); g.lineTo(-12, -5); g.stroke();

  // canopy (dark glass)
  g.fillStyle = 'rgba(28,42,68,0.72)';
  g.beginPath();
  g.moveTo(12, -2);
  g.lineTo(8, -10);
  g.lineTo(-4, -12);
  g.lineTo(-8, -3);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(180,210,255,0.35)';
  g.stroke();

  // full-width front light bar
  g.save();
  g.shadowColor = '#9cf';
  g.shadowBlur = 14;
  g.fillStyle = '#f0faff';
  g.fillRect(28, -1, 8, 7);
  g.fillStyle = '#b8e8ff';
  g.fillRect(29, 0, 6, 5);
  g.restore();

  // rear full-width light bar
  g.save();
  g.shadowColor = '#ff4060';
  g.shadowBlur = 10;
  g.fillStyle = '#ff3355';
  g.fillRect(-34, -1, 5, 7);
  g.restore();

  // subtle active wing
  g.fillStyle = '#e6e8ee';
  g.strokeStyle = '#a8acb4';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-28, -15);
  g.lineTo(-8, -16);
  g.lineTo(-8, -13);
  g.lineTo(-28, -12);
  g.closePath();
  g.fill(); g.stroke();
  // wing stalk
  g.fillStyle = '#d0d2d8';
  g.fillRect(-16, -13, 3, 7);

  // prominent rear diffuser plate
  g.fillStyle = '#2a2e38';
  g.fillRect(-34, 6, 14, 6);
  g.strokeStyle = '#111';
  g.strokeRect(-34, 6, 14, 6);

  // 4 gold thruster nozzles
  for(var i=0;i<4;i++){
    var ox = -31;
    var oy = 7.2 + i*1.35;
    g.fillStyle = '#e0b020';
    g.beginPath(); g.arc(ox, oy, 2.4, 0, Math.PI*2); g.fill();
    g.fillStyle = '#1a1000';
    g.beginPath(); g.arc(ox, oy, 1.2, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(255,220,120,0.5)';
    g.lineWidth = 0.8;
    g.beginPath(); g.arc(ox, oy, 2.4, 0, Math.PI*2); g.stroke();
  }

  // wheels (deeper wells)
  drawWheel(g, 16, 13, car.wheel);
  drawWheel(g, -14, 13, car.wheel);

  // thruster flame plumes (white/blue + orange core)
  if(input.thrust && car.fuel > 0.02 && car.alive){
    for(var i=0;i<4;i++){
      var oy = 7.2 + i*1.35;
      var len = 22 + Math.random()*28;
      var grd = g.createLinearGradient(-31, oy, -31-len, oy);
      grd.addColorStop(0, '#fff');
      grd.addColorStop(0.2, '#c8f0ff');
      grd.addColorStop(0.45, '#5bf');
      grd.addColorStop(0.7, '#ff9030');
      grd.addColorStop(1, 'rgba(255,100,20,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(-31, oy-2.6);
      g.lineTo(-31-len, oy + (Math.random()-0.5)*4);
      g.lineTo(-31, oy+2.6);
      g.closePath();
      g.fill();
    }
    // outer glow bloom
    g.save();
    g.globalAlpha = 0.35;
    g.fillStyle = '#6cf';
    g.beginPath(); g.arc(-40, 9, 10+Math.random()*6, 0, Math.PI*2); g.fill();
    g.fillStyle = '#ff8020';
    g.beginPath(); g.arc(-48, 9, 6+Math.random()*4, 0, Math.PI*2); g.fill();
    g.restore();
  }

  g.restore();
}
function drawWheel(g,x,y,rot){
  g.save();
  g.translate(x,y);
  g.rotate(rot);
  g.fillStyle = '#1a1a1a';
  g.beginPath(); g.arc(0,0,7,0,Math.PI*2); g.fill();
  g.strokeStyle = '#888';
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(0,0,4,0,Math.PI*2); g.stroke();
  g.strokeStyle = '#aaa';
  g.beginPath(); g.moveTo(-3,0); g.lineTo(3,0); g.moveTo(0,-3); g.lineTo(0,3); g.stroke();
  g.restore();
}

/* ========== UI screens ========== */
var overlay = document.getElementById('overlay');
var card = document.getElementById('card');
function hideOverlay(){ overlay.classList.add('hidden'); }
function showOverlay(){ overlay.classList.remove('hidden'); }

function showTitle(){
  state.mode = 'title';
  showHud(false);
  showOverlay();
  card.innerHTML =
    '<h1>Roadster Stunt Paradise</h1>'+
    '<p class="sub">Ano White Roadster · powerful thrusters · flips · stars<br>Landscape · thumb controls · whole family</p>'+
    '<div class="btnRow">'+
    '<button class="menu" id="btnPlay">PLAY</button>'+
    '<button class="menu secondary" id="btnLevels">LEVELS</button>'+
    '<button class="menu gold" id="btnEndless">ENDLESS</button>'+
    '</div>'+
    '<p class="sub" style="margin-top:18px">Best Endless: <b>'+(scores.endless||0)+'</b></p>'+
    '<p class="sub" style="font-size:12px;opacity:.55;margin-top:8px">Left: Lean · Right: Gas · Big blue: Thrust · TILT toggle in-game<br>Keys: A/D lean · W/Space gas · Shift thrust · P pause</p>';
  document.getElementById('btnPlay').onclick = function(){ audio.gesture(); audio.ui(); askTilt(); startLevel(0); };
  document.getElementById('btnLevels').onclick = function(){ audio.gesture(); audio.ui(); showLevels(); };
  document.getElementById('btnEndless').onclick = function(){ audio.gesture(); audio.ui(); askTilt(); startEndless(); };
}

function showLevels(){
  state.mode = 'levels';
  showHud(false);
  showOverlay();
  var grid = '<div id="levelGrid">';
  for(var i=0;i<LEVELS.length;i++){
    var best = scores.levels[i] || 0;
    grid += '<button class="lvlBtn" data-i="'+i+'">'+ (i+1) +'<small>'+(best?best:'—')+'</small></button>';
  }
  grid += '</div>';
  card.innerHTML =
    '<h1>Levels</h1>'+
    '<p class="sub">10 stunt courses · short runs · one more try</p>'+
    grid+
    '<div class="btnRow"><button class="menu secondary" id="btnBack">BACK</button></div>';
  card.querySelectorAll('.lvlBtn').forEach(function(b){
    b.onclick = function(){ audio.gesture(); audio.ui(); askTilt(); startLevel(+b.getAttribute('data-i')); };
  });
  document.getElementById('btnBack').onclick = function(){ audio.ui(); showTitle(); };
}

function togglePause(){
  if(state.mode === 'play'){
    state.mode = 'pause';
    showOverlay();
    card.innerHTML =
      '<h1>Paused</h1>'+
      '<div class="btnRow">'+
      '<button class="menu" id="btnResume">RESUME</button>'+
      '<button class="menu secondary" id="btnRestart">RESTART</button>'+
      '<button class="menu secondary" id="btnQuit">QUIT</button>'+
      '</div>';
    document.getElementById('btnResume').onclick = function(){ audio.ui(); state.mode='play'; hideOverlay(); };
    document.getElementById('btnRestart').onclick = function(){ audio.ui(); hideOverlay(); resetRun(); state.mode='play'; };
    document.getElementById('btnQuit').onclick = function(){ audio.ui(); showTitle(); };
  } else if(state.mode === 'pause'){
    state.mode = 'play';
    hideOverlay();
  }
}
document.getElementById('pauseBtn').onclick = function(){ audio.gesture(); audio.ui(); togglePause(); };

function showResult(won){
  state.mode = 'result';
  showHud(false);
  // save scores
  if(state.endless){
    if(state.score > (scores.endless||0)){ scores.endless = state.score; saveScores(scores); }
  } else {
    var i = state.levelIndex;
    if(state.score > (scores.levels[i]||0)){ scores.levels[i] = state.score; saveScores(scores); }
  }
  showOverlay();
  var title = won ? 'FINISH!' : 'Run Over';
  var next = state.levelIndex + 1;
  var hasNext = !state.endless && won && next < LEVELS.length;
  var gradeTip = {S:'LEGENDARY!', A:'So close to S!', B:'Nice run!', C:'Warming up', D:'One more try!'}[state.grade] || 'One more try!';
  card.innerHTML =
    '<h1>'+title+'</h1>'+
    '<div class="gradeHero">'+state.grade+'</div>'+
    '<p class="oneMore">'+gradeTip+'</p>'+
    '<p class="sub">Score <b>'+state.score+'</b>'+
    (state.bestThis ? ' · Best <b>'+Math.max(state.bestThis, state.score)+'</b>' : '')+'</p>'+
    '<div class="btnRow">'+
    (hasNext ? '<button class="menu gold" id="btnNext">NEXT LEVEL ▶</button>' : '')+
    '<button class="menu '+(hasNext?'secondary':'gold')+'" id="btnAgain">'+(state.endless?'ONE MORE RUN':'ONE MORE TRY')+'</button>'+
    '<button class="menu secondary" id="btnMenu">MENU</button>'+
    '</div>';
  if(hasNext) document.getElementById('btnNext').onclick = function(){ audio.ui(); startLevel(next); };
  document.getElementById('btnAgain').onclick = function(){
    audio.ui();
    if(state.endless) startEndless();
    else startLevel(state.levelIndex);
  };
  document.getElementById('btnMenu').onclick = function(){ audio.ui(); showTitle(); };
}

/* ========== Loop ========== */
var last = performance.now();
var acc = 0;
var STEP = 1/120; // 120Hz logic for ProMotion
function frame(now){
  var dt = Math.min(0.05, (now - last)/1000);
  last = now;
  acc += dt;
  try {
    while(acc >= STEP){
      update(STEP);
      acc -= STEP;
    }
    draw();
  } catch (err) {
    try { console.error('RSP frame', err); } catch (e2) {}
    acc = 0;
  }
  requestAnimationFrame(frame);
}

/* Endless distance scoring helper — award passive distance */
var lastDistScore = 0;
var _update = update;
update = function(dt){
  _update(dt);
  if(state.mode==='play' && state.endless && state.car && state.car.alive){
    var d = Math.floor(state.car.x / 20);
    if(d > lastDistScore){
      state.score += (d - lastDistScore);
      lastDistScore = d;
    }
  } else if(!state.endless){
    lastDistScore = 0;
  }
};

/* Debug/test API */
window.__RSP = {
  state: function(){ return {
    mode: state.mode, score: state.score, mult: state.mult, grade: state.grade,
    endless: state.endless, levelIndex: state.levelIndex,
    fuel: state.car ? state.car.fuel : 0,
    alive: state.car ? state.car.alive : false,
    finished: state.car ? state.car.finished : false,
    grounded: state.car ? state.car.grounded : false,
    x: state.car ? state.car.x : 0, y: state.car ? state.car.y : 0,
    vx: state.car ? state.car.vx : 0, airTime: state.car ? state.car.airTime : 0,
    flips: state.car ? state.car.flips : 0,
    starsLeft: state.stars.filter(function(s){return !s.got;}).length,
    levels: LEVELS.length
  }; },
  input: input,
  startLevel: startLevel,
  startEndless: startEndless,
  showTitle: showTitle,
  showLevels: showLevels,
  scores: function(){ return JSON.parse(JSON.stringify(scores)); },
  audioGesture: function(){ return audio.gesture(); },
  setTilt: setTiltEnabled,
  version: 'v2',
  forceFinish: function(){
    if(!state.car) return;
    state.car.finished = true;
    state.winTimer = 1.5;
    state.score = Math.max(state.score, 2500);
    state.grade = gradeFor(state.score, state.endless);
    showResult(true);
  },
  forceLean: function(v){ input.lean = v; updateLeanMeter(); }
};

showTitle();
requestAnimationFrame(frame);

/* First gesture unlock anywhere */
document.addEventListener('touchstart', function(){ audio.gesture(); }, {once:false, passive:true});
document.addEventListener('mousedown', function(){ audio.gesture(); }, {once:false});

})();
</script>
